name: Daemon / CI

on:
  # Pull requests always start this workflow so that its required result check is reported;
  # the changes job decides whether the daemon jobs run. Keep its pattern in step with these paths.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'daemon/**'
      - 'VERSION'
      - '.gitmodules'
      - '.github/workflows/daemon-*.yml'
      - '.github/actions/linux-daemon-*/**'
      - '.github/scripts/linux-daemon-cache-key.sh'
      - 'cli/**'
      - 'common/**'
      - 'api/**'
      - 'core/**'
      - '.github/workflows/core-sdk.yml'
      - '.github/actions/core-sdk/**'
      - '.github/scripts/check-core-boundary.py'
  workflow_dispatch:
    inputs:
      core_build_type:
        description: SDK and daemon configuration
        type: choice
        options: [RelWithDebInfo, Release]
        default: RelWithDebInfo
      core_packages:
        description: Core packages for the Ubuntu package build (ppa checks a release candidate against Launchpad)
        type: choice
        options: [source, ppa]
        default: source

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      daemon: ${{ steps.select.outputs.daemon }}
    env:
      SCOPED: ${{ github.event_name == 'pull_request' }}
    steps:
      - if: env.SCOPED == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        name: Select jobs from the changed paths
        run: |
          if [[ "$SCOPED" != true ]]; then
            echo "daemon=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The pull request merge commit's parents are the base and the pull request head.
          changed=$(git diff --name-only HEAD^1...HEAD^2)
          printf '%s\n' "$changed"
          if grep -qE '^(daemon/|cli/|common/|api/|core/|VERSION$|\.gitmodules$|\.github/workflows/daemon-|\.github/workflows/core-sdk\.yml$|\.github/actions/core-sdk/|\.github/actions/linux-daemon-|\.github/scripts/linux-daemon-cache-key\.sh$|\.github/scripts/check-core-boundary\.py$)' <<< "$changed"; then
            echo "daemon=true" >> "$GITHUB_OUTPUT"
          else
            echo "daemon=false" >> "$GITHUB_OUTPUT"
          fi
  resolve:
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-24.04
    outputs:
      daemon_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate SDK configuration
        env:
          BUILD_TYPE: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
        run: |
          case "$BUILD_TYPE" in
            RelWithDebInfo|Release) ;;
            *) echo "Unsupported SDK configuration: $BUILD_TYPE" >&2; exit 1 ;;
          esac
      - id: source
        name: Record daemon source revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  checks:
    # Fast checks that need no build: no paths across the core boundary, and make.sh's core selection.
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the core boundary
        run: python3 .github/scripts/check-core-boundary.py
      - name: Test make.sh's core selection
        working-directory: daemon
        run: python3 -m unittest scripts/test_make.py -v
  core-sdk:
    # The daemon builds against core from this same commit, through core's installed SDK.
    needs: resolve
    uses: ./.github/workflows/core-sdk.yml
    with:
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
  linux:
    needs: [resolve, core-sdk]
    uses: ./.github/workflows/daemon-linux-backend.yml
    with:
      core_commit: ${{ needs.core-sdk.outputs.commit }}
      daemon_commit: ${{ needs.resolve.outputs.daemon_commit }}
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
  macos:
    needs: [resolve, core-sdk]
    uses: ./.github/workflows/daemon-macos-backend.yml
    with:
      core_commit: ${{ needs.core-sdk.outputs.commit }}
      daemon_commit: ${{ needs.resolve.outputs.daemon_commit }}
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
  windows:
    needs: [resolve, core-sdk]
    uses: ./.github/workflows/daemon-windows-backend.yml
    with:
      core_commit: ${{ needs.core-sdk.outputs.commit }}
      daemon_commit: ${{ needs.resolve.outputs.daemon_commit }}
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
  ubuntu-packages:
    if: github.repository == 'HolderTeam/holder' && inputs.core_build_type != 'Release'
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            series: noble
          - image: ubuntu:26.04
            series: resolute
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 45
    env:
      # The package is built from daemon/ copied out on its own, as the Debian source package is,
      # so a file the build reads from beside daemon/ shows up here instead of on Launchpad.
      EXPORTED_DAEMON: /tmp/export/daemon
      # By default libholder packages are built here from core/ in this commit, the same core the
      # other jobs use, so a daemon change needing new core does not wait on Launchpad. The ppa
      # choice builds against the published Launchpad packages instead, as users install them.
      CORE_PACKAGES: ${{ inputs.core_packages || 'source' }}
    steps:
      - name: Install packaging tools and configure package source
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates software-properties-common git devscripts equivs debhelper cmake ninja-build
          # The PPA also provides daemon build dependencies that Ubuntu does not, such as libcaste-dev.
          add-apt-repository -y ppa:holderteam/holder
          if [ "$CORE_PACKAGES" = source ]; then
            # Only the core packages built below may satisfy libholder.
            printf 'Package: libholder0 libholder-dev\nPin: release o=LP-PPA-holderteam-holder\nPin-Priority: -1\n' \
              > /etc/apt/preferences.d/no-ppa-libholder
          fi
          apt-get update
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.daemon_commit }}
          persist-credentials: false
      - name: Build and install core packages from core/ in this commit
        if: env.CORE_PACKAGES == 'source'
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          SERIES: ${{ matrix.series }}
          CORE_COMMIT: ${{ needs.resolve.outputs.daemon_commit }}
        working-directory: core
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          cp -a packaging/linux/debian debian
          # Version the packages from VERSION as the Launchpad upload does, so the daemon's
          # libholder-dev requirement is checked against the core being built.
          cat > debian/changelog <<EOF
          holder-core (${version}-1~${SERIES}1) ${SERIES}; urgency=medium

            * Build libholder packages from core ${CORE_COMMIT}.

           -- Holder Team <holdercardteam@gmail.com>  $(date -R)
          EOF
          mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' debian/control
          dpkg-buildpackage -b -us -uc -j2
          apt-get install -y --no-install-recommends ../libholder0_*.deb ../libholder-dev_*.deb
      - name: Export daemon/ on its own, as the Debian source package sees it
        run: |
          mkdir -p "$(dirname "${EXPORTED_DAEMON}")"
          cp -a daemon "${EXPORTED_DAEMON}"
          daemon/packaging/linux/prepare-source-tree.sh "${GITHUB_WORKSPACE}" "${EXPORTED_DAEMON}"
      - name: Build daemon against the installed core packages
        env:
          DEBIAN_FRONTEND: noninteractive
        working-directory: ${{ env.EXPORTED_DAEMON }}
        run: |
          cp -a packaging/linux/debian debian
          mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' debian/control
          dpkg-buildpackage -b -us -uc -j2
      - name: Verify shared core linkage and package dependency
        shell: bash
        working-directory: ${{ env.EXPORTED_DAEMON }}
        run: |
          ldd build/holderd | grep 'libholder.so.0'
          ldd build/holderctl | grep 'libholder.so.0'
          package=$(find .. -maxdepth 1 -name 'holder-daemon_*.deb' -print -quit)
          # holderd uses core's C++ headers, so it must require libholder0 of the same upstream version.
          upstream=$(dpkg-query -W -f='${source:Upstream-Version}' libholder0)
          depends=$(dpkg-deb -f "$package" Depends)
          echo "$depends"
          grep -F "libholder0 (>= ${upstream})" <<< "$depends"
          grep -F "libholder0 (<< ${upstream}.~)" <<< "$depends"
          test ! -d build/holder-core
          dpkg -i "$package"
          holderd --version
          holderctl --help
          mkdir -p out/ubuntu-packages
          cp "$package" out/ubuntu-packages/
      - uses: actions/upload-artifact@v4
        with:
          name: holder-daemon-${{ matrix.series }}-packages
          path: ${{ env.EXPORTED_DAEMON }}/out/ubuntu-packages/*.deb
          if-no-files-found: error
  result:
    name: Daemon CI result
    # The required check. It runs even when jobs fail or are skipped, and passes only when every
    # selected job succeeded and no job ran that was not selected.
    if: always()
    needs: [changes, checks, resolve, core-sdk, linux, macos, windows, ubuntu-packages]
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          SELECTED: ${{ needs.changes.outputs.daemon }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e --arg selected "$SELECTED" '
            .changes.result == "success" and
            (if $selected == "true" then
               ([.checks, .resolve, .["core-sdk"], .linux, .macos, .windows] | all(.result == "success")) and
               (.["ubuntu-packages"].result | IN("success", "skipped"))
             else
               ([.checks, .resolve, .["core-sdk"], .linux, .macos, .windows, .["ubuntu-packages"]] | all(.result == "skipped"))
             end)' <<< "$RESULTS" > /dev/null
