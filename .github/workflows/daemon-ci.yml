name: Daemon / CI

# Shared automatic SDK producer and consumer coordinator. This filename is also
# the staging/promotion run identity; standalone Release dispatch stays here.
on:
  # Preview on implementation branches; enable PR/main triggers after the probes pass.
  push:
    branches: [ci/114-shared-core-sdk, ci/114-core-failure, ci/114-daemon-only, ci/114-no-consumers]
  workflow_dispatch:
    inputs:
      scope:
        description: Manual work selection (daemon preserves the standalone release entrypoint)
        type: choice
        options: [daemon, all, core, kit, python, none, changed]
        default: daemon
      core_build_type:
        description: Release is supported with the manual daemon scope
        type: choice
        options: [RelWithDebInfo, Release]
        default: RelWithDebInfo
      core_packages:
        description: Core packages for the daemon Ubuntu package build
        type: choice
        options: [source, ppa]
        default: source

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.select.outputs.core }}
      daemon: ${{ steps.select.outputs.daemon }}
      kit: ${{ steps.select.outputs.kit }}
      python: ${{ steps.select.outputs.python }}
      sdk: ${{ steps.select.outputs.sdk }}
      all_platforms: ${{ steps.select.outputs.all_platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI selection and provenance policy
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - id: select
        name: Select core and SDK consumers
        env:
          SCOPE: ${{ inputs.scope || 'changed' }}
          BUILD_TYPE: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
        run: python3 .github/scripts/select-sdk-ci.py --scope "$SCOPE" --build-type "$BUILD_TYPE"

  core:
    # These configurations build core directly; they do not need the SDK first.
    needs: select
    if: needs.select.outputs.core == 'true'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-ci.yml
    with:
      external_sdk: true

  sdk-linux:
    needs: select
    if: needs.select.outputs.sdk == 'true'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-sdk.yml
    with:
      platforms: '["linux"]'
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
      selection_artifact: core-selection-linux-${{ inputs.core_build_type || 'RelWithDebInfo' }}

  sdk-macos:
    needs: select
    if: needs.select.outputs.all_platforms == 'true'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-sdk.yml
    with:
      platforms: '["macos"]'
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
      selection_artifact: core-selection-macos-${{ inputs.core_build_type || 'RelWithDebInfo' }}

  sdk-windows:
    needs: select
    if: needs.select.outputs.all_platforms == 'true'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-sdk.yml
    with:
      platforms: '["windows"]'
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
      selection_artifact: core-selection-windows-${{ inputs.core_build_type || 'RelWithDebInfo' }}

  core-sdk:
    # One combined provenance artifact for staging, SDK promotion, Daemon and Kit.
    needs: [select, sdk-linux, sdk-macos, sdk-windows]
    if: >-
      always() && needs.select.result == 'success' && needs.select.outputs.sdk == 'true' &&
      needs.sdk-linux.result == 'success' &&
      (needs.select.outputs.all_platforms != 'true' ||
       (needs.sdk-macos.result == 'success' && needs.sdk-windows.result == 'success'))
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.index.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: core-sdk-*-${{ inputs.core_build_type || 'RelWithDebInfo' }}
          path: out/core-sdk-assets
          merge-multiple: true
      - id: index
        name: Index the shared SDKs from this checkout
        env:
          PLATFORMS: ${{ needs.select.outputs.all_platforms == 'true' && '["linux","macos","windows"]' || '["linux"]' }}
          BUILD_TYPE: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
        run: |
          python3 core/scripts/core-sdk.py index --assets out/core-sdk-assets \
            --output out/core-selection.json --commit "$(git rev-parse HEAD)" --tree "$(git rev-parse HEAD:core)"
          python3 .github/scripts/verify-shared-sdk.py --commit "$(git rev-parse HEAD)" \
            --build-type "$BUILD_TYPE" --platforms "$PLATFORMS"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: core-selection
          path: out/core-selection.json
          if-no-files-found: error
          retention-days: 7

  daemon:
    needs: [select, core-sdk]
    if: needs.select.outputs.daemon == 'true'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/daemon-jobs.yml
    with:
      shared_sdk_commit: ${{ needs.core-sdk.outputs.commit }}
      core_build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
      core_packages: ${{ inputs.core_packages || 'source' }}

  kit:
    needs: [select, core-sdk]
    if: needs.select.outputs.kit == 'true'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/kit-ci.yml
    with:
      shared_sdk_commit: ${{ needs.core-sdk.outputs.commit }}

  python:
    # Python's live daemon uses only the Linux SDK, so do not wait for Windows.
    needs: [select, sdk-linux]
    if: needs.select.outputs.python == 'true'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/python-check.yml
    with:
      shared_sdk_commit: ${{ needs.sdk-linux.outputs.commit }}
      shared_sdk_selection: core-selection-linux-RelWithDebInfo

  publish-sdk:
    needs: [select, core, core-sdk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.select.outputs.core == 'true'
    uses: ./.github/workflows/core-sdk-publish.yml

  core-result:
    name: Core CI result
    needs: [select, core-sdk, core]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check selected work and prerequisites
        env:
          SELECTED: ${{ needs.select.outputs.core }}
          SDK_SELECTED: ${{ needs.select.outputs.sdk }}
          SDK_JOB: core-sdk
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/sdk-ci-result.py core

  daemon-result:
    name: Daemon CI result
    needs: [select, core-sdk, daemon]
    if: always() && (needs.select.result != 'success' || needs.select.outputs.daemon != 'true' || needs.core-sdk.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check selected work and prerequisites
        env:
          SELECTED: ${{ needs.select.outputs.daemon }}
          SDK_SELECTED: ${{ needs.select.outputs.sdk }}
          SDK_JOB: core-sdk
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/sdk-ci-result.py daemon

  kit-result:
    name: Kit CI result
    needs: [select, core-sdk, kit]
    if: always() && (needs.select.result != 'success' || needs.select.outputs.kit != 'true' || needs.core-sdk.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check selected work and prerequisites
        env:
          SELECTED: ${{ needs.select.outputs.kit }}
          SDK_SELECTED: ${{ needs.select.outputs.sdk }}
          SDK_JOB: core-sdk
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/sdk-ci-result.py kit

  python-result:
    name: Python check result
    needs: [select, sdk-linux, python]
    if: always() && (needs.select.result != 'success' || needs.select.outputs.python != 'true' || needs.sdk-linux.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check selected work and prerequisites
        env:
          SELECTED: ${{ needs.select.outputs.python }}
          SDK_SELECTED: ${{ needs.select.outputs.sdk }}
          SDK_JOB: sdk-linux
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/sdk-ci-result.py python
