name: Daemon / CI

on:
  # Pull requests always start this workflow so that its required result check is reported;
  # the changes job decides whether the daemon jobs run. Keep its pattern in step with these paths.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - 'daemon/**'
      - 'VERSION'
      - '.gitmodules'
      - '.github/workflows/daemon-*.yml'
      - '.github/actions/linux-daemon-*/**'
      - '.github/scripts/linux-daemon-cache-key.sh'
      - '.github/scripts/*daemon-debs.sh'
      - '.github/scripts/ubuntu-daemon-package-key.sh'
      - '.github/scripts/tests/test_ubuntu_daemon_packages.py'
      - 'cli/**'
      - 'common/**'
      - 'api/**'
      - 'core/**'
      - '!core/include/holder/holder.h'
      - '!core/src/capi/holder.cpp'
      - '!core/src/capi/version.cpp'
      - '!core/tests/**'
      - 'contract/**'
      - '.github/workflows/core-sdk.yml'
      - '.github/actions/core-sdk/**'
      - '.github/actions/core-ubuntu-packages/**'
      - '.github/scripts/fetch-core-debs.sh'
      - '.github/scripts/check-core-boundary.py'
  workflow_dispatch:
    inputs:
      core_build_type:
        description: SDK and daemon configuration
        type: choice
        options: [RelWithDebInfo, Release]
        default: RelWithDebInfo
      core_packages:
        description: Core packages for the Ubuntu package build (ppa checks a release candidate against Launchpad)
        type: choice
        options: [source, ppa]
        default: source

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      daemon: ${{ steps.select.outputs.daemon }}
    env:
      SCOPED: ${{ github.event_name == 'pull_request' }}
    steps:
      - if: env.SCOPED == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        name: Select jobs from the changed paths
        run: |
          if [[ "$SCOPED" != true ]]; then
            echo "daemon=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The pull request merge commit's parents are the base and the pull request head.
          changed=$(git diff --name-only HEAD^1...HEAD^2)
          printf '%s\n' "$changed"
          # The daemon uses core's C++ classes, never its C API (apart from capi/Context.h, which
          # its contract routes run in), and core's tests run in Core / CI, so changes only to those
          # don't select the daemon jobs. The contract's conformance tests run here over HTTP.
          # Keep in step with the paths.
          changed=$(grep -vE '^core/(include/holder/holder\.h$|src/capi/(holder|version)\.cpp$|tests/)' <<< "$changed" || true)
          if grep -qE '^(daemon/|cli/|common/|api/|core/|contract/|VERSION$|\.gitmodules$|\.github/workflows/daemon-|\.github/workflows/core-sdk\.yml$|\.github/actions/core-ubuntu-packages/|\.github/scripts/fetch-core-debs\.sh$|\.github/actions/core-sdk/|\.github/actions/linux-daemon-|\.github/scripts/(linux-daemon-cache-key|ubuntu-daemon-package-key|fetch-daemon-debs|publish-daemon-debs)\.sh$|\.github/scripts/tests/test_ubuntu_daemon_packages\.py$|\.github/scripts/check-core-boundary\.py$)' <<< "$changed"; then
            echo "daemon=true" >> "$GITHUB_OUTPUT"
          else
            echo "daemon=false" >> "$GITHUB_OUTPUT"
          fi
  resolve:
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-24.04
    outputs:
      daemon_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate SDK configuration
        env:
          BUILD_TYPE: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
        run: |
          case "$BUILD_TYPE" in
            RelWithDebInfo|Release) ;;
            *) echo "Unsupported SDK configuration: $BUILD_TYPE" >&2; exit 1 ;;
          esac
      - id: source
        name: Record daemon source revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  checks:
    # Fast checks that need no build: no paths across the core boundary, and make.sh's core selection.
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the core boundary
        run: python3 .github/scripts/check-core-boundary.py
      - name: Test make.sh's core selection
        working-directory: daemon
        run: python3 -m unittest scripts/test_make.py -v
  core-sdk:
    # The daemon builds against core from this same commit, through core's installed SDK.
    needs: resolve
    # Core / SDK deletes this branch's older vcpkg binary caches.
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-sdk.yml
    with:
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
  linux:
    needs: [resolve, core-sdk]
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/daemon-linux-backend.yml
    with:
      core_commit: ${{ needs.core-sdk.outputs.commit }}
      daemon_commit: ${{ needs.resolve.outputs.daemon_commit }}
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
  macos:
    needs: [resolve, core-sdk]
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/daemon-macos-backend.yml
    with:
      core_commit: ${{ needs.core-sdk.outputs.commit }}
      daemon_commit: ${{ needs.resolve.outputs.daemon_commit }}
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
  windows:
    needs: [resolve, core-sdk]
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/daemon-windows-backend.yml
    with:
      core_commit: ${{ needs.core-sdk.outputs.commit }}
      daemon_commit: ${{ needs.resolve.outputs.daemon_commit }}
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
  publish-linux-daemon:
    # Publishes main's tested Linux daemon to HolderTeam/holder-sdk, named after the hash of every
    # tree it was built from (linux-daemon-cache-key.sh), so Python / Check and others take it
    # instead of building the daemon; keeps the newest 32 such releases. Only main may use the
    # holder-sdk-publish environment, which holds the publishing app's key.
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: holder-sdk-publish
    concurrency:
      group: holder-sdk-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: key
        name: Compute the daemon build's key
        run: echo "key=$(.github/scripts/linux-daemon-cache-key.sh RelWithDebInfo)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: holder-daemon-linux-x86_64
          path: out/linux-daemon

      - id: token
        name: Get a token for holder-sdk
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOLDER_SDK_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOLDER_SDK_APP_PRIVATE_KEY }}
          owner: HolderTeam
          repositories: holder-sdk
          permission-contents: write

      - name: Publish the Linux daemon
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/publish-daemon-build.sh out/linux-daemon "${{ steps.key.outputs.key }}"

      - name: Keep the newest 64 daemon releases
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: .github/scripts/prune-sdk-releases.sh daemon- 64

  publish-ubuntu-packages:
    needs: ubuntu-packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.core_packages != 'ppa'
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1
      matrix:
        series: [noble, resolute]
    environment: holder-sdk-publish
    concurrency:
      group: holder-sdk-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: key
        env:
          SERIES: ${{ matrix.series }}
        run: echo "key=$(.github/scripts/ubuntu-daemon-package-key.sh "$SERIES")-source" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: holder-daemon-${{ matrix.series }}-packages
          path: out/daemon-debs

      - id: token
        name: Get a token for holder-sdk
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOLDER_SDK_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOLDER_SDK_APP_PRIVATE_KEY }}
          owner: HolderTeam
          repositories: holder-sdk
          permission-contents: write

      - name: Publish tested Ubuntu packages
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/publish-daemon-debs.sh out/daemon-debs "${{ steps.key.outputs.key }}"

      - name: Keep the newest 64 daemon releases
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: .github/scripts/prune-sdk-releases.sh ubuntu-daemon-debs- 64

  ubuntu-packages:
    # Launchpad outages can still be bypassed for the daemon checks with this label.
    if: github.repository == 'HolderTeam/holder' && inputs.core_build_type != 'Release' && !contains(github.event.pull_request.labels.*.name, 'ci:skip-launchpad-packages')
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(github.event_name == 'pull_request' && '["resolute"]' || '["noble","resolute"]') }}
    uses: ./.github/workflows/daemon-ubuntu-packages.yml
    with:
      series: ${{ matrix.series }}
      core_packages: ${{ inputs.core_packages || 'source' }}

  result:
    name: Daemon CI result
    # The required check. It runs even when jobs fail or are skipped, and passes only when every
    # selected job succeeded and no job ran that was not selected.
    if: always()
    needs: [changes, checks, resolve, core-sdk, linux, macos, windows, ubuntu-packages]
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          SELECTED: ${{ needs.changes.outputs.daemon }}
          RESULTS: ${{ toJSON(needs) }}
          SKIP_LAUNCHPAD: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:skip-launchpad-packages') }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          if [[ "$SKIP_LAUNCHPAD" == true && "$SELECTED" == true ]]; then
            echo '::warning::Ubuntu package build skipped by ci:skip-launchpad-packages label'
            echo 'Ubuntu package build skipped by the `ci:skip-launchpad-packages` PR label.' >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -e --arg selected "$SELECTED" --arg skip "$SKIP_LAUNCHPAD" '
            .changes.result == "success" and
            (if $selected == "true" then
               ([.checks, .resolve, .["core-sdk"], .linux, .macos, .windows] | all(.result == "success")) and
               (if $skip == "true" then
                  .["ubuntu-packages"].result == "skipped"
                else
                  (.["ubuntu-packages"].result | IN("success", "skipped"))
                end)
             else
               ([.checks, .resolve, .["core-sdk"], .linux, .macos, .windows, .["ubuntu-packages"]] | all(.result == "skipped"))
             end)' <<< "$RESULTS" > /dev/null
