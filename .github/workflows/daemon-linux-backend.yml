name: Daemon / Linux backend

on:
  workflow_call:
    inputs:
      core_commit:
        required: true
        type: string
      build_type:
        description: SDK and daemon configuration
        type: string
        default: RelWithDebInfo
      daemon_commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out holder-framework
        uses: actions/checkout@v4
        with:
          repository: HolderTeam/holder
          ref: ${{ inputs.daemon_commit }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - uses: ./.github/actions/linux-daemon-build
        with:
          core-commit: ${{ inputs.core_commit }}
          build-type: ${{ inputs.build_type }}

      - name: Run tests
        working-directory: daemon
        run: |
          ctest \
            --test-dir build-linux \
            --output-on-failure \
            --parallel 8 \
            --timeout 60

      - name: Test Python collections against the built daemon
        working-directory: python/holder
        env:
          HOLDER_TEST_DAEMON: ${{ github.workspace }}/daemon/build-linux/holderd
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_library_live.py

      - name: Smoke-test staged backend
        working-directory: daemon
        run: |
          set -euo pipefail

          stage_dir="${PWD}/out/artifacts/linux-backend"
          expected_version="$(tr -d '[:space:]' < ../VERSION)"
          multiarch="$(gcc -print-multiarch)"

          export LD_LIBRARY_PATH="${stage_dir}/usr/lib/${multiarch}:${stage_dir}/usr/lib"

          test -x "${stage_dir}/usr/bin/holderd"
          test -x "${stage_dir}/usr/bin/holderctl"
          test -e "${stage_dir}/usr/lib/${multiarch}/libcaste.so"
          test -f "${stage_dir}/usr/share/holder-daemon/schema/schema.sql"
          test -f "${stage_dir}/usr/share/holder-daemon/config/WELCOME.md"
          test -f "${stage_dir}/usr/share/holder-daemon/config/ai_catalog.yaml"
          test -f "${stage_dir}/usr/share/holder-daemon/config/git_providers.yaml"
          test -f "${stage_dir}/usr/share/holder-daemon/openapi.yaml"
          test -f "${stage_dir}/usr/share/holder-daemon/core-build.json"
          test -f "${stage_dir}/usr/share/holder-daemon/assets/swagger-ui/index.html"
          test -f "${stage_dir}/release/holder-daemon-api-version.txt"
          test -f "${stage_dir}/release/holder-daemon-manifest.txt"

          test "$("${stage_dir}/usr/bin/holderd" --version)" = \
            "holderd ${expected_version}"
          test "$(cat "${stage_dir}/release/holder-daemon-api-version.txt")" = \
            "$(tr -d '[:space:]' < ../api/API_VERSION)"
          "${stage_dir}/usr/bin/holderctl" --help

          runtime_dir="$(mktemp -d)"
          export XDG_DATA_HOME="${runtime_dir}/data"
          export XDG_CONFIG_HOME="${runtime_dir}/config"
          export XDG_CACHE_HOME="${runtime_dir}/cache"
          # GitHub's headless runner has no org.freedesktop.secrets service.
          # Use Holder's explicit test keystore for this isolated smoke run;
          # normal packaged launches continue to use libsecret.
          export HOLDER_TEST_KEYSTORE_DIR="${runtime_dir}/keystore"
          daemon_log="${runtime_dir}/holderd.log"

          cleanup() {
            if [ -n "${daemon_pid:-}" ] && kill -0 "${daemon_pid}" 2>/dev/null; then
              kill -TERM "${daemon_pid}" 2>/dev/null || true
              wait "${daemon_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          (
            cd "${stage_dir}/usr/share/holder-daemon"
            exec "${stage_dir}/usr/bin/holderd" --port 19499
          ) >"${daemon_log}" 2>&1 &
          daemon_pid=$!

          daemon_ready=0
          for _ in $(seq 1 100); do
            if "${stage_dir}/usr/bin/holderctl" health >/dev/null 2>&1; then
              daemon_ready=1
              break
            fi
            if ! kill -0 "${daemon_pid}" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done

          if [ "${daemon_ready}" -ne 1 ]; then
            cat "${daemon_log}"
            exit 1
          fi

          "${stage_dir}/usr/bin/holderctl" health
          cleanup
          daemon_pid=""
          trap - EXIT

      - name: Smoke-test holderctl ensure
        working-directory: daemon
        run: |
          set -euo pipefail

          stage_dir="${PWD}/out/artifacts/linux-backend"
          multiarch="$(gcc -print-multiarch)"
          export LD_LIBRARY_PATH="${stage_dir}/usr/lib/${multiarch}:${stage_dir}/usr/lib"

          runtime_dir="$(mktemp -d)"
          export HOME="${runtime_dir}/home"
          mkdir -p "${HOME}"
          export XDG_DATA_HOME="${runtime_dir}/data"
          export XDG_CONFIG_HOME="${runtime_dir}/config"
          export XDG_CACHE_HOME="${runtime_dir}/cache"
          # Headless runner: use Holder's explicit test keystore, as the smoke test above does.
          export HOLDER_TEST_KEYSTORE_DIR="${runtime_dir}/keystore"

          ctl="${stage_dir}/usr/bin/holderctl"
          api_version="$(tr -d '[:space:]' < ../api/API_VERSION)"
          field() {
            python3 -c 'import json, sys; print(json.load(sys.stdin)'"$1"')'
          }

          daemon_pid=""
          cleanup() {
            if [ -n "${daemon_pid}" ] && kill -0 "${daemon_pid}" 2>/dev/null; then
              kill -TERM "${daemon_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          # Nothing is running yet: --no-start reports that with exit status 11.
          status=0
          "${ctl}" ensure --json --no-start >/dev/null 2>&1 || status=$?
          test "${status}" -eq 11

          # Start the staged holderd found beside holderctl, using the API range of this build.
          started="$("${ctl}" ensure --json --api-min "${api_version}" --timeout 60)"
          printf '%s\n' "${started}"
          test "$(printf '%s' "${started}" | field '["state"]')" = started
          test "$(printf '%s' "${started}" | field '["mode"]')" = spawned
          daemon_pid="$(printf '%s' "${started}" | field '["daemon"]["pid"]')"

          # It keeps running after holderctl exited, and a second call reuses it.
          kill -0 "${daemon_pid}"
          again="$("${ctl}" ensure --json)"
          test "$(printf '%s' "${again}" | field '["state"]')" = running
          test "$(printf '%s' "${again}" | field '["daemon"]["pid"]')" = "${daemon_pid}"

          # An unsupported API range is refused with exit status 10.
          status=0
          "${ctl}" ensure --json --api-min 999 >/dev/null || status=$?
          test "${status}" -eq 10

          "${ctl}" health

          # Stop that daemon, then check that one started with --idle-exit stops by itself.
          kill -TERM "${daemon_pid}"
          for _ in $(seq 1 300); do
            kill -0 "${daemon_pid}" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "${daemon_pid}" 2>/dev/null; then
            echo "the first daemon did not stop" >&2
            exit 1
          fi

          ephemeral="$("${ctl}" ensure --json --idle-exit 2 --timeout 60)"
          printf '%s\n' "${ephemeral}"
          test "$(printf '%s' "${ephemeral}" | field '["state"]')" = started
          test "$(printf '%s' "${ephemeral}" | field '["idle_exit_seconds"]')" = 2
          daemon_pid="$(printf '%s' "${ephemeral}" | field '["daemon"]["pid"]')"
          for _ in $(seq 1 300); do
            kill -0 "${daemon_pid}" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "${daemon_pid}" 2>/dev/null; then
            echo "the daemon started with --idle-exit did not stop by itself" >&2
            exit 1
          fi

          # An idle period longer than the sync worker's 30 second poll must also be reachable.
          # Waking up to find nothing to sync once reset the quiet timer, so a long period never
          # elapsed while the short one above passed.
          patient="$("${ctl}" ensure --json --idle-exit 40 --timeout 60)"
          printf '%s\n' "${patient}"
          test "$(printf '%s' "${patient}" | field '["state"]')" = started
          daemon_pid="$(printf '%s' "${patient}" | field '["daemon"]["pid"]')"
          for _ in $(seq 1 1200); do
            kill -0 "${daemon_pid}" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "${daemon_pid}" 2>/dev/null; then
            echo "the daemon started with --idle-exit 40 did not stop by itself" >&2
            kill -TERM "${daemon_pid}" 2>/dev/null || true
            exit 1
          fi

      - name: Archive backend artifact
        working-directory: daemon
        run: |
          set -euo pipefail

          stage_dir="${PWD}/out/artifacts/linux-backend"
          upload_dir="${PWD}/out/artifacts/linux-backend-upload"
          archive_name="holder-daemon-linux-x86_64.tar.gz"

          install -d "${upload_dir}"
          tar -C "${stage_dir}" -czf "${upload_dir}/${archive_name}" .
          (
            cd "${upload_dir}"
            sha256sum "${archive_name}" > "${archive_name}.sha256"
          )

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: holder-daemon-linux-x86_64${{ inputs.build_type == 'Release' && '-release' || '' }}
          path: daemon/out/artifacts/linux-backend-upload/*
          if-no-files-found: error
          retention-days: 7

      # Python / Check restores this tree to run its live tests without building the daemon.
      # Saved only after every test above passed.
      - name: Compute staged daemon cache key
        id: daemon-cache
        if: github.repository == 'HolderTeam/holder'
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: echo "key=$(.github/scripts/linux-daemon-cache-key.sh "$BUILD_TYPE")" >> "$GITHUB_OUTPUT"

      - name: Save staged daemon
        if: github.repository == 'HolderTeam/holder'
        uses: actions/cache/save@v4
        with:
          path: daemon/out/artifacts/linux-backend
          key: ${{ steps.daemon-cache.outputs.key }}
