name: Python / Check

# Manual entry point and job source for generated shared-ci.yml. Regenerate after editing jobs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
    steps:
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        name: Select jobs from the changed paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" != pull_request && "$EVENT" != push ]]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The pull request merge commit's parents are the base and the pull request head.
          if [[ "$EVENT" == pull_request ]]; then
            changed=$(git diff --name-only HEAD^1...HEAD^2)
          elif [[ "$BEFORE" =~ ^0+$ || -z "$BEFORE" ]]; then
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BEFORE" HEAD)
          fi
          # Changes to the orchestration graph exercise all its consumers.
          if grep -qE '^.github/(workflows/(shared-ci|core-ci|daemon-ci|kit-ci|python-check|core-sdk|core-sanitizers)\.yml$|scripts/(generate-shared-ci\.py|tests/test_shared_ci\.py)$)' <<< "$changed"; then
            changed+=$'\nVERSION'
          fi
          printf '%s\n' "$changed"
          if grep -qE '^(VERSION$|python/_build_support\.py$|python/holder/|python/kit/(CMakeLists\.txt$|src/native/|scripts/repair-linux-wheel\.py$)|api/openapi\.yaml$|\.github/workflows/python-check\.yml$|\.github/scripts/fetch-daemon-build\.sh$)' <<< "$changed"; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: python/holder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,pandas,graph]' -r requirements-generator.txt
      - run: python scripts/generate.py --check
      - run: ruff check scripts tests src/holder --exclude src/holder/generated
      - run: python -m pytest
      - run: python -m build
  core-sdk:
    # Used to build the native wheel and, on a cache miss, the staged daemon.
    needs: changes
    if: needs.changes.outputs.python == 'true'
    # Core / SDK deletes this branch's older vcpkg binary caches.
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-sdk.yml
    with:
      platforms: '["linux"]'
  live:
    # Live tests against a holderd built from this tree. Daemon CI caches that build and, on main,
    # publishes it to holder-sdk, so a change that leaves the daemon alone takes it from one of
    # them; otherwise this job builds it once, borrowing Daemon CI's compiler cache.
    needs: [changes, core-sdk]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    env:
      BUILD_TYPE: RelWithDebInfo
      STAGE: ${{ github.workspace }}/daemon/out/artifacts/linux-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        name: Compute staged daemon cache key
        run: echo "key=$(.github/scripts/linux-daemon-cache-key.sh "$BUILD_TYPE")" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v6
        with:
          path: daemon/out/artifacts/linux-backend
          key: ${{ steps.key.outputs.key }}
      - id: shelf
        name: Download the daemon for this tree from holder-sdk
        if: steps.restore.outputs.cache-hit != 'true'
        run: .github/scripts/fetch-daemon-build.sh "${{ steps.key.outputs.key }}" "$STAGE"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - if: steps.shelf.outputs.found != 'false'
        uses: ./.github/actions/linux-daemon-deps
      - if: steps.shelf.outputs.found == 'false'
        uses: ./.github/actions/linux-daemon-build
        with:
          core-commit: ${{ needs.core-sdk.outputs.commit }}
          build-type: ${{ env.BUILD_TYPE }}
          build-testing: 'OFF'
          save-ccache: 'false'
      - if: steps.shelf.outputs.found == 'false'
        uses: actions/cache/save@v6
        with:
          path: daemon/out/artifacts/linux-backend
          key: ${{ steps.key.outputs.key }}
      - name: Test the Python API against the staged daemon
        working-directory: python/holder
        run: |
          set -euo pipefail
          multiarch="$(gcc -print-multiarch)"
          export LD_LIBRARY_PATH="${STAGE}/usr/lib/${multiarch}:${STAGE}/usr/lib"
          export HOLDER_TEST_DAEMON="${STAGE}/usr/bin/holderd"
          export HOLDER_TEST_DAEMON_CWD="${STAGE}/usr/share/holder-daemon"
          test -x "${HOLDER_TEST_DAEMON}"
          echo "holderd built from $(cat "${STAGE}/release/holder-daemon-commit.txt")"
          python -m pip install -e '.[dev,pandas,graph]'
          python -m pytest -v tests/test_library_live.py
      - uses: ./.github/actions/core-sdk
        if: steps.shelf.outputs.found != 'false'
        with:
          commit: ${{ needs.core-sdk.outputs.commit }}
          build-type: ${{ env.BUILD_TYPE }}
      - name: Build and test the repaired native Python wheel
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends patchelf
          work="$(mktemp -d)"
          python -m pip install 'build>=1.2,<2' wheel 'auditwheel==6.8.2'
          cmake -S python/kit -B "$work/kit" -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPython_EXECUTABLE="$(command -v python)" \
            -DCMAKE_INSTALL_PREFIX="$work/stage"
          cmake --build "$work/kit"
          cmake --install "$work/kit"
          HOLDER_PYTHON_EMBEDDED_STAGE="$work/stage" \
            python -m build --wheel --outdir "$work/raw" python/holder
          python python/kit/scripts/repair-linux-wheel.py --output "$work/dist" "$work/raw/"*.whl
          python -m venv "$work/test"
          wheels=("$work/dist/"*manylinux_2_39_x86_64.whl)
          "$work/test/bin/python" -m pip install pytest "${wheels[0]}[pandas,graph]"
          "$work/test/bin/python" -m pytest -v python/holder/tests/test_library_live.py \
            -k '(shared_card_operations and embedded) or embedded_recovery_snapshot_restore'
          "$work/test/bin/python" -m pytest -v python/holder/tests/test_workspaces.py
          multiarch="$(gcc -print-multiarch)"
          LD_LIBRARY_PATH="${STAGE}/usr/lib/${multiarch}:${STAGE}/usr/lib" \
          HOLDER_TEST_DAEMON="${STAGE}/usr/bin/holderd" \
          HOLDER_TEST_DAEMON_CWD="${STAGE}/usr/share/holder-daemon" \
            "$work/test/bin/python" -m pytest -v python/holder/tests/test_library_live.py \
              -k 'embedded_profile_ownership or recovery_snapshot_round_trip'
  result:
    name: Python check result
    # The required check. It runs even when jobs fail or are skipped, and passes only when the
    # checks succeeded or were rightly skipped.
    if: always()
    needs: [changes, check, core-sdk, live]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          SELECTED: ${{ needs.changes.outputs.python }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e --arg selected "$SELECTED" '
            .changes.result == "success" and
            ([.check, .["core-sdk"], .live] | all(.result == (if $selected == "true" then "success" else "skipped" end)))' <<< "$RESULTS" > /dev/null
