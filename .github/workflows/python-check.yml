name: Python / Check

on:
  # Pull requests always start this workflow so that its required result check is reported;
  # the changes job decides whether the checks run. Keep its pattern in step with these paths.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'api/openapi.yaml'
      - '.github/workflows/python-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        name: Select jobs from the changed paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The pull request merge commit's parents are the base and the pull request head.
          changed=$(git diff --name-only HEAD^1...HEAD^2)
          printf '%s\n' "$changed"
          if grep -qE '^(python/|api/openapi\.yaml$|\.github/workflows/python-check\.yml$)' <<< "$changed"; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: python/holder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/generate.py --check --source ../../api/openapi.yaml
      - run: ruff check scripts tests src/holder --exclude src/holder/generated
      - run: python -m pytest
      - run: python -m build
  core-sdk:
    # Only used when the staged daemon below is not cached and has to be built.
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/core-sdk.yml
    with:
      platforms: '["linux"]'
  live:
    # Live tests against a holderd built from this tree. Daemon CI saves that build on main,
    # so a Python-only change normally restores it; otherwise this job builds it once.
    needs: [changes, core-sdk]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    env:
      BUILD_TYPE: RelWithDebInfo
      STAGE: ${{ github.workspace }}/daemon/out/artifacts/linux-backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: key
        name: Compute staged daemon cache key
        run: echo "key=$(.github/scripts/linux-daemon-cache-key.sh "$BUILD_TYPE")" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: daemon/out/artifacts/linux-backend
          key: ${{ steps.key.outputs.key }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - if: steps.restore.outputs.cache-hit == 'true'
        uses: ./.github/actions/linux-daemon-deps
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/linux-daemon-build
        with:
          core-commit: ${{ needs.core-sdk.outputs.commit }}
          build-type: ${{ env.BUILD_TYPE }}
          build-testing: 'OFF'
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: daemon/out/artifacts/linux-backend
          key: ${{ steps.key.outputs.key }}
      - name: Test the Python API against the staged daemon
        working-directory: python/holder
        run: |
          set -euo pipefail
          multiarch="$(gcc -print-multiarch)"
          export LD_LIBRARY_PATH="${STAGE}/usr/lib/${multiarch}:${STAGE}/usr/lib"
          export HOLDER_TEST_DAEMON="${STAGE}/usr/bin/holderd"
          export HOLDER_TEST_DAEMON_CWD="${STAGE}/usr/share/holder-daemon"
          test -x "${HOLDER_TEST_DAEMON}"
          echo "holderd built from $(cat "${STAGE}/release/holder-daemon-commit.txt")"
          python -m pip install -e '.[dev]'
          python -m pytest -v tests/test_library_live.py
  result:
    name: Python check result
    # The required check. It runs even when jobs fail or are skipped, and passes only when the
    # checks succeeded or were rightly skipped.
    if: always()
    needs: [changes, check, core-sdk, live]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          SELECTED: ${{ needs.changes.outputs.python }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e --arg selected "$SELECTED" '
            .changes.result == "success" and
            ([.check, .["core-sdk"], .live] | all(.result == (if $selected == "true" then "success" else "skipped" end)))' <<< "$RESULTS" > /dev/null
