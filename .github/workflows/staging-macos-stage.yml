name: Staging / macOS

on:
  workflow_dispatch:
    inputs:
      desktop_run_id:
        description: GitHub Actions run ID that uploaded holder-desktop-macos. Leave blank for latest successful desktop_ref run.
        required: false
        default: ""
        type: string
      backend_run_id:
        description: GitHub Actions run ID that uploaded holder-daemon-macos-backend. Leave blank for latest successful main run.
        required: false
        default: ""
        type: string
      desktop_repository:
        description: Repository containing the desktop artifact and packaging metadata
        required: true
        type: string
        default: HolderTeam/holder-desktop
      desktop_ref:
        description: holder-desktop ref to read VERSION and macOS packaging templates from
        required: true
        type: string
        default: main
      backend_repository:
        description: Repository containing the backend artifact
        required: true
        type: string
        default: HolderTeam/holder
      release_manifest:
        description: Checked-in framework manifest pinning core and this platform's component runs
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  stage:
    runs-on: macos-15

    steps:
      - name: Check out holder-framework
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sources/holder-framework

      - name: Test SDK provenance and artifact selection
        shell: bash
        run: python3 -m unittest discover -s sources/holder-framework/staging/tests -v

      - name: Select development inputs or framework release pins
        id: pins
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
          DESKTOP_RUN_ID_INPUT: ${{ inputs.desktop_run_id }}
          BACKEND_RUN_ID_INPUT: ${{ inputs.backend_run_id }}
          DESKTOP_REPOSITORY_INPUT: ${{ inputs.desktop_repository }}
          BACKEND_REPOSITORY_INPUT: ${{ inputs.backend_repository }}
        run: |
          options=()
          if [[ -n "$RELEASE_MANIFEST" ]]; then
            options=(--release-manifest "sources/holder-framework/staging/$RELEASE_MANIFEST")
          fi
          python3 sources/holder-framework/staging/scripts/core-provenance.py prepare \
            --platform macos "${options[@]}"

      - name: Resolve artifact run IDs
        id: artifact_runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          DESKTOP_RUN_ID_INPUT: ${{ steps.pins.outputs.desktop_run_id }}
          BACKEND_RUN_ID_INPUT: ${{ steps.pins.outputs.backend_run_id }}
          DESKTOP_REPOSITORY: ${{ steps.pins.outputs.desktop_repository }}
          DESKTOP_REF: ${{ inputs.desktop_ref }}
          BACKEND_REPOSITORY: ${{ steps.pins.outputs.backend_repository }}
        run: python3 sources/holder-framework/staging/scripts/resolve-component-runs.py --platform macos --build-type "${{ steps.pins.outputs.build_type }}"

      - name: Check out holder-desktop metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.pins.outputs.desktop_repository }}
          ref: ${{ steps.artifact_runs.outputs.desktop_commit }}
          token: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          path: sources/holder-desktop

      - name: Download desktop artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: holder-desktop-macos${{ steps.pins.outputs.build_type == 'Release' && '-release' || '' }}
          path: downloads/desktop
          github-token: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          repository: ${{ steps.pins.outputs.desktop_repository }}
          run-id: ${{ steps.artifact_runs.outputs.desktop_run_id }}

      - name: Download backend artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: holder-daemon-macos-backend${{ steps.pins.outputs.build_type == 'Release' && '-release' || '' }}
          path: downloads/backend
          github-token: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          repository: ${{ steps.pins.outputs.backend_repository }}
          run-id: ${{ steps.artifact_runs.outputs.backend_run_id }}

      - name: Download the backend run's core selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-selection
          path: out
          github-token: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          repository: ${{ steps.pins.outputs.backend_repository }}
          run-id: ${{ steps.artifact_runs.outputs.backend_run_id }}

      - name: Read the core the backend was built against
        id: core
        shell: bash
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("out/core-selection.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Verify backend core and release pins
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
          DESKTOP_COMMIT: ${{ steps.artifact_runs.outputs.desktop_commit }}
          BUILD_TYPE: ${{ steps.pins.outputs.build_type }}
        run: |
          options=()
          if [[ -n "$RELEASE_MANIFEST" ]]; then
            options=(--release-manifest "sources/holder-framework/staging/$RELEASE_MANIFEST")
          fi
          python3 sources/holder-framework/staging/scripts/core-provenance.py verify \
            --selection out/core-selection.json --platform macos \
            --backend-root downloads/backend --desktop-root downloads/desktop \
            --desktop-commit "$DESKTOP_COMMIT" --build-type "$BUILD_TYPE" \
            --backend-repository "${{ steps.pins.outputs.backend_repository }}" \
            --backend-run-id "${{ steps.artifact_runs.outputs.backend_run_id }}" \
            --output out/core-provenance.json "${options[@]}"

      - name: Install Homebrew runtime tools
        run: |
          set -euo pipefail

          brew update
          brew install \
            dylibbundler \
            adwaita-icon-theme \
            gtk4 \
            libadwaita \
            gtksourceview5 \
            libspelling \
            libgee \
            libsoup \
            glib-networking \
            json-glib \
            vte3 \
            boost \
            nlohmann-json \
            yaml-cpp \
            spdlog \
            sqlite \
            libsodium \
            libgit2 \
            md4c \
            openssl@3

      - name: Assemble Holder.app
        env:
          PRODUCT_VERSION: ${{ steps.pins.outputs.appimage_version }}
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          set -euo pipefail

          desktop_source_dir="sources/holder-desktop"
          staging_source_dir="sources/holder-framework"
          version="${PRODUCT_VERSION:-$(tr -d '[:space:]' < "${desktop_source_dir}/VERSION")}"
          homebrew_prefix="$(brew --prefix)"
          homebrew_enchant_prefix="$(brew --prefix enchant)"
          homebrew_gdk_pixbuf_prefix="$(brew --prefix gdk-pixbuf)"
          homebrew_glib_networking_prefix="$(brew --prefix glib-networking)"
          homebrew_gtksourceview_prefix="$(brew --prefix gtksourceview5)"
          homebrew_openssl_prefix="$(brew --prefix openssl@3)"
          app_dir="out/artifacts/Holder.app"
          contents_dir="${app_dir}/Contents"
          resources_dir="${contents_dir}/Resources"
          metadata_dir="${resources_dir}/release"

          rm -rf "${app_dir}"
          mkdir -p \
            "${contents_dir}/MacOS" \
            "${resources_dir}/bin" \
            "${resources_dir}/lib" \
            "${resources_dir}/share" \
            "${metadata_dir}/packaging/macos"

          sed "s/@HOLDER_VERSION@/${version}/g" \
            "${desktop_source_dir}/packaging/macos/Info.plist.in" \
            > "${contents_dir}/Info.plist"
          cp "${desktop_source_dir}/packaging/macos/Holder.entitlements" \
            "${metadata_dir}/packaging/macos/Holder.entitlements"

          icon_source="${desktop_source_dir}/packaging/icons/holder1024.png"
          iconset_dir="${RUNNER_TEMP}/Holder.iconset"
          rm -rf "${iconset_dir}"
          mkdir -p "${iconset_dir}"
          sips -z 16 16 "${icon_source}" --out "${iconset_dir}/icon_16x16.png" >/dev/null
          sips -z 32 32 "${icon_source}" --out "${iconset_dir}/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "${icon_source}" --out "${iconset_dir}/icon_32x32.png" >/dev/null
          sips -z 64 64 "${icon_source}" --out "${iconset_dir}/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "${icon_source}" --out "${iconset_dir}/icon_128x128.png" >/dev/null
          sips -z 256 256 "${icon_source}" --out "${iconset_dir}/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "${icon_source}" --out "${iconset_dir}/icon_256x256.png" >/dev/null
          sips -z 512 512 "${icon_source}" --out "${iconset_dir}/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "${icon_source}" --out "${iconset_dir}/icon_512x512.png" >/dev/null
          cp "${icon_source}" "${iconset_dir}/icon_512x512@2x.png"
          iconutil -c icns -o "${resources_dir}/Holder.icns" "${iconset_dir}"

          # The desktop is the bundle's main executable: it starts its own backend (holderctl ensure)
          # and sets up the GTK runtime from inside the bundle, so no launcher is needed.
          cp downloads/desktop/bin/holder-desktop "${contents_dir}/MacOS/Holder"
          cp downloads/backend/bin/holderd "${resources_dir}/bin/holderd"
          cp downloads/backend/bin/holderctl "${resources_dir}/bin/holderctl"
          chmod +x \
            "${contents_dir}/MacOS/Holder" \
            "${resources_dir}/bin/holderd" \
            "${resources_dir}/bin/holderctl"

          cp -a downloads/desktop/share/. "${resources_dir}/share/"
          cp -a downloads/backend/schema "${resources_dir}/schema"
          cp -a downloads/backend/config "${resources_dir}/config"
          cp -a downloads/backend/assets "${resources_dir}/assets"
          cp downloads/backend/openapi.yaml "${resources_dir}/openapi.yaml"
          cp downloads/backend/core-build.json "${resources_dir}/core-build.json"
          cp out/core-provenance.json "${metadata_dir}/holder-core-provenance.json"
          if [[ -f downloads/desktop/release/holder-desktop-build.json ]]; then
            cp downloads/desktop/release/holder-desktop-build.json "${metadata_dir}/"
          fi
          if [[ -n "$RELEASE_MANIFEST" ]]; then
            cp "sources/holder-framework/staging/$RELEASE_MANIFEST" "${metadata_dir}/holder-framework-release.json"
          fi

          copy_tree_dereference_if_exists() {
            local source_dir="$1"
            local target_dir="$2"
            if [ -d "${source_dir}" ]; then
              mkdir -p "${target_dir}"
              chmod -R u+w "${target_dir}"
              cp -aL "${source_dir}/." "${target_dir}/"
              chmod -R u+w "${target_dir}"
            fi
          }

          copy_tree_dereference_if_exists "${homebrew_prefix}/share/glib-2.0" "${resources_dir}/share/glib-2.0"
          cp downloads/desktop/share/glib-2.0/schemas/team.holder.Holder.gschema.xml \
            "${resources_dir}/share/glib-2.0/schemas/"
          copy_tree_dereference_if_exists "${homebrew_prefix}/share/icons" "${resources_dir}/share/icons"
          copy_tree_dereference_if_exists "$(brew --prefix adwaita-icon-theme)/share/icons" "${resources_dir}/share/icons"
          copy_tree_dereference_if_exists "${homebrew_prefix}/share/themes" "${resources_dir}/share/themes"
          copy_tree_dereference_if_exists "${homebrew_prefix}/share/gtk-4.0" "${resources_dir}/share/gtk-4.0"
          copy_tree_dereference_if_exists "${homebrew_prefix}/share/libadwaita" "${resources_dir}/share/libadwaita"
          copy_tree_dereference_if_exists "${homebrew_gtksourceview_prefix}/share/gtksourceview-5" "${resources_dir}/share/gtksourceview-5"
          copy_tree_dereference_if_exists "${homebrew_prefix}/share/gtksourceview-5" "${resources_dir}/share/gtksourceview-5"
          copy_tree_dereference_if_exists "${homebrew_enchant_prefix}/share/enchant-2" "${resources_dir}/share/enchant-2"
          copy_tree_dereference_if_exists "${homebrew_prefix}/share/enchant-2" "${resources_dir}/share/enchant-2"
          copy_tree_dereference_if_exists "${homebrew_prefix}/share/locale" "${resources_dir}/share/locale"

          hunspell_dir="${resources_dir}/share/enchant/hunspell"
          mkdir -p "${hunspell_dir}"
          for dictionary_file in en_GB.aff en_GB.dic en_US.aff en_US.dic; do
            curl --fail --location --show-error \
              "https://raw.githubusercontent.com/LibreOffice/dictionaries/master/en/${dictionary_file}" \
              --output "${hunspell_dir}/${dictionary_file}"
          done

          find "${resources_dir}" -type f \( -name '*.a' -o -name '*.la' -o -name '*.h' \) -delete

          glib-compile-schemas "${resources_dir}/share/glib-2.0/schemas"

          bundle_binary() {
            local binary="$1"
            local prefix="$2"
            local overwrite_mode="$3"
            local search_args=(-s "${homebrew_prefix}/lib")

            if [ -d "${homebrew_openssl_prefix}/lib" ] &&
              [ "${homebrew_openssl_prefix}/lib" != "${homebrew_prefix}/lib" ]; then
              search_args+=(-s "${homebrew_openssl_prefix}/lib")
            fi

            dylibbundler \
              "${overwrite_mode}" \
              -b \
              -x "${binary}" \
              -d "${resources_dir}/lib" \
              -p "${prefix}" \
              "${search_args[@]}"
          }

          bundle_binary "${contents_dir}/MacOS/Holder" "@executable_path/../Resources/lib" "-od"
          bundle_binary "${resources_dir}/bin/holderd" "@executable_path/../lib" "-of"
          bundle_binary "${resources_dir}/bin/holderctl" "@executable_path/../lib" "-of"

          find "${resources_dir}" -type f -name '*.dylib' -exec chmod u+w {} \;

          resolve_dependency_source() {
            local dependency="$1"
            local name="$2"

            case "${dependency}" in
              /usr/lib/*|/System/*)
                return 1
                ;;
              "${resources_dir}/lib/"*)
                if [ -f "${dependency}" ]; then
                  printf '%s\n' "${dependency}"
                  return 0
                fi
                ;;
              "${homebrew_prefix}"/*|/opt/homebrew/*)
                if [ -f "${dependency}" ]; then
                  printf '%s\n' "${dependency}"
                  return 0
                fi
                ;;
            esac

            if [ -f "${resources_dir}/lib/${name}" ]; then
              printf '%s\n' "${resources_dir}/lib/${name}"
              return 0
            fi

            if [ -f "${homebrew_prefix}/lib/${name}" ]; then
              printf '%s\n' "${homebrew_prefix}/lib/${name}"
              return 0
            fi

            find "${homebrew_prefix}/Cellar" -path "*/lib/${name}" \( -type f -o -type l \) -print -quit
          }

          ensure_bundled_library() {
            local dependency="$1"
            local name="${dependency##*/}"
            local target="${resources_dir}/lib/${name}"
            local source_path

            if [ -f "${target}" ]; then
              return 0
            fi

            source_path="$(resolve_dependency_source "${dependency}" "${name}" || true)"
            if [ -z "${source_path}" ]; then
              return 0
            fi

            cp -aL "${source_path}" "${target}"
            chmod u+w "${target}"
          }

          normalize_bundled_library() {
            local library="$1"
            local name="${library##*/}"

            chmod u+w "${library}"
            install_name_tool -id "@loader_path/${name}" "${library}" 2>/dev/null || true

            while IFS= read -r dependency; do
              case "${dependency}" in
                /usr/lib/*|/System/*)
                  continue
                  ;;
              esac

              local dependency_name="${dependency##*/}"
              ensure_bundled_library "${dependency}"

              if [ -f "${resources_dir}/lib/${dependency_name}" ]; then
                install_name_tool \
                  -change "${dependency}" "@loader_path/${dependency_name}" \
                  "${library}" 2>/dev/null || true
              fi
            done < <(otool -L "${library}" | awk 'NR > 1 { print $1 }')

            codesign --force --deep --preserve-metadata=entitlements,requirements,flags,runtime \
              --sign - "${library}"
          }

          fix_module_dependencies() {
            local module="$1"
            local dependency_prefix="$2"
            local module_name="${module##*/}"

            chmod u+w "${module}"
            install_name_tool -id "@loader_path/${module_name}" "${module}" 2>/dev/null || true

            while IFS= read -r dependency; do
              case "${dependency}" in
                /usr/lib/*|/System/*)
                  continue
                  ;;
              esac

              local dependency_name="${dependency##*/}"
              ensure_bundled_library "${dependency}"

              if [ -f "${resources_dir}/lib/${dependency_name}" ]; then
                install_name_tool \
                  -change "${dependency}" "${dependency_prefix}/${dependency_name}" \
                  "${module}" 2>/dev/null || true
              fi
            done < <(otool -L "${module}" | awk 'NR > 1 { print $1 }')

            codesign --force --deep --preserve-metadata=entitlements,requirements,flags,runtime \
              --sign - "${module}"
          }

          copy_tree_dereference_if_exists "${homebrew_glib_networking_prefix}/lib/gio" "${resources_dir}/lib/gio"
          copy_tree_dereference_if_exists "${homebrew_prefix}/lib/gio" "${resources_dir}/lib/gio"
          copy_tree_dereference_if_exists "${homebrew_enchant_prefix}/lib/enchant-2" "${resources_dir}/lib/enchant-2"
          copy_tree_dereference_if_exists "${homebrew_prefix}/lib/enchant-2" "${resources_dir}/lib/enchant-2"
          copy_tree_dereference_if_exists "${homebrew_gdk_pixbuf_prefix}/lib/gdk-pixbuf-2.0" "${resources_dir}/lib/gdk-pixbuf-2.0"
          copy_tree_dereference_if_exists "${homebrew_prefix}/lib/gdk-pixbuf-2.0" "${resources_dir}/lib/gdk-pixbuf-2.0"
          copy_tree_dereference_if_exists "${homebrew_prefix}/lib/gtk-4.0" "${resources_dir}/lib/gtk-4.0"

          find "${resources_dir}" -type f \( -name '*.a' -o -name '*.la' -o -name '*.h' \) -delete

          pixbuf_loaders_dir="${resources_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders"
          if [ -d "${pixbuf_loaders_dir}" ]; then
            if ! find "${pixbuf_loaders_dir}" -maxdepth 1 -type f -name '*.so' | grep -q .; then
              echo "Missing gdk-pixbuf loader modules in ${pixbuf_loaders_dir}"
              find "${resources_dir}/lib/gdk-pixbuf-2.0" -maxdepth 6 -ls 2>/dev/null || true
              exit 1
            fi

            while IFS= read -r loader; do
              fix_module_dependencies "${loader}" "@loader_path/../../.."
            done < <(find "${pixbuf_loaders_dir}" -maxdepth 1 -type f -name '*.so' | sort)
          fi

          enchant_modules_dir="${resources_dir}/lib/enchant-2"
          if [ -d "${enchant_modules_dir}" ]; then
            if ! find "${enchant_modules_dir}" -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' \) | grep -q .; then
              echo "Missing Enchant provider modules in ${enchant_modules_dir}"
              find "${enchant_modules_dir}" -maxdepth 2 -ls 2>/dev/null || true
              exit 1
            fi

            while IFS= read -r module; do
              fix_module_dependencies "${module}" "@loader_path/.."
            done < <(find "${enchant_modules_dir}" -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' \) | sort)
          else
            echo "Missing Enchant provider modules directory: ${enchant_modules_dir}"
            exit 1
          fi

          gio_modules_dir="${resources_dir}/lib/gio/modules"
          if [ -d "${gio_modules_dir}" ]; then
            if ! find "${gio_modules_dir}" -maxdepth 1 -type f \( -name '*tls*.so' -o -name '*gnutls*.so' -o -name '*tls*.dylib' -o -name '*gnutls*.dylib' \) | grep -q .; then
              echo "Missing GIO TLS module in ${gio_modules_dir}"
              find "${gio_modules_dir}" -maxdepth 2 -ls 2>/dev/null || true
              exit 1
            fi

            while IFS= read -r module; do
              fix_module_dependencies "${module}" "@loader_path/../.."
            done < <(find "${gio_modules_dir}" -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' \) | sort)
          else
            echo "Missing GIO modules directory: ${gio_modules_dir}"
            exit 1
          fi

          for _ in 1 2 3; do
            while IFS= read -r library; do
              normalize_bundled_library "${library}"
            done < <(find "${resources_dir}/lib" -maxdepth 1 -type f -name '*.dylib' | sort)
          done

          (
            cd "${resources_dir}"

            if [ -d "lib/gio/modules" ]; then
              gio-querymodules "lib/gio/modules"
            else
              echo "Missing GIO modules directory: ${resources_dir}/lib/gio/modules"
              exit 1
            fi

            if [ -d "lib/gdk-pixbuf-2.0/2.10.0/loaders" ]; then
              if ! find "lib/gdk-pixbuf-2.0/2.10.0/loaders" -maxdepth 1 -type f -name '*.so' | grep -q .; then
                echo "Missing gdk-pixbuf loader modules in ${resources_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders"
                find "lib/gdk-pixbuf-2.0" -maxdepth 6 -ls 2>/dev/null || true
                exit 1
              fi

              loader_dir="lib/gdk-pixbuf-2.0/2.10.0/loaders"
              loader_cache="lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"

              GDK_PIXBUF_MODULEDIR="${loader_dir}" \
                gdk-pixbuf-query-loaders "${loader_dir}"/*.so \
                > "${loader_cache}"

              loader_dir_abs="$(pwd)/${loader_dir}"
              perl -0pi -e 's#\Q'"${loader_dir_abs}"'\E#'"${loader_dir}"'#g' "${loader_cache}"

              if ! grep -F "libpixbufloader" "${loader_cache}"; then
                echo "gdk-pixbuf loader cache contains no loader modules"
                exit 1
              fi
            else
              echo "Missing gdk-pixbuf loaders directory: ${resources_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders"
              find "lib/gdk-pixbuf-2.0" -maxdepth 5 -type d 2>/dev/null | sort || true
              exit 1
            fi
          )

          staging_sha="$(git -C "${staging_source_dir}" rev-parse HEAD)"
          desktop_sha="$(git -C "${desktop_source_dir}" rev-parse HEAD)"
          artifact_hashes_path="${metadata_dir}/input-artifact-sha256.txt"
          {
            find downloads/desktop -type f -print0
            find downloads/backend -type f -print0
          } | sort -z | xargs -0 shasum -a 256 > "${artifact_hashes_path}"

          HOLDER_VERSION="${version}" \
          STAGING_SHA="${staging_sha}" \
          DESKTOP_REPOSITORY="${{ steps.pins.outputs.desktop_repository }}" \
          DESKTOP_REF="${{ inputs.desktop_ref }}" \
          DESKTOP_SHA="${desktop_sha}" \
          DESKTOP_RUN_ID="${{ steps.artifact_runs.outputs.desktop_run_id }}" \
          BACKEND_REPOSITORY="${{ steps.pins.outputs.backend_repository }}" \
          BACKEND_RUN_ID="${{ steps.artifact_runs.outputs.backend_run_id }}" \
          METADATA_PATH="${metadata_dir}/release-candidate.json" \
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          metadata = {
              "core": json.load(open("out/core-provenance.json")),
              "backend_run_commit": "${{ steps.artifact_runs.outputs.backend_commit }}",
              "platform": "macos",
              "version": os.environ["HOLDER_VERSION"],
              "created_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "staging_repository": os.environ["GITHUB_REPOSITORY"],
              "staging_sha": os.environ["STAGING_SHA"],
              "desktop_repository": os.environ["DESKTOP_REPOSITORY"],
              "desktop_ref": os.environ["DESKTOP_REF"],
              "desktop_sha": os.environ["DESKTOP_SHA"],
              "desktop_run_id": os.environ["DESKTOP_RUN_ID"],
              "desktop_artifact": "holder-desktop-macos${{ steps.pins.outputs.build_type == 'Release' && '-release' || '' }}",
              "backend_repository": os.environ["BACKEND_REPOSITORY"],
              "backend_run_id": os.environ["BACKEND_RUN_ID"],
              "backend_artifact": "holder-daemon-macos-backend${{ steps.pins.outputs.build_type == 'Release' && '-release' || '' }}",
          }

          with open(os.environ["METADATA_PATH"], "w", encoding="utf-8") as f:
              json.dump(metadata, f, indent=2, sort_keys=True)
              f.write("\n")
          PY

          (
            cd "out/artifacts"
            find Holder.app -type f \
              | sort \
              > Holder.app/Contents/Resources/manifest.txt
            shasum -a 256 Holder.app/Contents/Resources/manifest.txt \
              Holder.app/Contents/Resources/release/release-candidate.json \
              Holder.app/Contents/Resources/release/input-artifact-sha256.txt \
              > Holder.app/Contents/Resources/release/staging-sha256.txt
          )

          broken_symlinks=""
          while IFS= read -r symlink; do
            if [ ! -e "${symlink}" ]; then
              broken_symlinks="${broken_symlinks}${symlink}"$'\n'
            fi
          done < <(find "${app_dir}" -type l -print)
          if [ -n "${broken_symlinks}" ]; then
            echo "Broken symlinks in staged app:"
            printf '%s' "${broken_symlinks}"
            exit 1
          fi

          codesign --force --sign - "${contents_dir}/MacOS/Holder"
          codesign --force --sign - "${resources_dir}/bin/holderd"
          codesign --force --sign - "${resources_dir}/bin/holderctl"
          codesign --force --sign - "${app_dir}"

          find "${app_dir}" -maxdepth 5 -type f | sort

      - name: Smoke-test Holder.app
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          set -euo pipefail

          app_dir="out/artifacts/Holder.app"
          resources_dir="${app_dir}/Contents/Resources"
          homebrew_prefix="$(brew --prefix)"

          check_file() {
            local path="$1"
            if [ ! -f "${path}" ]; then
              echo "Missing file: ${path}"
              exit 1
            fi
          }

          check_executable() {
            local path="$1"
            if [ ! -x "${path}" ]; then
              echo "Missing executable: ${path}"
              exit 1
            fi
          }

          check_no_match() {
            local pattern="$1"
            local path="$2"
            if grep -Fn -- "${pattern}" "${path}"; then
              echo "Unexpected path leak in ${path}: ${pattern}"
              exit 1
            fi
          }

          check_file "${app_dir}/Contents/Info.plist"
          check_file "${resources_dir}/Holder.icns"
          check_executable "${app_dir}/Contents/MacOS/Holder"
          check_executable "${resources_dir}/bin/holderd"
          check_executable "${resources_dir}/bin/holderctl"
          check_file "${resources_dir}/schema/schema.sql"
          check_file "${resources_dir}/openapi.yaml"
          cmp downloads/backend/core-build.json "${resources_dir}/core-build.json"
          cmp out/core-provenance.json "${resources_dir}/release/holder-core-provenance.json"
          if [[ -n "$RELEASE_MANIFEST" ]]; then
            cmp "sources/holder-framework/staging/$RELEASE_MANIFEST" "${resources_dir}/release/holder-framework-release.json"
          fi
          check_file "${resources_dir}/share/glib-2.0/schemas/gschemas.compiled"
          check_file "${resources_dir}/share/gtksourceview-5/language-specs/language2.rng"
          check_file "${resources_dir}/share/icons/Adwaita/symbolic/actions/view-refresh-symbolic.svg"
          check_file "${resources_dir}/share/icons/Adwaita/symbolic/actions/list-add-symbolic.svg"
          check_file "${resources_dir}/share/icons/Adwaita/symbolic/actions/edit-find-replace-symbolic.svg"
          check_file "${resources_dir}/share/icons/Adwaita/symbolic/actions/open-menu-symbolic.svg"
          check_file "${resources_dir}/share/icons/Adwaita/symbolic/places/user-trash-symbolic.svg"
          check_file "${resources_dir}/share/enchant/hunspell/en_GB.aff"
          check_file "${resources_dir}/share/enchant/hunspell/en_GB.dic"
          check_file "${resources_dir}/share/enchant/hunspell/en_US.aff"
          check_file "${resources_dir}/share/enchant/hunspell/en_US.dic"
          check_file "${resources_dir}/release/packaging/macos/Holder.entitlements"
          check_file "${resources_dir}/release/release-candidate.json"
          check_file "${resources_dir}/release/input-artifact-sha256.txt"
          check_file "${resources_dir}/release/staging-sha256.txt"
          check_file "${resources_dir}/manifest.txt"

          if ! find "${resources_dir}/lib/enchant-2" -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' \) | grep -q .; then
            echo "Missing Enchant provider modules in staged app"
            exit 1
          fi

          check_file "${resources_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          if ! find "${resources_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders" -maxdepth 1 -type f -name '*.so' | grep -q .; then
            echo "Missing gdk-pixbuf loader modules in staged app"
            exit 1
          fi
          if ! grep -F "libpixbufloader" "${resources_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"; then
            echo "gdk-pixbuf loader cache contains no loader modules"
            exit 1
          fi
          check_file "${resources_dir}/lib/gio/modules/giomodule.cache"
          if ! find "${resources_dir}/lib/gio/modules" -maxdepth 1 -type f \( -name '*tls*.so' -o -name '*gnutls*.so' -o -name '*tls*.dylib' -o -name '*gnutls*.dylib' \) | grep -q .; then
            echo "Missing GIO TLS module in staged app"
            exit 1
          fi
          check_no_match "${app_dir}" "${resources_dir}/lib/gio/modules/giomodule.cache"
          check_no_match "${homebrew_prefix}" "${resources_dir}/lib/gio/modules/giomodule.cache"
          check_no_match "${app_dir}" "${resources_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          check_no_match "${homebrew_prefix}" "${resources_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          check_no_match "out/artifacts/Holder.app" "${resources_dir}/manifest.txt"

          for binary in \
            "${app_dir}/Contents/MacOS/Holder" \
            "${resources_dir}/bin/holderd" \
            "${resources_dir}/bin/holderctl"; do
            if otool -L "${binary}" | grep -F "${homebrew_prefix}/"; then
              echo "${binary} still links to Homebrew paths"
              exit 1
            fi
          done

          while IFS= read -r library; do
            if otool -L "${library}" | grep -F "${homebrew_prefix}/"; then
              echo "${library} still links to Homebrew paths"
              exit 1
            fi
            if otool -L "${library}" | grep -E '@executable_path|@loader_path/\.\.'; then
              echo "${library} has non-library-relative dependency paths"
              exit 1
            fi
          done < <(find "${resources_dir}/lib" -maxdepth 1 -type f -name '*.dylib' | sort)

          while IFS= read -r loader; do
            if otool -L "${loader}" | grep -F "${homebrew_prefix}/"; then
              echo "${loader} still links to Homebrew paths"
              exit 1
            fi
          done < <(find "${resources_dir}/lib/gdk-pixbuf-2.0/2.10.0/loaders" -maxdepth 1 -type f -name '*.so' | sort)

          while IFS= read -r module; do
            if otool -L "${module}" | grep -F "${homebrew_prefix}/"; then
              echo "${module} still links to Homebrew paths"
              exit 1
            fi
          done < <(find "${resources_dir}/lib/enchant-2" -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' \) | sort)

          while IFS= read -r module; do
            if otool -L "${module}" | grep -F "${homebrew_prefix}/"; then
              echo "${module} still links to Homebrew paths"
              exit 1
            fi
          done < <(find "${resources_dir}/lib/gio/modules" -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' \) | sort)

          codesign --verify --strict --verbose=2 "${app_dir}"

          for binary in \
            "${app_dir}/Contents/MacOS/Holder" \
            "${resources_dir}/bin/holderd" \
            "${resources_dir}/bin/holderctl"; do
            codesign --verify --strict --verbose=2 "${binary}"
          done

          while IFS= read -r signed_file; do
            codesign --verify --strict --verbose=2 "${signed_file}"
          done < <(find "${resources_dir}/lib" -type f \( -name '*.dylib' -o -name '*.so' \) | sort)

          echo "Running staged holderd --version"
          "${resources_dir}/bin/holderd" --version
          echo "Running staged holderctl --help"
          "${resources_dir}/bin/holderctl" --help

      - name: Create preview DMG
        run: |
          set -euo pipefail

          volume_name="Holder"
          app_dir="out/artifacts/Holder.app"
          dmg_root="out/dmg-root"
          tmp_dmg="out/Holder-macos-staged-writable.dmg"
          dmg_path="out/artifacts/Holder-macos-staged.dmg"
          layout_dir="out/artifacts/dmg-layout"
          venv_dir="out/dmg-ds-venv"
          background_path="sources/holder-framework/staging/mac-images/holder-dmg.png"
          ds_store_script="sources/holder-framework/staging/scripts/write_dmg_ds_store.py"

          rm -rf "${dmg_root}" "${tmp_dmg}" "${dmg_path}" "${dmg_path}.sha256" "${layout_dir}" "${venv_dir}"
          mkdir -p "${dmg_root}" "${layout_dir}"

          ditto "${app_dir}" "${dmg_root}/Holder.app"
          ln -s /Applications "${dmg_root}/Applications"
          cp "${background_path}" "${dmg_root}/.background.png"

          hdiutil create \
            -volname "${volume_name}" \
            -srcfolder "${dmg_root}" \
            -ov \
            -format UDRW \
            "${tmp_dmg}"

          python3 -m venv "${venv_dir}"
          "${venv_dir}/bin/python" -m pip install \
            biplist \
            ds_store \
            mac_alias

          mounted_dir=""
          mount_dir="$(mktemp -d)"
          cleanup() {
            if [ -n "${mounted_dir}" ]; then
              hdiutil detach "${mounted_dir}" -quiet || true
              mounted_dir=""
            fi
            rm -rf "${mount_dir}"
          }
          trap cleanup EXIT

          hdiutil attach \
            -readwrite \
            -nobrowse \
            -mountpoint "${mount_dir}" \
            "${tmp_dmg}"
          mounted_dir="${mount_dir}"

          "${venv_dir}/bin/python" "${ds_store_script}" \
            --mount "${mount_dir}" \
            --volume-name "${volume_name}"

          cp "${mount_dir}/.DS_Store" "${layout_dir}/DS_Store"
          cp "${mount_dir}/.background.png" "${layout_dir}/background.png"
          printf '%s\n' "${volume_name}" > "${layout_dir}/volume-name.txt"
          (
            cd "${layout_dir}"
            shasum -a 256 DS_Store background.png volume-name.txt > sha256.txt
          )

          sync
          cleanup
          trap - EXIT

          hdiutil convert \
            "${tmp_dmg}" \
            -format UDZO \
            -imagekey zlib-level=9 \
            -o "${dmg_path}"
          rm -f "${tmp_dmg}"

          shasum -a 256 "${dmg_path}" > "${dmg_path}.sha256"

          mounted_dir=""
          mount_dir="$(mktemp -d)"
          trap cleanup EXIT

          hdiutil attach \
            -readonly \
            -nobrowse \
            -mountpoint "${mount_dir}" \
            "${dmg_path}"
          mounted_dir="${mount_dir}"

          if [ ! -d "${mount_dir}/Holder.app" ]; then
            echo "Preview DMG is missing Holder.app"
            exit 1
          fi

          if [ ! -L "${mount_dir}/Applications" ]; then
            echo "Preview DMG is missing Applications symlink"
            exit 1
          fi

          applications_target="$(readlink "${mount_dir}/Applications")"
          if [ "${applications_target}" != "/Applications" ]; then
            echo "Applications symlink points to ${applications_target}, expected /Applications"
            exit 1
          fi

          if [ ! -f "${mount_dir}/.background.png" ]; then
            echo "Preview DMG is missing Finder background image"
            exit 1
          fi

          if [ ! -f "${mount_dir}/.DS_Store" ]; then
            echo "Preview DMG is missing Finder layout metadata"
            exit 1
          fi

          (
            cd "${layout_dir}"
            shasum -a 256 -c sha256.txt
          )

          cleanup
          trap - EXIT

      - name: Upload staged app and preview DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Holder-macos-staged
          path: out/artifacts
          if-no-files-found: error
          retention-days: 7
