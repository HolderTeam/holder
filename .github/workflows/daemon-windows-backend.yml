name: Daemon / Windows backend

on:
  workflow_call:
    inputs:
      core_commit:
        required: true
        type: string
      build_type:
        description: SDK and daemon configuration
        type: string
        default: RelWithDebInfo
      daemon_commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out holder-framework
        uses: actions/checkout@v4
        with:
          repository: HolderTeam/holder
          ref: ${{ inputs.daemon_commit }}
          persist-credentials: false

      - name: Prepare caste source dependency
        shell: bash
        working-directory: daemon
        run: git submodule update --init --recursive -- submodules/caste

      - uses: ./.github/actions/core-sdk
        with:
          commit: ${{ inputs.core_commit }}
          build-type: ${{ inputs.build_type }}

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set vcpkg paths
        shell: pwsh
        working-directory: daemon
        run: |
          "VCPKG_ROOT=${{ github.workspace }}\.vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}\.vcpkg-binary-cache" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary package cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('daemon/packaging/windows/sdk-deps/vcpkg.json', 'daemon/CMakePresets.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('daemon/packaging/windows/sdk-deps/vcpkg.json', 'daemon/CMakePresets.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        working-directory: daemon
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Install and configure ccache
        shell: pwsh
        run: |
          choco install ccache --no-progress -y
          # No CCACHE_BASEDIR on any platform: runner checkout paths are fixed, its relative paths make
          # __FILE__ relative (tests locate fixtures from it), and on Windows Ninja's resolution of the
          # relative include paths exceeds the path length limit for the core SDK's vcpkg headers.
          "CCACHE_DIR=${{ github.workspace }}\.ccache" >> $env:GITHUB_ENV
          "CCACHE_NOHASHDIR=true" >> $env:GITHUB_ENV
          "CCACHE_COMPILERCHECK=content" >> $env:GITHUB_ENV
          "CCACHE_MAXSIZE=1500M" >> $env:GITHUB_ENV

      # Pull requests restore the compiler cache that main saves, as with vcpkg's binary cache.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ inputs.build_type }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.build_type }}-

      # ccache cannot cache objects whose debug information goes to a shared PDB (/Zi), so CI
      # embeds it in each object instead (/Z7). The linker still writes the executables' PDBs.
      - name: Configure CMake
        shell: pwsh
        working-directory: daemon
        run: >-
          cmake --preset windows-sdk-tests
          "-DCMAKE_BUILD_TYPE=$env:HOLDER_CORE_BUILD_TYPE"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Save vcpkg binary package cache
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('daemon/packaging/windows/sdk-deps/vcpkg.json', 'daemon/CMakePresets.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build backend executables and tests
        working-directory: daemon
        run: |
          ccache --zero-stats
          cmake --build --preset windows-sdk-tests --parallel

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose

      - name: Save compiler cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ inputs.build_type }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run tests
        working-directory: daemon
        run: ctest --preset windows-sdk-tests --parallel 8

      - name: Stage backend artifact
        shell: pwsh
        working-directory: daemon
        run: |
          $buildDir = "out\build\windows-sdk-tests"
          $stageDir = "out\artifacts\windows-backend"

          New-Item -ItemType Directory -Force $stageDir | Out-Null
          Copy-Item "$buildDir\holderd.exe", "$buildDir\holderctl.exe" -Destination $stageDir
          Copy-Item "$buildDir\schema", "$buildDir\config", "$buildDir\assets" -Destination $stageDir -Recurse
          Copy-Item "$buildDir\openapi.yaml", "$buildDir\core-build.json" -Destination $stageDir
          New-Item -ItemType Directory -Force "$stageDir/release" | Out-Null
          git rev-parse HEAD | Set-Content -Encoding ascii "$stageDir/release/holder-daemon-commit.txt"
          (Get-Content ../VERSION -Raw).Trim() | Set-Content -Encoding ascii "$stageDir/release/holder-daemon-version.txt"
          (Get-Content ../api/API_VERSION -Raw).Trim() | Set-Content -Encoding ascii "$stageDir/release/holder-daemon-api-version.txt"
          Copy-Item "$env:HOLDER_CORE_SDK/share/vcpkg-licenses" -Destination $stageDir -Recurse
          $boostLicenses = Get-ChildItem "out/vcpkg-installed/x64-windows/share/boost*/copyright"
          foreach ($license in $boostLicenses) {
            Copy-Item $license.FullName -Destination "$stageDir/vcpkg-licenses/$($license.Directory.Name).txt"
          }

          $dllDirs = @(
            $buildDir,
            "out\vcpkg-installed\x64-windows\bin",
            "$env:HOLDER_CORE_SDK/bin"
          )

          foreach ($dir in $dllDirs) {
            if (Test-Path $dir) {
              Get-ChildItem $dir -Filter "*.dll" | Copy-Item -Destination $stageDir -Force
            }
          }

      - name: Smoke-test staged executables
        shell: pwsh
        working-directory: daemon
        run: |
          Push-Location "out\artifacts\windows-backend"
          & ".\holderd.exe" --help
          & ".\holderd.exe" --version
          & ".\holderctl.exe" --help
          Pop-Location

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: holder-daemon-windows-backend${{ inputs.build_type == 'Release' && '-release' || '' }}
          path: daemon/out/artifacts/windows-backend/*
          if-no-files-found: error
          retention-days: 7
