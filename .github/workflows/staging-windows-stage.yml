name: Staging / Windows

on:
  workflow_dispatch:
    inputs:
      desktop_run_id:
        description: Optional Desktop / CI run ID; blank uses the newest one built from the backend's desktop source (apps/desktop/)
        required: false
        default: ""
        type: string
      backend_run_id:
        description: GitHub Actions run ID that uploaded holder-daemon-windows-backend. Leave blank for latest successful main run.
        required: false
        default: ""
        type: string
      backend_repository:
        description: Repository whose Daemon CI and Desktop / CI runs to use
        required: true
        type: string
        default: HolderTeam/holder
      release_manifest:
        description: Checked-in framework manifest pinning core and this platform's component runs
        required: false
        default: ""
        type: string
      sign_test_installer:
        description: Build the protected self-signed tester installer (disable for unsigned branch validation)
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  stage:
    runs-on: windows-latest
    env:
      RELEASE_MANIFEST: ${{ inputs.release_manifest }}
    environment: ${{ inputs.sign_test_installer && 'windows-staging' || '' }}

    steps:
      - name: Check out holder-framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sources/holder-framework

      - name: Test SDK provenance and artifact selection
        shell: bash
        run: python3 -m unittest discover -s sources/holder-framework/staging/tests -v

      - name: Select development inputs or framework release pins
        id: pins
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
          DESKTOP_RUN_ID_INPUT: ${{ inputs.desktop_run_id }}
          BACKEND_RUN_ID_INPUT: ${{ inputs.backend_run_id }}
          BACKEND_REPOSITORY_INPUT: ${{ inputs.backend_repository }}
        run: |
          options=()
          if [[ -n "$RELEASE_MANIFEST" ]]; then
            options=(--release-manifest "sources/holder-framework/staging/$RELEASE_MANIFEST")
          fi
          python3 sources/holder-framework/staging/scripts/core-provenance.py prepare \
            --platform windows "${options[@]}"

      - name: Resolve artifact run IDs
        id: artifact_runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          DESKTOP_RUN_ID_INPUT: ${{ steps.pins.outputs.desktop_run_id }}
          BACKEND_RUN_ID_INPUT: ${{ steps.pins.outputs.backend_run_id }}
          BACKEND_REPOSITORY: ${{ steps.pins.outputs.backend_repository }}
        run: python3 sources/holder-framework/staging/scripts/resolve-component-runs.py --platform windows --build-type "${{ steps.pins.outputs.build_type }}"

      - name: Check out the desktop's commit for its version and packaging files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pins.outputs.desktop_repository }}
          ref: ${{ steps.artifact_runs.outputs.desktop_commit }}
          persist-credentials: false
          path: sources/desktop

      - name: Download desktop artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: holder-desktop-windows${{ steps.pins.outputs.build_type == 'Release' && '-release' || '' }}
          path: downloads/desktop
          github-token: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          repository: ${{ steps.pins.outputs.desktop_repository }}
          run-id: ${{ steps.artifact_runs.outputs.desktop_run_id }}

      - name: Download backend artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: holder-daemon-windows-backend${{ steps.pins.outputs.build_type == 'Release' && '-release' || '' }}
          path: downloads/backend
          github-token: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          repository: ${{ steps.pins.outputs.backend_repository }}
          run-id: ${{ steps.artifact_runs.outputs.backend_run_id }}

      - name: Download the backend run's core selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-selection
          path: out
          github-token: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          repository: ${{ steps.pins.outputs.backend_repository }}
          run-id: ${{ steps.artifact_runs.outputs.backend_run_id }}

      - name: Read the core the backend was built against
        id: core
        shell: bash
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("out/core-selection.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Verify backend core and release pins
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
          DESKTOP_COMMIT: ${{ steps.artifact_runs.outputs.desktop_commit }}
          BUILD_TYPE: ${{ steps.pins.outputs.build_type }}
        run: |
          options=()
          if [[ -n "$RELEASE_MANIFEST" ]]; then
            options=(--release-manifest "sources/holder-framework/staging/$RELEASE_MANIFEST")
          fi
          python3 sources/holder-framework/staging/scripts/core-provenance.py verify \
            --selection out/core-selection.json --platform windows \
            --backend-root downloads/backend --desktop-root downloads/desktop \
            --desktop-commit "$DESKTOP_COMMIT" --build-type "$BUILD_TYPE" \
            --backend-repository "${{ steps.pins.outputs.backend_repository }}" \
            --backend-run-id "${{ steps.artifact_runs.outputs.backend_run_id }}" \
            --output out/core-provenance.json "${options[@]}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Assemble unsigned staged package
        shell: pwsh
        env:
          BACKEND_REPOSITORY: ${{ steps.pins.outputs.backend_repository }}
          BACKEND_RUN_ID: ${{ steps.artifact_runs.outputs.backend_run_id }}
          DESKTOP_REPOSITORY: ${{ steps.pins.outputs.desktop_repository }}
          DESKTOP_RUN_ID: ${{ steps.artifact_runs.outputs.desktop_run_id }}
          PRODUCT_VERSION: ${{ steps.pins.outputs.appimage_version }}
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
          STAGING_REPOSITORY: ${{ github.repository }}
          STAGING_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $desktopSourceDir = "sources\desktop\apps\desktop\gtk"
          $desktopDir = "downloads\desktop"
          $backendDir = "downloads\backend"
          $stageDir = "out\artifacts\Holder-windows-staged"

          if (Test-Path $stageDir) {
            Remove-Item $stageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force $stageDir | Out-Null
          Copy-Item "$desktopDir\*" -Destination $stageDir -Recurse -Force

          $binDir = Join-Path $stageDir "bin"
          New-Item -ItemType Directory -Force $binDir | Out-Null

          Copy-Item "$backendDir\holderd.exe", "$backendDir\holderctl.exe" -Destination $binDir -Force
          Get-ChildItem $backendDir -Filter "*.dll" | Copy-Item -Destination $binDir -Force

          foreach ($runtimeDir in @("schema", "config", "assets")) {
            $source = Join-Path $backendDir $runtimeDir
            if (Test-Path $source) {
              Copy-Item $source -Destination $stageDir -Recurse -Force
            }
          }

          $openapi = Join-Path $backendDir "openapi.yaml"
          if (Test-Path $openapi) {
            Copy-Item $openapi -Destination $stageDir -Force
          }

          Copy-Item "$backendDir\core-build.json" -Destination $stageDir -Force
          if (Test-Path "$backendDir\vcpkg-licenses") {
            Copy-Item "$backendDir\vcpkg-licenses" -Destination $stageDir -Recurse -Force
          }
          $releaseDir = Join-Path $stageDir "release"
          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          Copy-Item "out\core-provenance.json" -Destination "$releaseDir\holder-core-provenance.json" -Force
          $packagingDir = Join-Path $releaseDir "packaging\windows"
          New-Item -ItemType Directory -Force $packagingDir | Out-Null
          Copy-Item "$desktopSourceDir\packaging\windows\Holder.iss" -Destination $packagingDir -Force
          Copy-Item "$desktopSourceDir\packaging\windows\Holder.ico" -Destination $packagingDir -Force

          $version = (Get-Content "$desktopSourceDir\VERSION" -Raw).Trim()
          if ($env:PRODUCT_VERSION) { $version = $env:PRODUCT_VERSION }
          if ($env:RELEASE_MANIFEST) {
            Copy-Item "sources/holder-framework/staging/$env:RELEASE_MANIFEST" -Destination "$releaseDir/holder-framework-release.json"
          }
          $metadataPath = Join-Path $releaseDir "release-candidate.json"
          $metadata = [ordered]@{
            core = (Get-Content "out/core-provenance.json" -Raw | ConvertFrom-Json)
            desktop_commit = "${{ steps.artifact_runs.outputs.desktop_commit }}"
            backend_run_commit = "${{ steps.artifact_runs.outputs.backend_commit }}"
            backend_artifact = "holder-daemon-windows-backend${{ steps.pins.outputs.build_type == 'Release' && '-release' || '' }}"
            backend_repository = $env:BACKEND_REPOSITORY
            backend_run_id = $env:BACKEND_RUN_ID
            created_utc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss'Z'")
            desktop_artifact = "holder-desktop-windows${{ steps.pins.outputs.build_type == 'Release' && '-release' || '' }}"
            desktop_tree = "${{ steps.artifact_runs.outputs.desktop_tree }}"
            desktop_repository = $env:DESKTOP_REPOSITORY
            desktop_run_id = $env:DESKTOP_RUN_ID
            platform = "windows"
            staging_artifact = "Holder-windows-staged"
            staging_repository = $env:STAGING_REPOSITORY
            staging_run_id = $env:STAGING_RUN_ID
            version = $version
          }
          $metadata | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 $metadataPath

          $root = (Resolve-Path $stageDir).Path
          Get-ChildItem $stageDir -Recurse -File |
            ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace("\", "/") } |
            Sort-Object |
            Set-Content -Encoding UTF8 (Join-Path $stageDir "manifest.txt")

          Get-ChildItem $stageDir -Recurse -File |
            ForEach-Object {
              $relative = $_.FullName.Substring($root.Length + 1).Replace("\", "/")
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $relative"
            } |
            Sort-Object |
            Set-Content -Encoding UTF8 (Join-Path $releaseDir "input-artifact-sha256.txt")

          Get-ChildItem $stageDir -Recurse -File |
            Where-Object { $_.FullName -notlike "*\release\staging-sha256.txt" } |
            ForEach-Object {
              $relative = $_.FullName.Substring($root.Length + 1).Replace("\", "/")
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $relative"
            } |
            Sort-Object |
            Set-Content -Encoding UTF8 (Join-Path $releaseDir "staging-sha256.txt")

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

          Get-ChildItem $stageDir -Recurse -File |
            Select-Object FullName, Length |
            Sort-Object FullName

      - name: Smoke-test unsigned staged package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stageDir = "out\artifacts\Holder-windows-staged"
          $requiredFiles = @(
            "core-build.json",
            "release\holder-core-provenance.json",
            "bin\holder-desktop.exe",
            "bin\holderd.exe",
            "bin\holderctl.exe",
            "share\glib-2.0\schemas\gschemas.compiled",
            "share\glib-2.0\schemas\team.holder.Holder.gschema.xml",
            "share\gtksourceview-5\language-specs\language2.rng",
            "lib\gio\modules\giomodule.cache",
            "lib\gdk-pixbuf-2.0\2.10.0\loaders.cache",
            "schema\schema.sql",
            "openapi.yaml",
            "manifest.txt",
            "release\release-candidate.json",
            "release\input-artifact-sha256.txt",
            "release\staging-sha256.txt",
            "release\packaging\windows\Holder.iss",
            "release\packaging\windows\Holder.ico"
          )

          foreach ($file in $requiredFiles) {
            $path = Join-Path $stageDir $file
            if (!(Test-Path $path)) {
              throw "Missing staged file: $file"
            }
          }

          $loaderCache = Join-Path $stageDir "lib\gdk-pixbuf-2.0\2.10.0\loaders.cache"
          if (Select-String -Path $loaderCache -Pattern "D:/a/|out/artifacts/windows-desktop|/ucrt64" -Quiet) {
            throw "GDK Pixbuf loader cache contains a build-machine path"
          }

          $manifest = Join-Path $stageDir "manifest.txt"
          if (Select-String -Path $manifest -Pattern "out/artifacts/windows-desktop|out/artifacts/Holder-windows-staged" -Quiet) {
            throw "Manifest contains a staging path"
          }

          $metadata = Get-Content (Join-Path $stageDir "release\release-candidate.json") -Raw | ConvertFrom-Json
          if ($metadata.platform -ne "windows") {
            throw "release-candidate.json platform is not windows"
          }
          if ($metadata.staging_repository -ne "${{ github.repository }}") {
            throw "release-candidate.json staging_repository does not match"
          }

          if ((Get-FileHash "$stageDir\core-build.json").Hash -ne (Get-FileHash "downloads\backend\core-build.json").Hash) {
            throw "Staged core provenance differs from backend"
          }
          # Each SDK in the selection records the commit that built it, which is an earlier commit
          # with the same core/ tree when the SDK came from the cache.
          $selection = Get-Content "out\core-selection.json" -Raw | ConvertFrom-Json
          $sdk = @($selection.assets | Where-Object { $_.platform -eq "windows" -and $_.build_type -eq $metadata.core.build_type })
          if ($sdk.Count -ne 1) {
            throw "The core selection has no single Windows $($metadata.core.build_type) SDK"
          }
          $sdkCommit = if ($sdk[0].commit) { $sdk[0].commit } else { $selection.commit }
          if ($metadata.core.commit -ne $sdkCommit) {
            throw "Product core provenance differs from selected SDK"
          }
          Push-Location $stageDir
          & ".\bin\holderd.exe" --help
          & ".\bin\holderd.exe" --version
          & ".\bin\holderctl.exe" --help
          Pop-Location

      - name: Build unsigned installer for smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $desktopSourceDir = "sources\desktop\apps\desktop\gtk"
          $stageDir = (Resolve-Path "out\artifacts\Holder-windows-staged").Path
          $outputDir = (New-Item -ItemType Directory -Force "out\artifacts\windows-unsigned-installer").FullName
          $scriptDir = (New-Item -ItemType Directory -Force "out\artifacts\windows-unsigned-installer-script").FullName
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }

          $sourceScript = Join-Path $desktopSourceDir "packaging\windows\Holder.iss"
          $sourceIcon = (Resolve-Path (Join-Path $desktopSourceDir "packaging\windows\Holder.ico")).Path
          $scriptPath = Join-Path $scriptDir "Holder.iss"

          $scriptContent = Get-Content $sourceScript -Raw
          $scriptContent = $scriptContent.Replace("SetupIconFile=packaging\windows\Holder.ico", "SetupIconFile=$sourceIcon")
          $scriptContent = $scriptContent.Replace('Source: "packaging\windows\Holder.ico"', "Source: `"$sourceIcon`"")
          $scriptContent | Set-Content -Encoding UTF8 $scriptPath

          & $iscc `
            "/DStageDir=$stageDir" `
            "/DAppVersion=$env:APP_VERSION" `
            "/O$outputDir" `
            "/FHolder-$env:APP_VERSION-Setup-unsigned" `
            $scriptPath
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compiler exited with code $LASTEXITCODE"
          }

          $setupExe = Join-Path $outputDir "Holder-$env:APP_VERSION-Setup-unsigned.exe"
          if (!(Test-Path $setupExe)) {
            throw "Unsigned installer was not created: $setupExe"
          }

          "UNSIGNED_SETUP_EXE=$setupExe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke-test unsigned installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = (New-Item -ItemType Directory -Force "out\installer-smoke\Holder-unsigned").FullName
          $logPath = Join-Path (Resolve-Path "out\installer-smoke").Path "unsigned-install.log"

          # Leave the user PATH the way an older installer and an ordinary user do: an entry that needs
          # expanding, and the old installer's bin directory (the runtime's DLLs), which must go.
          $environmentKey = "HKCU:\Environment"
          $originalPath = (Get-Item $environmentKey).GetValue("Path", "", "DoNotExpandEnvironmentNames")
          $originalKind = try { (Get-Item $environmentKey).GetValueKind("Path").ToString() } catch { "ExpandString" }
          $seedEntry = "%USERPROFILE%\holder-smoke-seed"
          $seed = "$seedEntry;" + (Join-Path $installDir "bin")
          $seeded = if ($originalPath) { "$originalPath;$seed" } else { $seed }
          New-ItemProperty -Path $environmentKey -Name Path -PropertyType ExpandString -Value $seeded -Force | Out-Null

          $process = Start-Process `
            -FilePath $env:UNSIGNED_SETUP_EXE `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/DIR=$installDir",
              "/LOG=$logPath"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            Get-Content $logPath -ErrorAction SilentlyContinue
            throw "Unsigned installer exited with code $($process.ExitCode)"
          }

          foreach ($file in @("bin\holder-desktop.exe", "bin\holderd.exe", "bin\holderctl.exe", "schema\schema.sql", "openapi.yaml", "core-build.json", "release\holder-core-provenance.json")) {
            $path = Join-Path $installDir $file
            if (!(Test-Path $path)) {
              throw "Unsigned installer missing installed file: $file"
            }
          }

          if ($env:RELEASE_MANIFEST) {
            $expected = "sources/holder-framework/staging/$env:RELEASE_MANIFEST"
            $installed = Join-Path $installDir "release/holder-framework-release.json"
            if ((Get-FileHash $expected).Hash -ne (Get-FileHash $installed).Hash) {
              throw "Installed framework release manifest differs from selected pins"
            }
          }

          & (Join-Path $installDir "bin\holderd.exe") --version
          & (Join-Path $installDir "bin\holderctl.exe") --help

          # The command-line tools: launchers that work, and the only thing the installer puts on PATH.
          foreach ($launcher in @("holderctl", "holderd")) {
            if (!(Test-Path (Join-Path $installDir "cli\$launcher.cmd"))) {
              throw "Missing command-line launcher: cli\$launcher.cmd"
            }
          }
          $ctlHelp = & (Join-Path $installDir "cli\holderctl.cmd") --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $ctlHelp -notmatch "Usage") {
            throw "cli\holderctl.cmd did not run holderctl (exit $LASTEXITCODE): $ctlHelp"
          }
          $daemonVersion = & (Join-Path $installDir "cli\holderd.cmd") --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "cli\holderd.cmd did not run holderd (exit $LASTEXITCODE): $daemonVersion"
          }

          $key = Get-Item $environmentKey
          $rawPath = $key.GetValue("Path", "", "DoNotExpandEnvironmentNames")
          $installedEntries = @($rawPath -split ";" | Where-Object { $_ })
          if ($installedEntries -notcontains (Join-Path $installDir "cli")) {
            throw "The cli directory is not on the user PATH by default"
          }
          if ($installedEntries -contains (Join-Path $installDir "bin")) {
            throw "The bin directory (the runtime's DLLs) must not be on the user PATH"
          }
          if ($installedEntries -notcontains $seedEntry) {
            throw "The installer lost or expanded an existing PATH entry: $rawPath"
          }
          if ($key.GetValueKind("Path").ToString() -ne "ExpandString") {
            throw "The installer changed the user PATH to a value type that does not expand variables"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            Start-Process `
              -FilePath $uninstaller `
              -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
              -Wait
          }

          # The uninstaller re-launches itself from a temporary copy, so wait for it to finish.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $installDir "cli")); $i++) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path (Join-Path $installDir "cli")) {
            throw "The uninstaller left the cli directory behind"
          }
          $afterEntries = @((Get-Item $environmentKey).GetValue("Path", "", "DoNotExpandEnvironmentNames") -split ";" | Where-Object { $_ })
          foreach ($leftover in @((Join-Path $installDir "cli"), (Join-Path $installDir "bin"))) {
            if ($afterEntries -contains $leftover) {
              throw "The uninstaller left $leftover on the user PATH"
            }
          }
          if ($afterEntries -notcontains $seedEntry) {
            throw "The uninstaller removed an entry that was not Holder's"
          }

          # Put the user PATH back as it was.
          New-ItemProperty -Path $environmentKey -Name Path -PropertyType $originalKind -Value $originalPath -Force | Out-Null

      - name: Build self-signed tester package
        if: inputs.sign_test_installer
        shell: pwsh
        env:
          WINDOWS_TEST_SIGNING_PFX: ${{ secrets.WINDOWS_TEST_SIGNING_PFX }}
          WINDOWS_TEST_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_TEST_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TEST_SIGNING_PFX)) {
            throw "WINDOWS_TEST_SIGNING_PFX is not set"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TEST_SIGNING_PFX_PASSWORD)) {
            throw "WINDOWS_TEST_SIGNING_PFX_PASSWORD is not set"
          }

          $testRoot = "out\artifacts\windows-test-signed"
          $testStage = Join-Path $testRoot "Holder-windows-test-signed"
          $installerDir = Join-Path $testRoot "installer"
          $certDir = Join-Path $testRoot "certificate"

          if (Test-Path $testRoot) {
            Remove-Item $testRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Force $testStage, $installerDir, $certDir | Out-Null
          Copy-Item "out\artifacts\Holder-windows-staged\*" -Destination $testStage -Recurse -Force

          $pfxPath = Join-Path $env:RUNNER_TEMP "holder-test-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_TEST_SIGNING_PFX))

          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName

            if (!$signtool) {
              throw "Microsoft signtool.exe not found"
            }

            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxPath,
              $env:WINDOWS_TEST_SIGNING_PFX_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            )
            $certPath = Join-Path $certDir "Holder-windows-test-signing.cer"
            [IO.File]::WriteAllBytes($certPath, $certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            "SHA256: $($certificate.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256))" |
              Set-Content -Encoding UTF8 (Join-Path $certDir "Holder-windows-test-signing-fingerprint.txt")
            "Subject: $($certificate.Subject)" |
              Add-Content -Encoding UTF8 (Join-Path $certDir "Holder-windows-test-signing-fingerprint.txt")

            $files = @(
              (Join-Path $testStage "bin\holder-desktop.exe"),
              (Join-Path $testStage "bin\holderd.exe"),
              (Join-Path $testStage "bin\holderctl.exe")
            )

            foreach ($file in $files) {
              if (!(Test-Path $file)) {
                throw "Cannot sign missing test file: $file"
              }

              & $signtool sign `
                -f $pfxPath `
                -fd SHA256 `
                -tr http://timestamp.digicert.com `
                -td SHA256 `
                -p $env:WINDOWS_TEST_SIGNING_PFX_PASSWORD `
                $file
              if ($LASTEXITCODE -ne 0) {
                throw "signtool failed for $file with code $LASTEXITCODE"
              }
            }

            $testReleaseDir = Join-Path $testStage "release"
            $testSigningMetadata = [ordered]@{
              certificate_sha256 = $certificate.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256)
              certificate_subject = $certificate.Subject
              note = "Self-signed tester build. Do not use as the canonical release signing input."
              signed_utc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss'Z'")
              signed_files = @(
                "bin/holder-desktop.exe",
                "bin/holderd.exe",
                "bin/holderctl.exe"
              )
            }
            $testSigningMetadata |
              ConvertTo-Json -Depth 4 |
              Set-Content -Encoding UTF8 (Join-Path $testReleaseDir "test-signing-result.json")

            $testRootPath = (Resolve-Path $testStage).Path
            Get-ChildItem $testStage -Recurse -File |
              ForEach-Object { $_.FullName.Substring($testRootPath.Length + 1).Replace("\", "/") } |
              Sort-Object |
              Set-Content -Encoding UTF8 (Join-Path $testStage "manifest.txt")

            Get-ChildItem $testStage -Recurse -File |
              Where-Object { $_.FullName -notlike "*\release\staging-sha256.txt" } |
              ForEach-Object {
                $relative = $_.FullName.Substring($testRootPath.Length + 1).Replace("\", "/")
                $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
                "$hash  $relative"
              } |
              Sort-Object |
              Set-Content -Encoding UTF8 (Join-Path $testReleaseDir "staging-sha256.txt")

            $desktopSourceDir = "sources\desktop\apps\desktop\gtk"
            $stageDir = (Resolve-Path $testStage).Path
            $outputDir = (Resolve-Path $installerDir).Path
            $scriptDir = (New-Item -ItemType Directory -Force (Join-Path $testRoot "installer-script")).FullName
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

            $sourceScript = Join-Path $desktopSourceDir "packaging\windows\Holder.iss"
            $sourceIcon = (Resolve-Path (Join-Path $desktopSourceDir "packaging\windows\Holder.ico")).Path
            $scriptPath = Join-Path $scriptDir "Holder.iss"

            $scriptContent = Get-Content $sourceScript -Raw
            $scriptContent = $scriptContent.Replace("SetupIconFile=packaging\windows\Holder.ico", "SetupIconFile=$sourceIcon")
            $scriptContent = $scriptContent.Replace('Source: "packaging\windows\Holder.ico"', "Source: `"$sourceIcon`"")
            $scriptContent | Set-Content -Encoding UTF8 $scriptPath

            & $iscc `
              "/DStageDir=$stageDir" `
              "/DAppVersion=$env:APP_VERSION" `
              "/O$outputDir" `
              "/FHolder-$env:APP_VERSION-Setup-test-signed" `
              $scriptPath
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup compiler exited with code $LASTEXITCODE"
            }

            $setupExe = Join-Path $installerDir "Holder-$env:APP_VERSION-Setup-test-signed.exe"
            if (!(Test-Path $setupExe)) {
              throw "Self-signed test installer was not created: $setupExe"
            }

            & $signtool sign `
              -f $pfxPath `
              -fd SHA256 `
              -tr http://timestamp.digicert.com `
              -td SHA256 `
              -p $env:WINDOWS_TEST_SIGNING_PFX_PASSWORD `
              $setupExe
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed for $setupExe with code $LASTEXITCODE"
            }

            "TEST_SIGNED_SETUP_EXE=$setupExe" | Out-File -FilePath $env:GITHUB_ENV -Append
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke-test self-signed tester installer
        if: inputs.sign_test_installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = (New-Item -ItemType Directory -Force "out\installer-smoke\Holder-test-signed").FullName
          $logPath = Join-Path (Resolve-Path "out\installer-smoke").Path "test-signed-install.log"

          $process = Start-Process `
            -FilePath $env:TEST_SIGNED_SETUP_EXE `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/DIR=$installDir",
              "/LOG=$logPath"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            Get-Content $logPath -ErrorAction SilentlyContinue
            throw "Self-signed test installer exited with code $($process.ExitCode)"
          }

          foreach ($file in @("bin\holder-desktop.exe", "bin\holderd.exe", "bin\holderctl.exe", "schema\schema.sql", "openapi.yaml", "core-build.json", "release\holder-core-provenance.json")) {
            $path = Join-Path $installDir $file
            if (!(Test-Path $path)) {
              throw "Self-signed installer missing installed file: $file"
            }
          }

          if ($env:RELEASE_MANIFEST) {
            $expected = "sources/holder-framework/staging/$env:RELEASE_MANIFEST"
            $installed = Join-Path $installDir "release/holder-framework-release.json"
            if ((Get-FileHash $expected).Hash -ne (Get-FileHash $installed).Hash) {
              throw "Installed framework release manifest differs from selected pins"
            }
          }

          & (Join-Path $installDir "bin\holderd.exe") --version
          & (Join-Path $installDir "bin\holderctl.exe") --help

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            Start-Process `
              -FilePath $uninstaller `
              -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
              -Wait
          }

      - name: Upload unsigned staged package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Holder-windows-staged
          path: out/artifacts/Holder-windows-staged/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload self-signed tester installer
        if: inputs.sign_test_installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Holder-windows-test-signed-installer
          path: |
            out/artifacts/windows-test-signed/installer/*.exe
            out/artifacts/windows-test-signed/certificate/*
          if-no-files-found: error
          retention-days: 7
