name: Release / Holder Python to PyPI

# Build the pure-Python wheel and source archive on pull requests or manual runs.
# PyPI publishing requires a matching root VERSION and a release tag. TestPyPI
# previews use a fresh post-release version from main without changing repository versions.
on:
  pull_request:
    paths:
      - .github/workflows/release-holder-python-pypi.yml
      - python/holder/**
      - VERSION
  workflow_dispatch:
    inputs:
      destination:
        description: Build only, publish a TestPyPI preview, or publish from a release tag
        type: choice
        options: [none, testpypi, pypi]
        default: none
      preview_number:
        description: TestPyPI preview number (0 for a tagged release; 1 makes <version>.post1)
        type: number
        default: 0

permissions:
  contents: read

defaults:
  run:
    working-directory: python/holder

jobs:
  distributions:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.config.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare the version and destination
        id: config
        env:
          DESTINATION: ${{ inputs.destination || 'none' }}
          PREVIEW_NUMBER: ${{ inputs.preview_number || '0' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          pyproject = Path('pyproject.toml')
          contents = pyproject.read_text()
          version = tomllib.loads(contents)['project']['version']
          holder_version = Path('../../VERSION').read_text().strip()
          assert version == holder_version, f'Python package is at {version}, not Holder {holder_version}'
          preview = int(os.environ['PREVIEW_NUMBER'])
          assert preview >= 0, 'Preview number must be non-negative'
          destination = os.environ['DESTINATION']
          ref = os.environ['GITHUB_REF']
          if preview:
              assert destination == 'testpypi', 'Preview versions may only publish to TestPyPI'
              assert ref == 'refs/heads/main', 'Preview versions must be built from main'
              candidate = f'{version}.post{preview}'
              original = f'version = "{version}"'
              assert contents.count(original) == 1, 'Expected one project version field'
              pyproject.write_text(contents.replace(original, f'version = "{candidate}"', 1))
              version = candidate
          elif destination != 'none':
              release_tag = f'refs/tags/holder-v{version}'
              backfill_tags = {'refs/tags/holder-python-v0.2.5-r2'}
              assert ref == release_tag or (version == '0.2.5' and ref in backfill_tags), (
                  'Publishing requires the matching Holder release tag or an allowed 0.2.5 package-only tag'
              )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Build and check distributions
        run: |
          python scripts/pypi_readme.py --commit "$GITHUB_SHA"
          python -m pip install 'build>=1.2,<2' twine
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - name: Verify both installed distributions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          files = sorted(path.name for path in Path('dist').iterdir())
          expected = [f'holder_python-{version}-py3-none-any.whl', f'holder_python-{version}.tar.gz']
          assert files == expected, f'Unexpected distribution set: {files}'
          PY
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          for kind in wheel source; do
            python -m venv "out/$kind-venv"
            test_python="out/$kind-venv/bin/python"
            if [ "$kind" = wheel ]; then
              package="dist/holder_python-${version}-py3-none-any.whl"
            else
              package="dist/holder_python-${version}.tar.gz"
            fi
            "$test_python" -m pip install "$package"
            (cd /tmp && HOLDER_PYTHON_VERSION="$version" "$GITHUB_WORKSPACE/python/holder/$test_python" -I - <<'PY'
          import importlib.metadata as metadata
          import os
          from holder import Holder
          from holder.generated.api.default import get_projects

          distribution = metadata.distribution('holder-python')
          assert distribution.version == os.environ['HOLDER_PYTHON_VERSION']
          assert distribution.metadata['Name'] == 'holder-python'
          assert distribution.metadata['License-Expression'] == 'GPL-3.0-only'
          assert Holder is not None and get_projects is not None
          assert distribution.locate_file('holder/py.typed').is_file()
          PY
            )
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holder-python-distributions
          path: python/holder/dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.destination != 'none'
    needs: distributions
    runs-on: ubuntu-24.04
    environment: ${{ inputs.destination }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: holder-python-distributions
          path: dist
      - name: Publish to TestPyPI
        if: inputs.destination == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: inputs.destination == 'testpypi'
        with:
          python-version: '3.12'
      - name: Install the published wheel from TestPyPI
        if: inputs.destination == 'testpypi'
        working-directory: ${{ github.workspace }}
        env:
          PACKAGE_VERSION: ${{ needs.distributions.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip download --no-deps --only-binary=:all: \
            --index-url https://test.pypi.org/simple/ \
            --dest /tmp/holder-python-testpypi "holder-python==$PACKAGE_VERSION"
          python -m venv /tmp/holder-python-testpypi-venv
          /tmp/holder-python-testpypi-venv/bin/python -m pip install /tmp/holder-python-testpypi/*.whl
          (cd /tmp && /tmp/holder-python-testpypi-venv/bin/python -I -c \
            'from importlib.metadata import version; from holder import Holder; assert Holder is not None; assert version("holder-python") == __import__("os").environ["PACKAGE_VERSION"]')
      - name: Publish to PyPI
        if: inputs.destination == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
