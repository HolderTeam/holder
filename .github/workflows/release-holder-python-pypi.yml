name: Release / Holder Python to PyPI
run-name: ${{ inputs.release_request || github.event.pull_request.title || github.workflow }}

# Build native desktop wheels, the universal wheel and source archive.
# PyPI publishing requires a matching root VERSION and a release tag. TestPyPI
# previews use a fresh post-release version from main without changing repository versions.
on:
  pull_request:
    paths:
      - .github/workflows/release-holder-python-pypi.yml
      - python/holder/**
      - python/kit/CMakeLists.txt
      - python/kit/src/**
      - python/kit/scripts/repair-linux-wheel.py
      - python/kit/scripts/wheel-notices.py
      - python/kit/scripts/licenses/**
      - .github/workflows/core-sdk.yml
      - .github/actions/core-sdk/**
      - release/scripts/fetch-candidate-sdk.py
      - VERSION
      - python/_build_support.py
      - release/scripts/python-distributions.py
      - release/scripts/publish-python.py
      - release/staging/scripts/**
  workflow_dispatch:
    inputs:
      release_request:
        description: Optional coordinator request identifier
        type: string
        default: ''
      prepared_release_path:
        description: Optional python-manifests/<candidate>.json prepared artifact record
        type: string
        default: ''
      prepared_release_ref:
        description: Immutable commit holding the prepared artifact record; publish without rebuilding
        type: string
        default: ''
      release_manifest:
        description: Optional generated candidate manifest for pinned SDK reuse (build only)
        type: string
        default: ''
      release_manifest_ref:
        description: Immutable commit holding the candidate manifest
        type: string
        default: ''
      destination:
        description: Build only, publish a TestPyPI preview, or publish from a release tag
        type: choice
        options: [none, testpypi, pypi]
        default: none
      preview_number:
        description: TestPyPI preview number (0 for a tagged release; 1 makes <version>.post1)
        type: number
        default: 0

permissions:
  actions: read
  contents: read

defaults:
  run:
    working-directory: python/holder

jobs:
  portable:
    if: inputs.prepared_release_ref == ''
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.config.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare the version and destination
        id: config
        env:
          DESTINATION: ${{ inputs.destination || 'none' }}
          PREVIEW_NUMBER: ${{ inputs.preview_number || '0' }}
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
          RELEASE_MANIFEST_REF: ${{ inputs.release_manifest_ref }}
          PREPARED_PATH: ${{ inputs.prepared_release_path }}
          PREPARED_REF: ${{ inputs.prepared_release_ref }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          version = Path('../../VERSION').read_text().strip()
          assert bool(os.environ['PREPARED_PATH']) == bool(os.environ['PREPARED_REF']), 'Provide both prepared release inputs'
          preview = int(os.environ['PREVIEW_NUMBER'])
          assert preview >= 0, 'Preview number must be non-negative'
          destination = os.environ['DESTINATION']
          pinned = os.environ['RELEASE_MANIFEST']
          assert bool(pinned) == bool(os.environ['RELEASE_MANIFEST_REF']), 'Provide both candidate manifest inputs'
          assert not pinned or destination == 'none', 'Candidate SDK reuse is build-only'
          ref = os.environ['GITHUB_REF']
          if preview:
              assert destination == 'testpypi', 'Preview versions may only publish to TestPyPI'
              assert ref == 'refs/heads/main', 'Preview versions must be built from main'
              candidate = f'{version}.post{preview}'
              version = candidate
          elif destination != 'none':
              release_tag = f'refs/tags/holder-v{version}'
              backfill_tags = {'refs/tags/holder-python-v0.2.5-r2'}
              assert ref == release_tag or (version == '0.2.5' and ref in backfill_tags), (
                  'Publishing requires the matching Holder release tag or an allowed 0.2.5 package-only tag'
              )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'HOLDER_PYTHON_PREVIEW_NUMBER={preview}\n')
          PY
      - name: Build and check distributions
        run: |
          python scripts/pypi_readme.py --commit "$GITHUB_SHA"
          python -m pip install 'build>=1.2,<2' twine
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - name: Verify both installed distributions
        env:
          PACKAGE_VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          version = os.environ['PACKAGE_VERSION']
          files = sorted(path.name for path in Path('dist').iterdir())
          expected = [f'holder_python-{version}-py3-none-any.whl', f'holder_python-{version}.tar.gz']
          assert files == expected, f'Unexpected distribution set: {files}'
          PY
          version="$PACKAGE_VERSION"
          for kind in wheel source; do
            python -m venv "out/$kind-venv"
            test_python="out/$kind-venv/bin/python"
            if [ "$kind" = wheel ]; then
              package="dist/holder_python-${version}-py3-none-any.whl"
            else
              package="dist/holder_python-${version}.tar.gz"
            fi
            "$test_python" -m pip install "$package"
            (cd /tmp && "$GITHUB_WORKSPACE/python/holder/$test_python" -I \
              "$GITHUB_WORKSPACE/python/holder/scripts/test-installed-wheel.py" --version "$version")
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holder-python-portable
          path: python/holder/dist/*
          if-no-files-found: error

  core-sdk:
    if: inputs.release_manifest == ''
    needs: portable
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-sdk.yml
    with:
      build_type: Release
      platforms: '["linux", "macos", "windows"]'

  native:
    if: ${{ !cancelled() && needs.portable.result == 'success' && (needs.core-sdk.result == 'success' || (needs.core-sdk.result == 'skipped' && inputs.release_manifest != '')) }}
    needs: [portable, core-sdk]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        platform: [linux, macos, windows]
        include:
          - platform: linux
            runner: ubuntu-24.04
            tag: manylinux_2_39_x86_64
          - platform: macos
            runner: macos-15
            tag: macosx_15_0_arm64
          - platform: windows
            runner: windows-2025
            tag: win_amd64
    defaults:
      run:
        working-directory: ${{ github.workspace }}
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'
      - uses: ./.github/actions/core-sdk
        with:
          commit: ${{ inputs.release_manifest != '' && github.sha || needs.core-sdk.outputs.commit }}
          build-type: Release
          release-manifest: ${{ inputs.release_manifest }}
          release-manifest-ref: ${{ inputs.release_manifest_ref }}
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            patchelf libssl-dev nlohmann-json3-dev libyaml-cpp-dev libspdlog-dev \
            libsqlite3-dev libsodium-dev libgit2-dev libmd4c-dev libsecret-1-dev
          python -m pip install 'auditwheel==6.8.2'
      - name: Install macOS build dependencies
        if: matrix.platform == 'macos'
        run: |
          brew install cmake ninja pkg-config nlohmann-json yaml-cpp spdlog sqlite \
            libsodium libgit2 md4c openssl@3
          python -m pip install delocate
          echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"
      - name: Install Windows repair tools
        if: matrix.platform == 'windows'
        run: python -m pip install delvewheel
      - name: Stage the extension and build the native wheel
        env:
          HOLDER_PYTHON_PREVIEW_NUMBER: ${{ inputs.preview_number || '0' }}
        run: |
          set -euo pipefail
          python -m pip install 'build>=1.2,<2' wheel twine
          work="$PWD/out"
          args=(-DCMAKE_BUILD_TYPE=Release -DHOLDER_KIT_INSTALL_DIR=holder/_embedded)
          case "$RUNNER_OS" in
            macOS)
              openssl="$(brew --prefix openssl@3)"
              args+=(-DCMAKE_OSX_ARCHITECTURES=arm64
                "-DCMAKE_PREFIX_PATH=$(brew --prefix);$openssl" "-DOPENSSL_ROOT_DIR=$openssl") ;;
            Windows)
              work="$(cygpath -m "$work")"
              sdk="$HOLDER_CORE_SDK"
              args+=("-DCMAKE_TOOLCHAIN_FILE=$sdk/vcpkg/scripts/buildsystems/vcpkg.cmake"
                "-DVCPKG_INSTALLED_DIR=$sdk/vcpkg/installed" -DVCPKG_TARGET_TRIPLET=x64-windows
                -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_APPLOCAL_DEPS=OFF) ;;
          esac
          cmake -S python/kit -B out/kit -G Ninja \
            -DPython_EXECUTABLE="$(python -c 'import pathlib,sys; print(pathlib.Path(sys.executable).as_posix())')" \
            -DCMAKE_INSTALL_PREFIX="$work/stage" "${args[@]}"
          cmake --build out/kit
          cmake --install out/kit --component holder_native
          python python/holder/scripts/pypi_readme.py --commit "$GITHUB_SHA"
          HOLDER_PYTHON_EMBEDDED_STAGE="$work/stage" \
            python -m build --wheel --outdir "$work/raw" python/holder
          if [ "$RUNNER_OS" = Linux ]; then
            python python/kit/scripts/repair-linux-wheel.py --output out/wheel out/raw/*.whl
          else
            python python/kit/scripts/wheel-notices.py --output out/noticed out/raw/*.whl
            if [ "$RUNNER_OS" = macOS ]; then
              delocate-wheel --require-archs arm64 -v -w out/wheel out/noticed/*.whl
            else
              python -m delvewheel repair --add-path "$HOLDER_CORE_SDK/bin" -w out/wheel out/noticed/*.whl
            fi
          fi
          python -m twine check --strict out/wheel/*.whl
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: holder-python-portable
          path: out/wheel
      - name: Verify pip selects the native wheel
        env:
          PACKAGE_VERSION: ${{ needs.portable.outputs.version }}
          PLATFORM_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          python -m pip download --no-index --no-deps --only-binary=:all: \
            --find-links out/wheel --dest out/selected "holder-python==$PACKAGE_VERSION"
          wheels=(out/selected/*-"$PLATFORM_TAG".whl)
          test "${#wheels[@]}" -eq 1
          test -f "${wheels[0]}"
      - name: Install and exercise the native wheel on a clean Debian runtime
        if: matrix.platform == 'linux'
        env:
          PACKAGE_VERSION: ${{ needs.portable.outputs.version }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          docker run --rm -e PACKAGE_VERSION \
            -v "$PWD/out/selected:/wheels:ro" \
            -v "$PWD/python/holder/scripts/test-installed-wheel.py:/test-installed-wheel.py:ro" \
            "python:${PYTHON_VERSION}-slim-trixie" \
            sh -ec 'python -m pip install /wheels/*.whl &&
              python -I /test-installed-wheel.py --version "$PACKAGE_VERSION" --embedded'
      - name: Exercise the native wheel in a fresh virtual environment
        if: matrix.platform != 'linux'
        env:
          PACKAGE_VERSION: ${{ needs.portable.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv out/wheel-test
          args=(--embedded)
          if [ "$RUNNER_OS" = Windows ]; then
            test_python=out/wheel-test/Scripts/python.exe
            args+=(--repaired-windows)
          else
            test_python=out/wheel-test/bin/python
          fi
          "$test_python" -m pip install out/selected/*.whl
          env -u HOLDER_CORE_SDK -u CMAKE_ARGS -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            "$test_python" -I python/holder/scripts/test-installed-wheel.py \
              --version "$PACKAGE_VERSION" "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holder-python-native-${{ matrix.platform }}-${{ matrix.python }}
          path: out/selected/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'linux' && matrix.python == '3.12' && inputs.release_manifest != ''
        with:
          name: holder-python-core-selection
          path: out/core-selection.json
          if-no-files-found: error

  distributions:
    needs: [portable, native]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ needs.portable.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: holder-python-portable
          path: python/holder/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: holder-python-native-*
          path: python/holder/dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.release_manifest == ''
        with:
          name: core-selection
          path: python/holder/out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.release_manifest != ''
        with:
          name: holder-python-core-selection
          path: python/holder/out
      - name: Record the verified distribution set
        env:
          PACKAGE_VERSION: ${{ needs.portable.outputs.version }}
        run: |
          python ../../release/scripts/python-distributions.py --directory dist \
            --version "$PACKAGE_VERSION" --candidate "$GITHUB_SHA" --selection out/core-selection.json \
            --output out/release-manifest.json --desktop-wheels
          python -m pip download --no-index --no-deps --only-binary=:all: \
            --find-links dist --dest out/fallback --implementation cp \
            --python-version 3.12 --platform win_arm64 "holder-python==$PACKAGE_VERSION"
          test -f "out/fallback/holder_python-$PACKAGE_VERSION-py3-none-any.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holder-python-distributions
          path: python/holder/dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holder-python-release-manifest
          path: python/holder/out/release-manifest.json
          if-no-files-found: error

  prepared:
    if: github.event_name == 'workflow_dispatch' && inputs.prepared_release_ref != ''
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.fetch.outputs.version }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Fetch and verify the prepared distributions
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_PATH: ${{ inputs.prepared_release_path }}
          PREPARED_REF: ${{ inputs.prepared_release_ref }}
          DESTINATION: ${{ inputs.destination }}
          PREVIEW_NUMBER: ${{ inputs.preview_number || '0' }}
        run: |
          test "$PREVIEW_NUMBER" = 0
          python release/scripts/publish-python.py fetch --package python --destination "$DESTINATION" \
            --prepared-path "$PREPARED_PATH" --prepared-ref "$PREPARED_REF" --receipt out/publication-input.json
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holder-python-distributions
          path: dist/*
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-publication-input
          path: out/publication-input.json
          if-no-files-found: error
          overwrite: true

  publish:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.destination != 'none' && (needs.distributions.result == 'success' || needs.prepared.result == 'success') }}
    needs: [distributions, prepared]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.destination }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.prepared_release_ref != '' || inputs.destination == 'testpypi'
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: inputs.prepared_release_ref != '' || inputs.destination == 'testpypi'
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: holder-python-distributions
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.prepared_release_ref != ''
        with:
          name: prepared-publication-input
          path: out
      - name: Check existing index files and select missing uploads
        if: inputs.prepared_release_ref != ''
        id: plan
        working-directory: ${{ github.workspace }}
        run: python release/scripts/publish-python.py plan --receipt out/publication-input.json
      - name: Publish to TestPyPI
        if: inputs.destination == 'testpypi' && (inputs.prepared_release_ref == '' || steps.plan.outputs.remaining != '0')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: ${{ inputs.prepared_release_ref != '' && 'pending/' || 'dist/' }}
      - name: Install the published wheel from TestPyPI
        if: inputs.destination == 'testpypi'
        working-directory: ${{ github.workspace }}
        env:
          PACKAGE_VERSION: ${{ needs.prepared.outputs.version || needs.distributions.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip download --no-deps --only-binary=:all: \
            --index-url https://test.pypi.org/simple/ \
            --dest /tmp/holder-python-testpypi "holder-python==$PACKAGE_VERSION"
          python -m venv /tmp/holder-python-testpypi-venv
          /tmp/holder-python-testpypi-venv/bin/python -m pip install /tmp/holder-python-testpypi/*.whl
          (cd /tmp && /tmp/holder-python-testpypi-venv/bin/python -I \
            "$GITHUB_WORKSPACE/python/holder/scripts/test-installed-wheel.py" --version "$PACKAGE_VERSION" --embedded)
      - name: Publish to PyPI
        if: inputs.destination == 'pypi' && (inputs.prepared_release_ref == '' || steps.plan.outputs.remaining != '0')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ inputs.prepared_release_ref != '' && 'pending/' || 'dist/' }}
      - name: Verify the published file set
        if: inputs.prepared_release_ref != ''
        working-directory: ${{ github.workspace }}
        run: python release/scripts/publish-python.py verify --receipt out/publication-input.json --output out/publication.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.prepared_release_ref != ''
        with:
          name: python-${{ inputs.destination }}-publication
          path: out/publication.json
          if-no-files-found: error
          overwrite: true
