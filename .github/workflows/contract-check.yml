name: Contract / Check

# The contract's tooling (contract/): lint, its tests (including compiling and running the generated
# C API and HTTP routes), a check that the contract follows its rules, and a check that the files
# generated from it match: core's C API, the daemon's routes, and api/openapi.yaml and .json. Nothing in contract/ ships;
# .github/scripts/check-contract-boundary.py, run by Repository / Checks, keeps it that way.

on:
  # Pull requests always start this workflow so that its required result check is reported;
  # the changes job decides whether the checks run. Keep its pattern in step with these paths.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'contract/**'
      - 'core/include/holder/holder.h'
      - 'core/include/holder/holder_api.h'
      - 'core/src/api/Contract.h'
      - 'core/src/api/ContractGlue.cpp'
      - 'daemon/src/api/generated/ContractJson.h'
      - 'daemon/src/api/generated/ContractRoutes.h'
      - 'api/openapi.yaml'
      - 'api/openapi.json'
      - 'api/openapi-base.json'
      - '.github/workflows/contract-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.select.outputs.contract }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        name: Select jobs from the changed paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            echo "contract=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The pull request merge commit's parents are the base and the pull request head.
          changed=$(git diff --name-only HEAD^1...HEAD^2)
          printf '%s\n' "$changed"
          # The generated files are checked too: editing one by hand, holder.h, which the check reads
          # for name collisions, or the API metadata it merges, must run the contract check.
          if grep -qE '^(contract/|core/include/holder/holder(_api)?\.h$|core/src/api/Contract(\.h|Glue\.cpp)$|daemon/src/api/generated/Contract(Json|Routes)\.h$|api/openapi\.(yaml|json)$|api/openapi-base\.json$|\.github/workflows/contract-check\.yml$)' <<< "$changed"; then
            echo "contract=true" >> "$GITHUB_OUTPUT"
          else
            echo "contract=false" >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is the oldest Python with `type` statements, which the contract uses.
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      # The compile-and-run tests of the daemon's routes need nlohmann/json, as the daemon does.
      - run: sudo apt-get install -y --no-install-recommends nlohmann-json3-dev
      - run: make check PYTHON=python
  result:
    name: Contract check result
    # The required check. It runs even when jobs fail or are skipped, and passes only when the
    # checks succeeded or were rightly skipped.
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          SELECTED: ${{ needs.changes.outputs.contract }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e --arg selected "$SELECTED" '
            .changes.result == "success" and
            .check.result == (if $selected == "true" then "success" else "skipped" end)' <<< "$RESULTS" > /dev/null
