name: Website / CI

# Builds the website (www.holder.team) in release/website/ with Jekyll as its deployment does, and
# runs its download check. Deployment is separate.

on:
  # Pull requests always start this workflow so that its required result check is reported;
  # the changes job decides whether the build runs. Keep its pattern in step with these paths.
  pull_request:
  push:
    branches:
      - main
    paths:
      - release/website/**
      - .github/workflows/website-ci.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: release/website

jobs:
  changes:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    outputs:
      website: ${{ steps.select.outputs.website }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        name: Select jobs from the changed paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            echo "website=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The pull request merge commit's parents are the base and the pull request head.
          changed=$(git diff --name-only HEAD^1...HEAD^2)
          printf '%s\n' "$changed"
          if grep -qE '^(release/website/|\.github/workflows/website-ci\.yml$)' <<< "$changed"; then
            echo "website=true" >> "$GITHUB_OUTPUT"
          else
            echo "website=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: release/website
      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Test download detection
        run: node scripts/test-downloads.js

  result:
    name: Website CI result
    # The required check. It runs even when jobs fail or are skipped, and passes only when every
    # selected job succeeded and no job ran that was not selected.
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check job results
        env:
          SELECTED: ${{ needs.changes.outputs.website }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e --arg selected "$SELECTED" '
            .changes.result == "success" and
            (if $selected == "true" then .build.result == "success" else .build.result == "skipped" end)' \
            <<< "$RESULTS" > /dev/null
