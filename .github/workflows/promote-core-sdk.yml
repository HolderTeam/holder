name: Release / Promote core SDK

# Attaches the core SDK archives that a release's daemon was built against to the draft
# holder-v<version> release, creating the draft if no other promotion has yet. The archives come
# from the release's Daemon CI run (dispatched with core_build_type=Release), with that run's
# core-selection index, so the SDKs users download are exactly the core the shipped daemon uses.

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact release version, for example 0.2.5
        required: true
        type: string
      daemon_ci_run_id:
        description: Successful Daemon CI run, dispatched with core_build_type=Release, that the release's backends come from
        required: true
        type: string
      release_tag:
        description: Optional exact release tag; blank uses holder-v<expected_version>
        required: false
        default: ""
        type: string
      allow_published_prerelease:
        description: Allow adding assets to an existing published prerelease for the exact version
        required: false
        default: false
        type: boolean

run-name: Promote core SDK ${{ inputs.expected_version }} to release

permissions:
  actions: read
  contents: read

concurrency:
  group: holder-draft-release-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: run
        name: Check the Daemon CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.daemon_ci_run_id }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "daemon_ci_run_id must be numeric; got '$RUN_ID'" >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "expected_version must be a version like 0.2.5; got '$EXPECTED_VERSION'" >&2
            exit 1
          fi
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          path="$(jq -r '.path' <<< "$run")"
          conclusion="$(jq -r '.conclusion' <<< "$run")"
          if [ "${path}" != .github/workflows/daemon-ci.yml ] || [ "${conclusion}" != success ]; then
            echo "Run ${RUN_ID} is ${path} with conclusion ${conclusion}; a successful Daemon CI run is required." >&2
            exit 1
          fi
          echo "commit=$(jq -r '.head_sha' <<< "$run")" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG_INPUT:-holder-v${EXPECTED_VERSION}}" >> "$GITHUB_OUTPUT"

      - name: Download the run's core selection
        uses: actions/download-artifact@v8
        with:
          name: core-selection
          path: out
          github-token: ${{ github.token }}
          run-id: ${{ inputs.daemon_ci_run_id }}

      - name: Download the run's Release SDKs
        uses: actions/download-artifact@v8
        with:
          pattern: core-sdk-*-Release
          path: out/core-sdk
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.daemon_ci_run_id }}

      - name: Verify the SDKs against the selection and the release version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          # Re-index the downloaded archives and require the same description the run recorded:
          # the same run commit and core/ tree, version, configurations, per-archive commits, sizes
          # and checksums.
          python3 core/scripts/core-sdk.py index --assets out/core-sdk --output out/downloaded-selection.json \
            --commit "$(jq -r .commit out/core-selection.json)" --tree "$(jq -r .core_tree out/core-selection.json)"
          python3 - <<'EOF'
          import json, os, sys
          recorded = json.load(open("out/core-selection.json"))
          downloaded = json.load(open("out/downloaded-selection.json"))
          key = lambda asset: asset["name"]
          if sorted(recorded["assets"], key=key) != sorted(downloaded["assets"], key=key) or \
             any(recorded.get(k) != downloaded.get(k) for k in ("commit", "core_tree", "version")):
              sys.exit("The downloaded SDKs differ from the run's core selection")
          configurations = {(a["platform"], a["build_type"]) for a in recorded["assets"]}
          if configurations != {("linux", "Release"), ("macos", "Release"), ("windows", "Release")}:
              sys.exit(f"Expected Release SDKs for linux, macos and windows; got {sorted(configurations)}")
          if recorded["version"] != os.environ["EXPECTED_VERSION"]:
              sys.exit(f"Core is at {recorded['version']}, not the release version {os.environ['EXPECTED_VERSION']}")
          print(f"Core {recorded['version']} from {recorded['commit']}: {len(recorded['assets'])} Release SDKs")
          EOF
          cp out/core-selection.json out/core-sdk/core-sdk-index.json

      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.run.outputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          ALLOW_PUBLISHED_PRERELEASE: ${{ inputs.allow_published_prerelease }}
        run: |
          set -euo pipefail
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matching_release="$(jq -c --arg tag "${RELEASE_TAG}" '[.[] | select(.tag_name == $tag)]' <<< "${releases}")"
          match_count="$(jq 'length' <<< "${matching_release}")"
          if [ "${match_count}" -gt 1 ]; then
            echo "GitHub returned more than one release for tag ${RELEASE_TAG}." >&2
            exit 1
          fi
          if [ "${match_count}" -eq 1 ]; then
            is_draft="$(jq -r '.[0].draft' <<< "${matching_release}")"
            is_prerelease="$(jq -r '.[0].prerelease' <<< "${matching_release}")"
            if [ "${is_draft}" != "true" ] &&
               { [ "${ALLOW_PUBLISHED_PRERELEASE}" != "true" ] || [ "${is_prerelease}" != "true" ]; }; then
              echo "Release ${RELEASE_TAG} is already published; only an explicitly allowed prerelease may be updated." >&2
              exit 1
            fi
            echo "Using existing release ${RELEASE_TAG} without changing its title or description."
          else
            create_args=("${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft
              --title "Holder ${EXPECTED_VERSION}"
              --notes "Release notes pending. Edit this draft before publishing.")
            if [[ "${EXPECTED_VERSION}" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
            echo "Created draft ${RELEASE_TAG}."
          fi

      - name: Upload core SDKs without editing release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.run.outputs.release_tag }}
          DAEMON_CI_RUN_ID: ${{ inputs.daemon_ci_run_id }}
          RUN_COMMIT: ${{ steps.run.outputs.commit }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find out/core-sdk -maxdepth 1 -type f | sort)
          gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${assets[@]}"
          {
            echo "## Core SDKs promoted to ${RELEASE_TAG}"
            echo
            echo "From Daemon CI run [${DAEMON_CI_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${DAEMON_CI_RUN_ID}) at \`${RUN_COMMIT}\`:"
            echo
            for asset in "${assets[@]}"; do echo "- \`$(basename "$asset")\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
