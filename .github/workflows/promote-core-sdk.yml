name: Release / Promote core SDK

# Publishes the core SDK archives that a release's daemon was built against to HolderTeam/holder-sdk
# as the release holder-v<version>, beside main's development snapshots. The archives come from the
# release's Daemon CI run (dispatched with core_build_type=Release), with that run's core-selection
# index, so the SDKs people download are exactly the core the shipped daemon uses. Holder's own
# release holds what users install; the SDKs live in holder-sdk. Run it from main: only main may
# use the holder-sdk-publish environment, which holds the publishing app's key.

on:
  workflow_dispatch:
    inputs:
      release_request:
        description: Optional coordinator request identifier
        type: string
        default: ''
      prepared_sdk_path:
        description: Optional sdk-manifests/<candidate>.json pinned SDK input record
        type: string
        default: ''
      prepared_sdk_ref:
        description: Immutable commit holding the pinned SDK input record
        type: string
        default: ''
      expected_version:
        description: Exact release version, for example 0.2.5
        required: true
        type: string
      daemon_ci_run_id:
        description: Successful Daemon CI run, dispatched with core_build_type=Release, that the release's backends come from
        required: true
        type: string
      release_tag:
        description: Optional exact release tag; blank uses holder-v<expected_version>
        required: false
        default: ""
        type: string

run-name: ${{ inputs.release_request || format('Promote core SDK {0} to release', inputs.expected_version) }}

permissions:
  actions: read
  contents: read

concurrency:
  group: holder-sdk-publish
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: holder-sdk-publish
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch and verify the exact Release SDK inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.daemon_ci_run_id }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          PREPARED_SDK_PATH: ${{ inputs.prepared_sdk_path }}
          PREPARED_SDK_REF: ${{ inputs.prepared_sdk_ref }}
        run: |
          set -euo pipefail
          test -z "$RELEASE_TAG_INPUT" || test "$RELEASE_TAG_INPUT" = "holder-v$EXPECTED_VERSION"
          python3 release/scripts/publish-core-sdk.py fetch --repository "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID" --version "$EXPECTED_VERSION" --directory out/sdk-release \
            --prepared-path "$PREPARED_SDK_PATH" --prepared-ref "$PREPARED_SDK_REF"

      - id: token
        name: Get a token for holder-sdk
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOLDER_SDK_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOLDER_SDK_APP_PRIVATE_KEY }}
          owner: HolderTeam
          repositories: holder-sdk
          permission-contents: write

      - name: Publish the verified SDK set without replacing existing assets
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SOURCE_GH_TOKEN: ${{ github.token }}
        run: python3 release/scripts/publish-core-sdk.py publish --directory out/sdk-release

      - name: Retain SDK publication evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-sdk-publication
          path: |
            out/sdk-release/sdk-publication-input.json
            out/sdk-release/sdk-publication.json
          if-no-files-found: error
          overwrite: true
