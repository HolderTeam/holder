name: Release / Promote Linux AppImage

on:
  workflow_dispatch:
    inputs:
      release_request:
        description: Optional coordinator request identifier
        type: string
        default: ''
      signing_artifact_id:
        description: Optional immutable signed artifact ID; provide with ZIP SHA256 and candidate commit
        type: string
        default: ''
      signing_artifact_sha256:
        description: SHA256 of the pinned signed artifact ZIP
        type: string
        default: ''
      candidate_commit:
        description: Optional full candidate source SHA that the existing release tag must identify
        type: string
        default: ''
      replace_draft_assets:
        description: Explicit manual replacement of conflicting draft assets; unavailable with pinned inputs
        type: boolean
        default: false
      expected_version:
        description: Exact signed AppImage version, for example 0.2.0 or 0.2.0-dev
        required: true
        type: string
      signing_run_id:
        description: Successful holder-framework signing workflow run ID
        required: true
        type: string
      release_tag:
        description: Optional exact release tag; blank uses holder-v<expected_version>
        required: false
        default: ""
        type: string
      allow_published_prerelease:
        description: Allow adding assets to an existing published prerelease for the exact version
        required: false
        default: false
        type: boolean

run-name: ${{ inputs.release_request || format('Promote Linux AppImage {0} to release', inputs.expected_version) }}

permissions:
  actions: read
  contents: read

concurrency:
  group: holder-draft-release-promotion
  cancel-in-progress: false

jobs:
  verify_candidate:
    name: Verify signed candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Check out release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate promotion inputs
        id: release
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          SIGNING_RUN_ID: ${{ inputs.signing_run_id }}
          ARTIFACT_ID: ${{ inputs.signing_artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.signing_artifact_sha256 }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          REPLACE_DRAFT_ASSETS: ${{ inputs.replace_draft_assets }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os, re
          identifier, checksum, candidate = (os.environ[name] for name in ('ARTIFACT_ID', 'ARTIFACT_SHA256', 'CANDIDATE_COMMIT'))
          assert bool(identifier) == bool(checksum), 'Provide both signed artifact ID and ZIP SHA256'
          assert not candidate or re.fullmatch(r'[0-9a-f]{40}', candidate), 'Candidate commit must be a full SHA'
          if identifier:
              assert identifier.isdecimal() and re.fullmatch(r'[0-9a-f]{64}', checksum) and candidate, 'Pinned promotion needs artifact ID, ZIP SHA256 and candidate SHA'
              assert os.environ['REPLACE_DRAFT_ASSETS'] != 'true', 'Pinned promotion cannot replace draft assets'
          PY

          semver_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "${EXPECTED_VERSION}" =~ ${semver_pattern} ]]; then
            echo "Expected version is not semantic versioning: ${EXPECTED_VERSION}" >&2
            exit 1
          fi
          if ! [[ "${SIGNING_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "Signing run ID must be numeric: ${SIGNING_RUN_ID}" >&2
            exit 1
          fi

          release_tag="${RELEASE_TAG_INPUT:-holder-v${EXPECTED_VERSION}}"
          case "${release_tag}" in
            "holder-v${EXPECTED_VERSION}" | "v${EXPECTED_VERSION}" | "${EXPECTED_VERSION}") ;;
            *)
              echo "Release tag ${release_tag} does not identify exact version ${EXPECTED_VERSION}." >&2
              exit 1
              ;;
          esac

          {
            echo "artifact_name=Holder-linux-appimage-signed-${EXPECTED_VERSION}"
            echo "release_tag=${release_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download exact signed AppImage artifact
        if: inputs.signing_artifact_id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: downloads/linux-signed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.signing_run_id }}

      - name: Download the pinned signed artifact
        if: inputs.signing_artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_RUN_ID: ${{ inputs.signing_run_id }}
          ARTIFACT_ID: ${{ inputs.signing_artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.signing_artifact_sha256 }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 release/scripts/linux-candidate.py --signed --repository "$GITHUB_REPOSITORY" \
            --run-id "$SIGNING_RUN_ID" --artifact-id "$ARTIFACT_ID" --archive-sha256 "$ARTIFACT_SHA256" \
            --version "$EXPECTED_VERSION" --candidate "$CANDIDATE_COMMIT" --output downloads/linux-signed

      - name: Install verification dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gnupg jq

      - name: Verify signed candidate and provenance
        run: |
          set -euo pipefail

          candidate_dir="downloads/linux-signed"
          appimage="${candidate_dir}/Holder-${EXPECTED_VERSION}-x86_64.AppImage"
          metadata="${candidate_dir}/Holder-${EXPECTED_VERSION}-signing-metadata.json"
          chmod 0755 "${appimage}"

          release/scripts/linux/verify-signed-appimage.sh \
            "${candidate_dir}" \
            "${EXPECTED_VERSION}" \
            release/keys/holder-linux-release.asc

          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_id "${SIGNING_RUN_ID}" \
            '.signing_workflow.repository == $repository and
             .signing_workflow.run_id == $run_id' \
            "${metadata}" >/dev/null

          GH_TOKEN="${GITHUB_TOKEN}" gh attestation verify \
            "${appimage}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/sign-linux-appimage.yml"
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          GITHUB_TOKEN: ${{ github.token }}
          SIGNING_RUN_ID: ${{ inputs.signing_run_id }}

  promote:
    name: Add assets to exact release
    needs: verify_candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified signed artifact again
        if: inputs.signing_artifact_id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify_candidate.outputs.artifact_name }}
          path: downloads/linux-signed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.signing_run_id }}

      - name: Download the same pinned signed bytes
        if: inputs.signing_artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_RUN_ID: ${{ inputs.signing_run_id }}
          ARTIFACT_ID: ${{ inputs.signing_artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.signing_artifact_sha256 }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 release/scripts/linux-candidate.py --signed --repository "$GITHUB_REPOSITORY" \
            --run-id "$SIGNING_RUN_ID" --artifact-id "$ARTIFACT_ID" --archive-sha256 "$ARTIFACT_SHA256" \
            --version "$EXPECTED_VERSION" --candidate "$CANDIDATE_COMMIT" --output downloads/linux-signed

      - name: Install release dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gnupg jq

      - name: Re-verify payload without executing it
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          SIGNING_RUN_ID: ${{ inputs.signing_run_id }}
        run: |
          set -euo pipefail

          candidate_dir="downloads/linux-signed"
          appimage_name="Holder-${EXPECTED_VERSION}-x86_64.AppImage"
          checksums_name="Holder-${EXPECTED_VERSION}-SHA256SUMS"
          public_key_name="Holder-linux-release-key.asc"
          metadata="${candidate_dir}/Holder-${EXPECTED_VERSION}-signing-metadata.json"

          if ! cmp -s \
            release/keys/holder-linux-release.asc \
            "${candidate_dir}/${public_key_name}"; then
            echo "Candidate public key differs from holder-framework policy." >&2
            exit 1
          fi

          mapfile -t checksum_entries < <(
            awk '{print $2}' "${candidate_dir}/${checksums_name}"
          )
          if [ "${#checksum_entries[@]}" -ne 1 ] ||
             [ "${checksum_entries[0]}" != "${appimage_name}" ]; then
            echo "Release checksum manifest must contain exactly ${appimage_name}." >&2
            exit 1
          fi

          verification_home="$(mktemp -d)"
          cleanup() {
            GNUPGHOME="${verification_home}" gpgconf --kill gpg-agent >/dev/null 2>&1 || true
            rm -rf "${verification_home}"
          }
          trap cleanup EXIT
          chmod 0700 "${verification_home}"
          export GNUPGHOME="${verification_home}"
          gpg --batch --quiet --import release/keys/holder-linux-release.asc
          gpg --batch --verify \
            "${candidate_dir}/${checksums_name}.asc" \
            "${candidate_dir}/${checksums_name}"
          (
            cd "${candidate_dir}"
            sha256sum -c "${checksums_name}"
          )

          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_id "${SIGNING_RUN_ID}" \
            '.signing_workflow.repository == $repository and
             .signing_workflow.run_id == $run_id' \
            "${metadata}" >/dev/null

      - name: Prepare minimal Linux release payload
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail

          candidate_dir="downloads/linux-signed"
          payload_dir="out/linux-release-payload"
          install -d "${payload_dir}"

          for filename in \
            "Holder-${EXPECTED_VERSION}-x86_64.AppImage" \
            "Holder-${EXPECTED_VERSION}-SHA256SUMS" \
            "Holder-${EXPECTED_VERSION}-SHA256SUMS.asc" \
            "Holder-linux-release-key.asc"; do
            cp "${candidate_dir}/${filename}" "${payload_dir}/${filename}"
          done
          chmod 0755 "${payload_dir}/Holder-${EXPECTED_VERSION}-x86_64.AppImage"

          find "${payload_dir}" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Promote missing Linux assets and verify the exact release
        id: draft
        env:
          ALLOW_PUBLISHED_PRERELEASE: ${{ inputs.allow_published_prerelease }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify_candidate.outputs.release_tag }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          REPLACE_DRAFT_ASSETS: ${{ inputs.replace_draft_assets }}
          SIGNING_RUN_ID: ${{ inputs.signing_run_id }}
          ARTIFACT_ID: ${{ inputs.signing_artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.signing_artifact_sha256 }}
        run: |
          set -euo pipefail
          options=()
          if [ -n "$CANDIDATE_COMMIT" ]; then options+=(--candidate "$CANDIDATE_COMMIT"); fi
          if [ "$ALLOW_PUBLISHED_PRERELEASE" = true ]; then options+=(--allow-published-prerelease); fi
          if [ "$REPLACE_DRAFT_ASSETS" = true ]; then options+=(--replace-draft-assets); fi
          python3 release/scripts/promote-linux.py --repository "$RELEASE_REPOSITORY" \
            --tag "$RELEASE_TAG" --version "$EXPECTED_VERSION" --directory out/linux-release-payload \
            --receipt out/linux-promotion.json "${options[@]}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('out/linux-promotion.json')
          result = json.loads(path.read_text())
          result['source'] = {'signing_run_id': os.environ['SIGNING_RUN_ID'],
              'artifact_id': os.environ['ARTIFACT_ID'], 'archive_sha256': os.environ['ARTIFACT_SHA256']}
          result['promotion_workflow'] = {'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'commit': os.environ['GITHUB_SHA']}
          path.write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('release_url=' + result['release']['url'] + '\n')
          PY

      - name: Retain the promotion receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-promotion
          path: out/linux-promotion.json
          if-no-files-found: error
          overwrite: true

      - name: Summarize promotion
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          RELEASE_TAG: ${{ needs.verify_candidate.outputs.release_tag }}
          RELEASE_URL: ${{ steps.draft.outputs.release_url }}
          SIGNING_RUN_ID: ${{ inputs.signing_run_id }}
        run: |
          set -euo pipefail

          {
            echo "## Linux AppImage added to release"
            echo
            echo "- Version: \`${EXPECTED_VERSION}\`"
            echo "- Release: [${RELEASE_TAG}](${RELEASE_URL})"
            echo "- Signed candidate run: [${GITHUB_REPOSITORY}#${SIGNING_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SIGNING_RUN_ID})"
            echo "- Existing title and description: preserved"
          } >> "${GITHUB_STEP_SUMMARY}"
