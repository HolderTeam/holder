name: Release / Promote Windows dev build

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful Windows staging run containing tester installer evidence
        required: true
        type: string
      staging_repository:
        description: Repository containing the Windows staging artifact
        required: true
        type: string
        default: HolderTeam/holder
      staging_artifact_name:
        description: Windows tester installer artifact name
        required: true
        type: string
        default: Holder-windows-test-signed-installer
      release_tag:
        description: Existing product tag, or empty for holder-windows-dev-<staging_run_id>
        type: string
      release_request:
        description: Coordinator request identity (leave empty for manual delivery)
        type: string
      staging_artifact_id:
        description: Exact accepted staging artifact ID
        type: string
      staging_artifact_sha256:
        description: Exact accepted artifact archive SHA-256
        type: string
      expected_version:
        description: Accepted product version
        type: string
      candidate_commit:
        description: Exact accepted candidate source SHA (requires product draft and artifact pins)
        type: string
      replace_draft_assets:
        description: Explicit manual recovery only; replace conflicting assets in a draft
        type: boolean
        default: false

run-name: Promote Windows dev build from staging run ${{ inputs.staging_run_id }} ${{ inputs.release_request }}

permissions:
  actions: read
  contents: write

concurrency:
  group: holder-draft-release-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and download the accepted tester installer
        env:
          GH_TOKEN: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          STAGING_REPOSITORY: ${{ inputs.staging_repository }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          ARTIFACT_NAME: ${{ inputs.staging_artifact_name }}
          ARTIFACT_ID: ${{ inputs.staging_artifact_id }}
          ARCHIVE_SHA256: ${{ inputs.staging_artifact_sha256 }}
          VERSION: ${{ inputs.expected_version }}
          CANDIDATE: ${{ inputs.candidate_commit }}
        run: |
          set -euo pipefail
          args=(fetch --repository "$STAGING_REPOSITORY" --run-id "$STAGING_RUN_ID"
            --artifact-name "$ARTIFACT_NAME" --directory out/windows-payload)
          if [ -n "$ARTIFACT_ID" ]; then args+=(--artifact-id "$ARTIFACT_ID"); fi
          if [ -n "$ARCHIVE_SHA256" ]; then args+=(--archive-sha256 "$ARCHIVE_SHA256"); fi
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ -n "$CANDIDATE" ]; then args+=(--candidate "$CANDIDATE"); fi
          python3 release/scripts/windows-candidate.py "${args[@]}"
      - name: Deliver missing Windows development assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          VERSION: ${{ inputs.expected_version }}
          CANDIDATE: ${{ inputs.candidate_commit }}
          REPLACE_DRAFT_ASSETS: ${{ inputs.replace_draft_assets }}
        run: |
          set -euo pipefail
          args=(--repository "$REPOSITORY" --run-id "$STAGING_RUN_ID"
            --directory out/windows-payload --receipt out/windows-delivery.json)
          if [ -n "$RELEASE_TAG" ]; then args+=(--tag "$RELEASE_TAG"); fi
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ -n "$CANDIDATE" ]; then args+=(--candidate "$CANDIDATE"); fi
          if [ "$REPLACE_DRAFT_ASSETS" = true ]; then args+=(--replace-draft-assets); fi
          python3 release/scripts/promote-windows.py "${args[@]}"
      - name: Retain Windows delivery receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-delivery-receipt
          path: out/windows-delivery.json
          if-no-files-found: error
          retention-days: 30
