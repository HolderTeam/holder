name: Repository / Checks

# Fast checks about the repository as a whole, on every pull request: version source/export tests,
# Python package metadata, and nothing outside contract/ uses
# the contract's tooling (.github/scripts/check-contract-boundary.py).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks result
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python build backends for distribution checks
        run: python3 -m pip install 'build>=1.2,<2' 'hatchling>=1.27' 'scikit-build-core>=0.11'
      - name: Test version derivation and source distributions
        run: python3 -m unittest discover -s release/tests -v
      - name: Test release manifest generation and staging contracts
        run: python3 -m unittest discover -s release/staging/tests -v
      - name: Check dynamic Python metadata and root VERSION
        run: python3 release/scripts/version.py --check
      - name: Check that only contract/ uses the contract's tooling
        run: python3 .github/scripts/check-contract-boundary.py
