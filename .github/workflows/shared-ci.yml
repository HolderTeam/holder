# Generated by .github/scripts/generate-shared-ci.py; edit its source workflows, then regenerate.
name: Shared / CI
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
    - unlabeled
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: shared-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core-changes:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    outputs:
      core: ${{ steps.select.outputs.core }}
    steps:
    - if: github.event_name == 'pull_request' || github.event_name == 'push'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: select
      name: Select jobs from the changed paths
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
      run: |
        if [[ "$EVENT" != pull_request && "$EVENT" != push ]]; then
          echo "core=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The pull request merge commit's parents are the base and the pull request head.
        if [[ "$EVENT" == pull_request ]]; then
          changed=$(git diff --name-only HEAD^1...HEAD^2)
        elif [[ "$BEFORE" =~ ^0+$ || -z "$BEFORE" ]]; then
          changed=$(git ls-files)
        else
          changed=$(git diff --name-only "$BEFORE" HEAD)
        fi
        # Changes to the orchestration graph exercise all its consumers.
        if grep -qE '^.github/(workflows/(shared-ci|core-ci|daemon-ci|kit-ci|python-check|core-sdk|core-sanitizers)\.yml$|scripts/(generate-shared-ci\.py|tests/test_shared_ci\.py)$)' <<< "$changed"; then
          changed+=$'\nVERSION'
        fi
        printf '%s\n' "$changed"
        if grep -qE '^(VERSION$|core/|contract/|\.github/workflows/core-(ci|sdk)\.yml$|\.github/actions/core-sdk/)' <<< "$changed"; then
          echo "core=true" >> "$GITHUB_OUTPUT"
        else
          echo "core=false" >> "$GITHUB_OUTPUT"
        fi
  core-format:
    needs:
    - core-changes
    if: needs.core-changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: Check out holder
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install clang-format-18
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends clang-format-18
    - name: Check formatting
      run: ./make.sh format-check
    defaults:
      run:
        working-directory: core
  core-linux:
    permissions:
      actions: write
      contents: read
    needs:
    - core-changes
    - sdk-linux
    if: needs.core-changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: Check out holder
      uses: actions/checkout@v7
    - name: Restore apt package cache
      uses: actions/cache/restore@v6
      with:
        path: core/.apt-cache/debs
        key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/core-ci.yml') }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        restore-keys: |
          apt-${{ runner.os }}-${{ hashFiles('.github/workflows/core-ci.yml') }}-
          apt-${{ runner.os }}-
    - name: Install dependencies
      run: |
        mkdir -p "${PWD}/.apt-cache/archives/partial" "${PWD}/.apt-cache/debs"
        cp "${PWD}"/.apt-cache/debs/*.deb "${PWD}/.apt-cache/archives/" 2>/dev/null || true
        sudo apt-get update
        sudo apt-get \
          -o Dir::Cache::Archives="${PWD}/.apt-cache/archives" \
          install -y \
          cmake \
          catch2 \
          ninja-build \
          pkg-config \
          libssl-dev \
          nlohmann-json3-dev \
          libyaml-cpp-dev \
          libspdlog-dev \
          libsqlite3-dev \
          libsodium-dev \
          libgit2-dev \
          libmd4c-dev \
          libsecret-1-dev
        find "${PWD}/.apt-cache/archives" -maxdepth 1 -type f -name '*.deb' -exec cp {} "${PWD}/.apt-cache/debs/" \;
    - name: Save apt package cache
      if: success() && github.event_name != 'pull_request'
      uses: actions/cache/save@v6
      with:
        path: core/.apt-cache/debs
        key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/core-ci.yml') }}-${{ github.run_id }}-${{ github.run_attempt
          }}
    - name: Restore core compiler cache
      id: compiler-cache
      uses: ./.github/actions/core-sdk/ccache
      with:
        variant: tests
        build-type: RelWithDebInfo
        measure: ${{ false && 'true' || 'false' }}
    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHOLDER_CORE_BUILD_SHARED=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    - name: Build
      run: cmake --build build --parallel
    - name: Run tests
      run: ctest --test-dir build --output-on-failure
    - name: Stage the shared library for conformance tests
      run: |
        mkdir -p out/conformance
        cp -L build/libholder.so out/conformance/libholder.so
    - name: Upload the shared library for conformance tests
      uses: actions/upload-artifact@v7
      with:
        name: core-conformance-linux
        path: core/out/conformance/libholder.so
        if-no-files-found: error
        retention-days: 7
    - name: Install
      run: cmake --install build --prefix out/install/linux
    - name: Verify installed package
      run: |
        cmake -S tests/installed-consumer -B out/consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/core/out/install/linux"
        cmake --build out/consumer --parallel
        ctest --test-dir out/consumer --output-on-failure
        cmake -S tests/installed-consumer -B out/consumer-shared -DCMAKE_PREFIX_PATH="${{ github.workspace }}/core/out/install/linux" -DHOLDER_CONSUMER_SHARED=ON
        cmake --build out/consumer-shared --parallel
        ctest --test-dir out/consumer-shared --output-on-failure
    - name: Test the SDK tooling
      run: python3 -m unittest discover -s tests -p "test_*.py" -v
    - name: Save core compiler cache
      uses: ./.github/actions/core-sdk/ccache-save
      with:
        key: ${{ steps.compiler-cache.outputs.key }}
        prefix: ${{ steps.compiler-cache.outputs.prefix }}
        measure: ${{ false && 'true' || 'false' }}
    defaults:
      run:
        working-directory: core
  core-conformance:
    needs:
    - core-linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contract
    steps:
    - name: Check out holder
      uses: actions/checkout@v7
    - name: Install shared library dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libssl-dev libyaml-cpp-dev libspdlog-dev libsqlite3-dev \
          libsodium-dev libgit2-dev libmd4c-dev libsecret-1-dev
    - name: Download the Linux shared library
      uses: actions/download-artifact@v8
      with:
        name: core-conformance-linux
        path: core/out/conformance
    - name: Verify the shared library
      run: |
        test -s ../core/out/conformance/libholder.so
        ldd ../core/out/conformance/libholder.so
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Run the contract's conformance tests
      env:
        HOLDER_LIBRARY: ${{ github.workspace }}/core/out/conformance/libholder.so
        HOLDER_CONFORMANCE_EXAMPLES: '100'
      run: |
        python -m pip install -r requirements.txt
        status=0
        python -m pytest tests/conformance -p no:cacheprovider --junitxml="$RUNNER_TEMP/contract-conformance.xml" || status=$?
        python -m test_support.coverage_report --junit "$RUNNER_TEMP/contract-conformance.xml" \
          --link-prefix "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/" >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
  core-coverage:
    permissions:
      actions: write
      contents: read
    needs:
    - core-changes
    - sdk-linux
    if: needs.core-changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: Check out holder
      uses: actions/checkout@v7
    - name: Install coverage build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake catch2 ninja-build pkg-config libssl-dev nlohmann-json3-dev \
          libyaml-cpp-dev libspdlog-dev libsqlite3-dev libsodium-dev \
          libgit2-dev libmd4c-dev libsecret-1-dev lcov gcovr
    - name: Restore coverage compiler cache
      id: compiler-cache
      uses: ./.github/actions/core-sdk/ccache
      with:
        variant: coverage
        build-type: Debug
    - name: Build, test, and report coverage
      run: ./make.sh coverage
    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: holder-core-coverage
        path: core/build-coverage/coverage/**
        if-no-files-found: error
        retention-days: 7
    - name: Save coverage compiler cache
      uses: ./.github/actions/core-sdk/ccache-save
      with:
        key: ${{ steps.compiler-cache.outputs.key }}
        prefix: ${{ steps.compiler-cache.outputs.prefix }}
    defaults:
      run:
        working-directory: core
  core-macos:
    permissions:
      actions: write
      contents: read
    needs:
    - core-changes
    - sdk-linux
    if: needs.core-changes.outputs.core == 'true'
    runs-on: macos-15
    steps:
    - name: Check out holder
      uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        brew update
        # The runner can have a manually linked OpenSSL 1.1 binary that brew unlink misses.
        brew_prefix="$(brew --prefix)"
        openssl_bin="$brew_prefix/bin/openssl"
        if [[ -L "$openssl_bin" && "$(readlink "$openssl_bin")" == "$brew_prefix/opt/openssl@1.1/bin/openssl" ]]; then
          unlink "$openssl_bin"
        fi
        brew install \
          cmake \
          catch2 \
          ninja \
          pkg-config \
          nlohmann-json \
          yaml-cpp \
          spdlog \
          sqlite \
          libsodium \
          libgit2 \
          md4c \
          openssl@3
    - name: Restore core compiler cache
      id: compiler-cache
      uses: ./.github/actions/core-sdk/ccache
      with:
        variant: tests
        build-type: RelWithDebInfo
        measure: ${{ false && 'true' || 'false' }}
    - name: Configure
      run: |
        brew_prefix="$(brew --prefix)"
        openssl_prefix="$(brew --prefix openssl@3)"

        cmake \
          -S . \
          -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_PREFIX_PATH="${brew_prefix};${openssl_prefix}" \
          -DOPENSSL_ROOT_DIR="${openssl_prefix}" \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    - name: Build
      run: cmake --build build --parallel
    - name: Run tests
      run: ctest --test-dir build --output-on-failure
    - name: Install
      run: cmake --install build --prefix out/install/macos
    - name: Verify installed package
      run: |
        cmake -S tests/installed-consumer -B out/consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/core/out/install/macos;$(brew --prefix);$(brew --prefix openssl@3)"
        cmake --build out/consumer --parallel
        ctest --test-dir out/consumer --output-on-failure
    - name: Save core compiler cache
      uses: ./.github/actions/core-sdk/ccache-save
      with:
        key: ${{ steps.compiler-cache.outputs.key }}
        prefix: ${{ steps.compiler-cache.outputs.prefix }}
        measure: ${{ false && 'true' || 'false' }}
    defaults:
      run:
        working-directory: core
  core-windows:
    needs:
    - core-changes
    - sdk-linux
    if: needs.core-changes.outputs.core == 'true'
    permissions:
      actions: write
      contents: read
    runs-on: windows-latest
    steps:
    - name: Check out holder
      uses: actions/checkout@v7
    - name: Set up MSVC developer environment
      uses: ilammy/msvc-dev-cmd@v1
    - name: Set vcpkg paths
      shell: pwsh
      run: |
        "VCPKG_ROOT=${{ github.workspace }}\.vcpkg" >> $env:GITHUB_ENV
        "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}\.vcpkg-binary-cache" >> $env:GITHUB_ENV
    - name: Restore vcpkg binary package cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{ runner.os }}-${{ hashFiles('core/vcpkg.json', 'core/CMakePresets.json') }}-${{ github.run_id
          }}-${{ github.run_attempt }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ hashFiles('core/vcpkg.json', 'core/CMakePresets.json') }}-
          vcpkg-${{ runner.os }}-
    - name: Bootstrap vcpkg
      shell: pwsh
      run: |
        git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
        New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
    - name: Restore core compiler cache
      id: compiler-cache
      uses: ./.github/actions/core-sdk/ccache
      with:
        variant: tests
        build-type: Debug
        measure: ${{ false && 'true' || 'false' }}
    - name: Configure
      run: cmake --preset windows-vcpkg-debug -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
        -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
    - name: Build
      run: cmake --build out/build/windows-vcpkg-debug --parallel
    - name: Run tests
      run: ctest --test-dir out/build/windows-vcpkg-debug --output-on-failure
    - name: Save vcpkg binary package cache
      if: success() && github.event_name != 'pull_request'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{ runner.os }}-${{ hashFiles('core/vcpkg.json', 'core/CMakePresets.json') }}-${{ github.run_id
          }}-${{ github.run_attempt }}
    - name: Remove older vcpkg binary package caches
      if: success() && github.event_name != 'pull_request'
      shell: bash
      working-directory: .
      env:
        GH_TOKEN: ${{ github.token }}
      run: .github/scripts/prune-run-caches.sh "vcpkg-${{ runner.os }}-${{ hashFiles('core/vcpkg.json', 'core/CMakePresets.json')
        }}-"
    - name: Install
      run: cmake --install out/build/windows-vcpkg-debug --prefix out/install/windows
    - name: Verify installed package
      shell: pwsh
      run: |
        cmake -S tests/installed-consumer -B out/consumer -G Ninja -DCMAKE_BUILD_TYPE=Debug `
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          "-DVCPKG_INSTALLED_DIR=${{ github.workspace }}/.vcpkg-holder-core" `
          -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_MANIFEST_MODE=OFF `
          "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/core/out/install/windows"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build out/consumer --parallel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ctest --test-dir out/consumer --output-on-failure
    - name: Save core compiler cache
      uses: ./.github/actions/core-sdk/ccache-save
      with:
        key: ${{ steps.compiler-cache.outputs.key }}
        prefix: ${{ steps.compiler-cache.outputs.prefix }}
        measure: ${{ false && 'true' || 'false' }}
    defaults:
      run:
        working-directory: core
  core-ubuntu-packages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
    - core-changes
    - sdk-linux
    strategy:
      fail-fast: false
      matrix:
        include:
        - image: ubuntu:24.04
          series: noble
        - image: ubuntu:26.04
          series: resolute
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
    - name: Install packaging tools
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git devscripts equivs debhelper cmake ninja-build
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: ./.github/actions/core-ubuntu-packages
      with:
        series: ${{ matrix.series }}
    - uses: actions/upload-artifact@v7
      with:
        name: core-debs-${{ matrix.series }}
        path: out/core-debs/*
        if-no-files-found: error
        retention-days: 7
  core-publish-sdk:
    needs:
    - core-linux
    - core-conformance
    - core-coverage
    - core-macos
    - core-windows
    - core-ubuntu-packages
    - core-sdk-ready
    - core-sanitizers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: holder-sdk-publish
    concurrency:
      group: holder-sdk-publish
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - id: tree
      name: Identify core/'s tree
      run: echo "tree=$(git rev-parse HEAD:core)" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@v8
      with:
        pattern: core-sdk-*-RelWithDebInfo
        path: out/core-sdk-assets
        merge-multiple: true
    - uses: actions/download-artifact@v8
      with:
        name: core-selection
        path: out
    - uses: actions/download-artifact@v8
      with:
        pattern: core-debs-*
        path: out/core-debs
        merge-multiple: true
    - id: token
      name: Get a token for holder-sdk
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.HOLDER_SDK_APP_CLIENT_ID }}
        private-key: ${{ secrets.HOLDER_SDK_APP_PRIVATE_KEY }}
        owner: HolderTeam
        repositories: holder-sdk
        permission-contents: write
    - name: Publish core-<tree>-<version>
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SDK_PACKAGES: out/core-debs
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: .github/scripts/publish-core-sdk.sh out/core-sdk-assets out/core-selection.json "${{ steps.tree.outputs.tree
        }}"
    - name: Keep the newest 32 core-<tree>-<version> releases
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
      run: .github/scripts/prune-sdk-releases.sh core- 32
  core-result:
    name: Core CI result
    if: always()
    needs:
    - core-changes
    - core-format
    - core-linux
    - core-conformance
    - core-coverage
    - core-macos
    - core-windows
    - core-sdk-ready
    - core-sanitizers
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
    - name: Check job results
      env:
        SELECTED: ${{ needs.core-changes.outputs.core }}
        RESULTS: ${{ toJSON(needs) }}
      run: |
        RESULTS=$(jq 'with_entries(.key = ({"core-changes": "changes", "core-conformance": "conformance", "core-coverage": "coverage", "core-format": "format", "core-linux": "linux", "core-macos": "macos", "core-sdk-ready": "sdk", "core-windows": "windows"}[.key] // .key))' <<< "$RESULTS")
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
        jq -e --arg selected "$SELECTED" '
          .changes.result == "success" and
          (if $selected == "true" then
             ([.format, .linux, .conformance, .["core-sanitizers"], .coverage, .macos, .windows, .sdk] | all(.result == "success"))
           else
             ([.format, .linux, .conformance, .["core-sanitizers"], .coverage, .macos, .windows, .sdk] | all(.result == "skipped"))
           end)' <<< "$RESULTS" > /dev/null
  daemon-changes:
    runs-on: ubuntu-24.04
    outputs:
      daemon: ${{ steps.select.outputs.daemon }}
    env:
      SCOPED: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
      EVENT: ${{ github.event_name }}
      BEFORE: ${{ github.event.before }}
    steps:
    - if: env.SCOPED == 'true'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: select
      name: Select jobs from the changed paths
      run: |
        if [[ "$SCOPED" != true ]]; then
          echo "daemon=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The pull request merge commit's parents are the base and the pull request head.
        if [[ "$EVENT" == pull_request ]]; then
          changed=$(git diff --name-only HEAD^1...HEAD^2)
        elif [[ "$BEFORE" =~ ^0+$ || -z "$BEFORE" ]]; then
          changed=$(git ls-files)
        else
          changed=$(git diff --name-only "$BEFORE" HEAD)
        fi
        # Changes to the orchestration graph exercise all its consumers.
        if grep -qE '^.github/(workflows/(shared-ci|core-ci|daemon-ci|kit-ci|python-check|core-sdk|core-sanitizers)\.yml$|scripts/(generate-shared-ci\.py|tests/test_shared_ci\.py)$)' <<< "$changed"; then
          changed+=$'\nVERSION'
        fi
        printf '%s\n' "$changed"
        # The daemon uses core's C++ classes, never its C API (apart from capi/Context.h, which
        # its contract routes run in), and core's tests run in Core / CI, so changes only to those
        # don't select the daemon jobs. The contract's conformance tests run here over HTTP.
        # These exclusions also apply in the generated automatic graph.
        changed=$(grep -vE '^core/(include/holder/holder\.h$|src/capi/(holder|version)\.cpp$|tests/)' <<< "$changed" || true)
        if grep -qE '^(daemon/|cli/|common/|api/|core/|contract/|VERSION$|\.gitmodules$|\.github/workflows/daemon-|\.github/workflows/core-sdk\.yml$|\.github/actions/core-ubuntu-packages/|\.github/scripts/fetch-core-debs\.sh$|\.github/actions/core-sdk/|\.github/actions/linux-daemon-|\.github/scripts/(linux-daemon-cache-key|ubuntu-daemon-package-key|fetch-daemon-debs|publish-daemon-debs)\.sh$|\.github/scripts/tests/test_ubuntu_daemon_packages\.py$|\.github/scripts/check-core-boundary\.py$)' <<< "$changed"; then
          echo "daemon=true" >> "$GITHUB_OUTPUT"
        else
          echo "daemon=false" >> "$GITHUB_OUTPUT"
        fi
  daemon-resolve:
    needs:
    - daemon-changes
    if: needs.daemon-changes.outputs.daemon == 'true'
    runs-on: ubuntu-24.04
    outputs:
      daemon_commit: ${{ steps.source.outputs.commit }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Validate SDK configuration
      env:
        BUILD_TYPE: ${{ 'RelWithDebInfo' || 'RelWithDebInfo' }}
      run: |
        case "$BUILD_TYPE" in
          RelWithDebInfo|Release) ;;
          *) echo "Unsupported SDK configuration: $BUILD_TYPE" >&2; exit 1 ;;
        esac
    - id: source
      name: Record daemon source revision
      run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  daemon-checks:
    needs:
    - daemon-changes
    if: needs.daemon-changes.outputs.daemon == 'true'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Check the core boundary
      run: python3 .github/scripts/check-core-boundary.py
    - name: Test make.sh's core selection
      working-directory: daemon
      run: python3 -m unittest scripts/test_make.py -v
    - name: Install clang-format-18
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends clang-format-18
    - name: Check formatting
      working-directory: daemon
      run: ./make.sh format-check
  daemon-linux:
    needs:
    - daemon-resolve
    - sdk-linux
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/daemon-linux-backend.yml
    with:
      core_commit: ${{ github.sha }}
      daemon_commit: ${{ needs.daemon-resolve.outputs.daemon_commit }}
      build_type: ${{ 'RelWithDebInfo' || 'RelWithDebInfo' }}
  daemon-macos:
    needs:
    - daemon-resolve
    - sdk-macos
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/daemon-macos-backend.yml
    with:
      core_commit: ${{ github.sha }}
      daemon_commit: ${{ needs.daemon-resolve.outputs.daemon_commit }}
      build_type: ${{ 'RelWithDebInfo' || 'RelWithDebInfo' }}
  daemon-windows:
    needs:
    - daemon-resolve
    - sdk-windows
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/daemon-windows-backend.yml
    with:
      core_commit: ${{ github.sha }}
      daemon_commit: ${{ needs.daemon-resolve.outputs.daemon_commit }}
      build_type: ${{ 'RelWithDebInfo' || 'RelWithDebInfo' }}
  daemon-publish-linux-daemon:
    needs:
    - daemon-linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: holder-sdk-publish
    concurrency:
      group: holder-sdk-publish
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - id: key
      name: Compute the daemon build's key
      run: echo "key=$(.github/scripts/linux-daemon-cache-key.sh RelWithDebInfo)" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@v8
      with:
        name: holder-daemon-linux-x86_64
        path: out/linux-daemon
    - id: token
      name: Get a token for holder-sdk
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.HOLDER_SDK_APP_CLIENT_ID }}
        private-key: ${{ secrets.HOLDER_SDK_APP_PRIVATE_KEY }}
        owner: HolderTeam
        repositories: holder-sdk
        permission-contents: write
    - name: Publish the Linux daemon
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: .github/scripts/publish-daemon-build.sh out/linux-daemon "${{ steps.key.outputs.key }}"
    - name: Keep the newest 64 daemon releases
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
      run: .github/scripts/prune-sdk-releases.sh daemon- 64
  daemon-publish-ubuntu-packages:
    needs:
    - daemon-ubuntu-packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && 'source' != 'ppa'
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1
      matrix:
        series:
        - noble
        - resolute
    environment: holder-sdk-publish
    concurrency:
      group: holder-sdk-publish
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - id: key
      env:
        SERIES: ${{ matrix.series }}
      run: echo "key=$(.github/scripts/ubuntu-daemon-package-key.sh "$SERIES")-source" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@v8
      with:
        name: holder-daemon-${{ matrix.series }}-packages
        path: out/daemon-debs
    - id: token
      name: Get a token for holder-sdk
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.HOLDER_SDK_APP_CLIENT_ID }}
        private-key: ${{ secrets.HOLDER_SDK_APP_PRIVATE_KEY }}
        owner: HolderTeam
        repositories: holder-sdk
        permission-contents: write
    - name: Publish tested Ubuntu packages
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: .github/scripts/publish-daemon-debs.sh out/daemon-debs "${{ steps.key.outputs.key }}"
    - name: Keep the newest 64 daemon releases
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
      run: .github/scripts/prune-sdk-releases.sh ubuntu-daemon-debs- 64
  daemon-ubuntu-packages:
    if: github.repository == 'HolderTeam/holder' && 'RelWithDebInfo' != 'Release' && !contains(github.event.pull_request.labels.*.name,
      'ci:skip-launchpad-packages')
    needs:
    - daemon-resolve
    - sdk-linux
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(github.event_name == 'pull_request' && '["resolute"]' || '["noble","resolute"]') }}
    uses: ./.github/workflows/daemon-ubuntu-packages.yml
    with:
      series: ${{ matrix.series }}
      core_packages: ${{ 'source' || 'source' }}
  daemon-result:
    name: Daemon CI result
    if: always()
    needs:
    - daemon-changes
    - daemon-checks
    - daemon-resolve
    - daemon-linux
    - daemon-macos
    - daemon-windows
    - daemon-ubuntu-packages
    - daemon-sdk-ready
    runs-on: ubuntu-24.04
    steps:
    - name: Check job results
      env:
        SELECTED: ${{ needs.daemon-changes.outputs.daemon }}
        RESULTS: ${{ toJSON(needs) }}
        SKIP_LAUNCHPAD: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name,
          'ci:skip-launchpad-packages') }}
      run: |
        RESULTS=$(jq 'with_entries(.key = ({"daemon-changes": "changes", "daemon-checks": "checks", "daemon-linux": "linux", "daemon-macos": "macos", "daemon-resolve": "resolve", "daemon-sdk-ready": "core-sdk", "daemon-ubuntu-packages": "ubuntu-packages", "daemon-windows": "windows"}[.key] // .key))' <<< "$RESULTS")
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
        if [[ "$SKIP_LAUNCHPAD" == true && "$SELECTED" == true ]]; then
          echo '::warning::Ubuntu package build skipped by ci:skip-launchpad-packages label'
          echo 'Ubuntu package build skipped by the `ci:skip-launchpad-packages` PR label.' >> "$GITHUB_STEP_SUMMARY"
        fi
        jq -e --arg selected "$SELECTED" --arg skip "$SKIP_LAUNCHPAD" '
          .changes.result == "success" and
          (if $selected == "true" then
             ([.checks, .resolve, .["core-sdk"], .linux, .macos, .windows] | all(.result == "success")) and
             (if $skip == "true" then
                .["ubuntu-packages"].result == "skipped"
              else
                (.["ubuntu-packages"].result | IN("success", "skipped"))
              end)
           else
             ([.checks, .resolve, .["core-sdk"], .linux, .macos, .windows, .["ubuntu-packages"]] | all(.result == "skipped"))
           end)' <<< "$RESULTS" > /dev/null
  kit-changes:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    outputs:
      kit: ${{ steps.select.outputs.kit }}
    steps:
    - if: github.event_name == 'pull_request' || github.event_name == 'push'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: select
      name: Select jobs from the changed paths
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
      run: |
        if [[ "$EVENT" != pull_request && "$EVENT" != push ]]; then
          echo "kit=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The pull request merge commit's parents are the base and the pull request head.
        if [[ "$EVENT" == pull_request ]]; then
          changed=$(git diff --name-only HEAD^1...HEAD^2)
        elif [[ "$BEFORE" =~ ^0+$ || -z "$BEFORE" ]]; then
          changed=$(git ls-files)
        else
          changed=$(git diff --name-only "$BEFORE" HEAD)
        fi
        # Changes to the orchestration graph exercise all its consumers.
        if grep -qE '^.github/(workflows/(shared-ci|core-ci|daemon-ci|kit-ci|python-check|core-sdk|core-sanitizers)\.yml$|scripts/(generate-shared-ci\.py|tests/test_shared_ci\.py)$)' <<< "$changed"; then
          changed+=$'\nVERSION'
        fi
        printf '%s\n' "$changed"
        if grep -qE '^(VERSION$|python/_build_support\.py$|python/kit/|python/holder/(_build_backend/|src/holder/_embedded/|scripts/test-installed-wheel\.py$)|core/|\.github/workflows/(kit-ci|core-sdk)\.yml$|\.github/actions/core-ubuntu-packages/|\.github/scripts/fetch-core-debs\.sh$|\.github/actions/core-sdk/|\.github/scripts/check-core-boundary\.py$)' <<< "$changed"; then
          echo "kit=true" >> "$GITHUB_OUTPUT"
        else
          echo "kit=false" >> "$GITHUB_OUTPUT"
        fi
  kit-checks:
    needs:
    - kit-changes
    if: needs.kit-changes.outputs.kit == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Check the core boundary
      run: python3 .github/scripts/check-core-boundary.py
  kit-linux:
    needs:
    - kit-changes
    - sdk-linux
    if: needs.kit-changes.outputs.kit == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          name: Ubuntu 24.04 / Python 3.12 / compatibility
          python-version: '3.12'
          comprehensive: true
          sanitized: false
        - runner: ubuntu-24.04
          name: Ubuntu 24.04 / Python 3.14 / shim sanitizers
          python-version: '3.14'
          comprehensive: false
          sanitized: true
    steps:
    - name: Check out holder
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install native build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          python3-dev \
          python3-venv \
          libssl-dev \
          nlohmann-json3-dev \
          libyaml-cpp-dev \
          libspdlog-dev \
          libsqlite3-dev \
          libsodium-dev \
          libgit2-dev \
          libmd4c-dev \
          libsecret-1-dev
    - name: Set up selected Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Fetch the core SDK from this run
      uses: ./.github/actions/core-sdk
      with:
        commit: ${{ github.sha }}
    - name: Configure Python build tools
      shell: bash
      run: |
        echo 'CMAKE_GENERATOR=Ninja' >> "$GITHUB_ENV"
        echo "SKBUILD_CMAKE_BUILD_TYPE=$HOLDER_CORE_BUILD_TYPE" >> "$GITHUB_ENV"
    - name: Create isolated CI environment
      run: |
        python3 -m venv "${RUNNER_TEMP}/holder-ci-venv"
        echo "${RUNNER_TEMP}/holder-ci-venv/bin" >> "${GITHUB_PATH}"
    - name: Install packaging tools
      run: python3 -m pip install --upgrade pip
    - name: Build and install Holder Kit with complete test dependencies
      if: ${{ matrix.comprehensive }}
      run: python3 -m pip install --verbose '.[test]'
    - name: Build instrumented Holder Kit for lifecycle smoke tests
      if: ${{ matrix.sanitized }}
      run: python3 -m pip install --verbose --config-settings=cmake.define.HOLDER_KIT_SANITIZE=address,undefined
        . 'pytest>=8'
    - name: Configure sanitizer runtime
      if: ${{ matrix.sanitized }}
      run: |
        asan_library="$(gcc -print-file-name=libasan.so)"
        if ! file -L "${asan_library}" | grep -q 'ELF'; then
          asan_library="$(ldconfig -p | awk '/libasan\.so/{print $NF; exit}')"
        fi
        test -f "${asan_library}"
        echo "LD_PRELOAD=${asan_library}" >> "${GITHUB_ENV}"
        echo "ASAN_OPTIONS=detect_leaks=0:halt_on_error=1" >> "${GITHUB_ENV}"
        echo "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1" >> "${GITHUB_ENV}"
    - name: Show installed build
      run: |
        python3 --version
        python3 -c 'import sys; print(sys.executable)'
        python3 -m pip show holder-kit
        python3 -c 'import holderkit; print(holderkit.__file__)'
    - name: Run instrumented Python lifecycle smoke tests
      if: ${{ matrix.sanitized }}
      run: |
        python3 -m pytest --verbose \
          tests/test_holder.py::test_native_extension_imports \
          tests/test_holder.py::test_complete_card_lifecycle \
          tests/test_holder.py::test_context_destruction_releases_native_resources
    - name: Run complete Python tests
      if: ${{ matrix.comprehensive }}
      run: python3 -m pytest --verbose
    - name: Run strict type checking
      if: ${{ matrix.comprehensive }}
      run: python3 -m mypy
    - name: Run lifecycle example
      run: python3 examples/card_lifecycle.py
    - name: Run detached-record and pandas examples
      if: ${{ matrix.comprehensive }}
      run: |
        python3 examples/detached_records.py
        python3 examples/pandas_analysis.py
    - name: Build wheel
      if: ${{ matrix.comprehensive }}
      run: |
        python3 -m pip install build
        python3 -m build --wheel --outdir dist
        ls -lh dist
    - name: Install wheel in a fresh base environment
      if: ${{ matrix.comprehensive }}
      run: |
        python3 -m venv "${RUNNER_TEMP}/holder-wheel-venv"
        "${RUNNER_TEMP}/holder-wheel-venv/bin/python" -m pip install --upgrade pip
        "${RUNNER_TEMP}/holder-wheel-venv/bin/python" -m pip install --verbose dist/*.whl
    - name: Smoke-test installed wheel without pandas
      if: ${{ matrix.comprehensive }}
      run: |
        "${RUNNER_TEMP}/holder-wheel-venv/bin/python" - <<'PY'
        import importlib.util
        import json
        from importlib.metadata import distribution
        from importlib.resources import files
        import sys
        import tempfile
        from pathlib import Path

        assert importlib.util.find_spec("pandas") is None

        import holderkit
        from holderkit import _native

        installed = distribution("holder-kit")
        assert installed.metadata["Name"] == "holder-kit"
        assert installed.files is not None
        assert all(path.parts[0] != "holder" for path in installed.files)
        assert importlib.util.find_spec("holder") is None
        assert _native.__name__ == "holderkit._native"
        assert _native.Context.__module__ == "holderkit._native"
        assert holderkit.HolderError.__module__ == "holderkit._native"
        resources = files("holderkit")
        assert resources.joinpath("py.typed").is_file()
        assert resources.joinpath("_schema.sql").read_text(encoding="utf-8")
        assert json.loads(resources.joinpath("_core_build.json").read_text(encoding="utf-8"))

        assert "pandas" not in sys.modules
        with tempfile.TemporaryDirectory(prefix="holder-wheel-smoke-") as temporary:
            with holderkit.open(Path(temporary) / "data") as context:
                project = context.create_project("Wheel smoke test")
                card = context.create_card(
                    project.project_id, "Installed wheel", "standalone body"
                )
                assert context.get_card_content(project.project_id, card.card_id) == "standalone body"
                assert context.cards.to_records(project.project_id)[0]["card_id"] == card.card_id
                try:
                    context.cards.to_dataframe(project.project_id)
                except ModuleNotFoundError as error:
                    assert "holder-kit[pandas]" in str(error)
                else:
                    raise AssertionError("base wheel unexpectedly provided pandas")
        PY
    defaults:
      run:
        working-directory: python/kit
  kit-macos:
    needs:
    - kit-changes
    - sdk-macos
    if: needs.kit-changes.outputs.kit == 'true'
    name: macOS 15 / Python 3.12
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Check out holder
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Fetch the core SDK from this run
      uses: ./.github/actions/core-sdk
      with:
        commit: ${{ github.sha }}
    - name: Configure Python build tools
      shell: bash
      run: |
        echo 'CMAKE_GENERATOR=Ninja' >> "$GITHUB_ENV"
        echo "SKBUILD_CMAKE_BUILD_TYPE=$HOLDER_CORE_BUILD_TYPE" >> "$GITHUB_ENV"
    - name: Install native build dependencies
      run: |
        brew install \
          cmake \
          ninja \
          pkg-config \
          nlohmann-json \
          yaml-cpp \
          spdlog \
          sqlite \
          libsodium \
          libgit2 \
          md4c \
          openssl@3
    - name: Build and check an installed Holder Python wheel
      shell: bash
      working-directory: .
      env:
        MACOSX_DEPLOYMENT_TARGET: '15.0'
      run: |
        set -euo pipefail
        work="$(mktemp -d)"
        openssl="$(brew --prefix openssl@3)"
        python -m pip install 'build>=1.2,<2' wheel delocate
        cmake -S python/kit -B "$work/build" -G Ninja \
          -DCMAKE_BUILD_TYPE="$HOLDER_CORE_BUILD_TYPE" \
          -DPython_EXECUTABLE="$(command -v python)" -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_PREFIX_PATH="$(brew --prefix);$openssl" -DOPENSSL_ROOT_DIR="$openssl" \
          -DCMAKE_INSTALL_PREFIX="$work/stage" -DHOLDER_KIT_INSTALL_DIR=holder/_embedded
        cmake --build "$work/build"
        cmake --install "$work/build" --component holder_native
        HOLDER_PYTHON_EMBEDDED_STAGE="$work/stage" \
          python -m build --wheel --outdir "$work/raw" python/holder
        python python/kit/scripts/wheel-notices.py --output "$work/noticed" "$work/raw/"*.whl
        delocate-wheel --require-archs arm64 -v -w "$work/wheels" "$work/noticed/"*.whl
        python -m pip install "$work/wheels/"*macosx_*_arm64.whl
        env -u HOLDER_CORE_SDK -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
          python -I python/holder/scripts/test-installed-wheel.py --embedded \
            --version "$(tr -d '\r\n' < VERSION)" --core-build-type "$HOLDER_CORE_BUILD_TYPE"
    - name: Build and install Holder Kit
      run: |
        python3 -m pip install --upgrade pip
        CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix openssl@3) -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" \
          python3 -m pip install --verbose . 'pytest>=8'
    - name: Run base Python tests
      run: python3 -m pytest --verbose tests/test_holder.py
    - name: Run lifecycle example
      run: python3 examples/card_lifecycle.py
    defaults:
      run:
        working-directory: python/kit
  kit-windows:
    needs:
    - kit-changes
    - sdk-windows
    if: needs.kit-changes.outputs.kit == 'true'
    name: Windows Server 2025 / Python 3.12
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
    - name: Check out holder
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Set up MSVC developer environment
      uses: ilammy/msvc-dev-cmd@v1
    - name: Fetch the core SDK from this run
      uses: ./.github/actions/core-sdk
      with:
        commit: ${{ github.sha }}
    - name: Configure Python build tools
      shell: bash
      run: |
        echo 'CMAKE_GENERATOR=Ninja' >> "$GITHUB_ENV"
        echo "SKBUILD_CMAKE_BUILD_TYPE=$HOLDER_CORE_BUILD_TYPE" >> "$GITHUB_ENV"
    - name: Build and check an installed Holder Python wheel
      shell: bash
      working-directory: .
      run: |
        set -euo pipefail
        work="$(cygpath -m "$RUNNER_TEMP")/holder-python-windows"
        sdk="$HOLDER_CORE_SDK"
        python -m pip install 'build>=1.2,<2'
        cmake -S python/kit -B "$work/build" -G Ninja \
          -DCMAKE_BUILD_TYPE="$HOLDER_CORE_BUILD_TYPE" \
          -DPython_EXECUTABLE="$(python -c 'import pathlib,sys; print(pathlib.Path(sys.executable).as_posix())')" \
          -DCMAKE_TOOLCHAIN_FILE="$sdk/vcpkg/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_INSTALLED_DIR="$sdk/vcpkg/installed" -DVCPKG_TARGET_TRIPLET=x64-windows \
          -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_APPLOCAL_DEPS=OFF \
          -DCMAKE_INSTALL_PREFIX="$work/stage" -DHOLDER_KIT_INSTALL_DIR=holder/_embedded
        cmake --build "$work/build"
        cmake --install "$work/build" --component holder_native
        HOLDER_PYTHON_EMBEDDED_STAGE="$work/stage" \
          python -m build --wheel --outdir "$work/wheels" python/holder
        python -m pip install "$work/wheels/"*win_amd64.whl
        python python/holder/scripts/test-installed-wheel.py --embedded \
          --version "$(tr -d '\r\n' < VERSION)" --core-build-type "$HOLDER_CORE_BUILD_TYPE"
    - name: Build and install Holder Kit
      run: |
        python -m pip install --upgrade pip
        python -m pip install --verbose . "pytest>=8"
    - name: Verify native extension and bundled runtime dependencies
      run: python -c "import holderkit; print(holderkit.__file__)"
    - name: Run base Python tests
      run: python -m pytest --verbose tests/test_holder.py
    - name: Run lifecycle example
      run: python examples/card_lifecycle.py
    defaults:
      run:
        working-directory: python/kit
  kit-ubuntu-packages:
    needs:
    - kit-changes
    - sdk-linux
    if: needs.kit-changes.outputs.kit == 'true' && !contains(github.event.pull_request.labels.*.name, 'ci:skip-launchpad-packages')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"image":"ubuntu:26.04","series":"resolute"}]'
          || '[{"image":"ubuntu:24.04","series":"noble"},{"image":"ubuntu:26.04","series":"resolute"}]') }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    env:
      EXPORTED_KIT: /tmp/export/holder-kit
    steps:
    - name: Install packaging tools
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates git devscripts equivs debhelper cmake ninja-build
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Core packages for core/ in this commit, from holder-sdk or built
      uses: ./.github/actions/core-ubuntu-packages
      with:
        series: ${{ matrix.series }}
    - name: Export python/kit/ on its own, as the Debian source package sees it
      run: |
        mkdir -p "$(dirname "${EXPORTED_KIT}")"
        cp -a python/kit "${EXPORTED_KIT}"
        python3 release/scripts/version.py --prepare-source kit --destination "${EXPORTED_KIT}"
    - name: Build Kit against the installed core packages
      env:
        DEBIAN_FRONTEND: noninteractive
      working-directory: ${{ env.EXPORTED_KIT }}
      run: |
        cp -a packaging/linux/debian debian
        mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' debian/control
        dpkg-buildpackage -b -us -uc -j2
    - name: Check the package's libholder0 requirement
      shell: bash
      working-directory: ${{ env.EXPORTED_KIT }}
      run: |
        set -euo pipefail
        package=$(find .. -maxdepth 1 -name 'python3-holder-kit_*.deb' -print -quit)
        # Kit installs the schema of the core it was built against, so it must require the
        # libholder0 of the same upstream version.
        upstream=$(dpkg-query -W -f='${source:Upstream-Version}' libholder0)
        depends=$(dpkg-deb -f "$package" Depends)
        echo "$depends"
        grep -F "libholder0 (>= ${upstream})" <<< "$depends"
        grep -F "libholder0 (<< ${upstream}.~)" <<< "$depends"
        mkdir -p "$GITHUB_WORKSPACE/out/ubuntu-packages"
        cp "$package" "$GITHUB_WORKSPACE"/out/core-debs/libholder0_*.deb "$GITHUB_WORKSPACE/out/ubuntu-packages/"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: holder-kit-${{ matrix.series }}-packages
        path: out/ubuntu-packages/*.deb
        if-no-files-found: error
  kit-ubuntu-runtime:
    needs:
    - kit-changes
    - kit-ubuntu-packages
    if: needs.kit-changes.outputs.kit == 'true' && !contains(github.event.pull_request.labels.*.name, 'ci:skip-launchpad-packages')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"image":"ubuntu:26.04","series":"resolute"}]'
          || '[{"image":"ubuntu:24.04","series":"noble"},{"image":"ubuntu:26.04","series":"resolute"}]') }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: holder-kit-${{ matrix.series }}-packages
        path: out/ubuntu-packages
    - name: Install and test the packages
      env:
        SERIES: ${{ matrix.series }}
      run: bash python/kit/scripts/ubuntu-package-ci.sh "$SERIES" out/ubuntu-packages
  kit-result:
    name: Kit CI result
    if: always()
    needs:
    - kit-changes
    - kit-checks
    - kit-linux
    - kit-macos
    - kit-windows
    - kit-ubuntu-packages
    - kit-ubuntu-runtime
    - kit-sdk-ready
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
    - name: Check job results
      env:
        SELECTED: ${{ needs.kit-changes.outputs.kit }}
        RESULTS: ${{ toJSON(needs) }}
        SKIP_LAUNCHPAD: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name,
          'ci:skip-launchpad-packages') }}
      run: |
        RESULTS=$(jq 'with_entries(.key = ({"kit-changes": "changes", "kit-checks": "checks", "kit-linux": "linux", "kit-macos": "macos", "kit-sdk-ready": "core-sdk", "kit-ubuntu-packages": "ubuntu-packages", "kit-ubuntu-runtime": "ubuntu-runtime", "kit-windows": "windows"}[.key] // .key))' <<< "$RESULTS")
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
        if [[ "$SKIP_LAUNCHPAD" == true && "$SELECTED" == true ]]; then
          echo '::warning::Ubuntu package and runtime builds skipped by ci:skip-launchpad-packages label'
          echo 'Ubuntu package and runtime builds skipped by the `ci:skip-launchpad-packages` PR label.' >> "$GITHUB_STEP_SUMMARY"
        fi
        jq -e --arg selected "$SELECTED" --arg skip "$SKIP_LAUNCHPAD" '
          .changes.result == "success" and
          (if $selected == "true" then
             ([.checks, .["core-sdk"], .linux, .macos, .windows] | all(.result == "success")) and
             (if $skip == "true" then
                ([.["ubuntu-packages"], .["ubuntu-runtime"]] | all(.result == "skipped"))
              else
                ([.["ubuntu-packages"], .["ubuntu-runtime"]] | all(.result == "success"))
              end)
           else
             ([.checks, .["core-sdk"], .linux, .macos, .windows, .["ubuntu-packages"], .["ubuntu-runtime"]] | all(.result == "skipped"))
           end)' <<< "$RESULTS" > /dev/null
  python-changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
    steps:
    - if: github.event_name == 'pull_request' || github.event_name == 'push'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: select
      name: Select jobs from the changed paths
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
      run: |
        if [[ "$EVENT" != pull_request && "$EVENT" != push ]]; then
          echo "python=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The pull request merge commit's parents are the base and the pull request head.
        if [[ "$EVENT" == pull_request ]]; then
          changed=$(git diff --name-only HEAD^1...HEAD^2)
        elif [[ "$BEFORE" =~ ^0+$ || -z "$BEFORE" ]]; then
          changed=$(git ls-files)
        else
          changed=$(git diff --name-only "$BEFORE" HEAD)
        fi
        # Changes to the orchestration graph exercise all its consumers.
        if grep -qE '^.github/(workflows/(shared-ci|core-ci|daemon-ci|kit-ci|python-check|core-sdk|core-sanitizers)\.yml$|scripts/(generate-shared-ci\.py|tests/test_shared_ci\.py)$)' <<< "$changed"; then
          changed+=$'\nVERSION'
        fi
        printf '%s\n' "$changed"
        if grep -qE '^(VERSION$|python/_build_support\.py$|python/holder/|python/kit/(CMakeLists\.txt$|src/native/|scripts/repair-linux-wheel\.py$)|api/openapi\.yaml$|\.github/workflows/python-check\.yml$|\.github/scripts/fetch-daemon-build\.sh$)' <<< "$changed"; then
          echo "python=true" >> "$GITHUB_OUTPUT"
        else
          echo "python=false" >> "$GITHUB_OUTPUT"
        fi
  python-check:
    needs:
    - python-changes
    if: needs.python-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - '3.11'
        - '3.14'
    defaults:
      run:
        working-directory: python/holder
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -e '.[dev,pandas,graph]' -r requirements-generator.txt
    - run: python scripts/generate.py --check
    - run: ruff check scripts tests src/holder --exclude src/holder/generated
    - run: python -m pytest
    - run: python -m build
  python-live:
    needs:
    - python-changes
    - sdk-linux
    if: needs.python-changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    env:
      BUILD_TYPE: RelWithDebInfo
      STAGE: ${{ github.workspace }}/daemon/out/artifacts/linux-backend
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: key
      name: Compute staged daemon cache key
      run: echo "key=$(.github/scripts/linux-daemon-cache-key.sh "$BUILD_TYPE")" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: daemon/out/artifacts/linux-backend
        key: ${{ steps.key.outputs.key }}
    - id: shelf
      name: Download the daemon for this tree from holder-sdk
      if: steps.restore.outputs.cache-hit != 'true'
      run: .github/scripts/fetch-daemon-build.sh "${{ steps.key.outputs.key }}" "$STAGE"
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14'
    - if: steps.shelf.outputs.found != 'false'
      uses: ./.github/actions/linux-daemon-deps
    - if: steps.shelf.outputs.found == 'false'
      uses: ./.github/actions/linux-daemon-build
      with:
        core-commit: ${{ github.sha }}
        build-type: ${{ env.BUILD_TYPE }}
        build-testing: 'OFF'
        save-ccache: 'false'
    - if: steps.shelf.outputs.found == 'false'
      uses: actions/cache/save@v6
      with:
        path: daemon/out/artifacts/linux-backend
        key: ${{ steps.key.outputs.key }}
    - name: Test the Python API against the staged daemon
      working-directory: python/holder
      run: |
        set -euo pipefail
        multiarch="$(gcc -print-multiarch)"
        export LD_LIBRARY_PATH="${STAGE}/usr/lib/${multiarch}:${STAGE}/usr/lib"
        export HOLDER_TEST_DAEMON="${STAGE}/usr/bin/holderd"
        export HOLDER_TEST_DAEMON_CWD="${STAGE}/usr/share/holder-daemon"
        test -x "${HOLDER_TEST_DAEMON}"
        echo "holderd built from $(cat "${STAGE}/release/holder-daemon-commit.txt")"
        python -m pip install -e '.[dev,pandas,graph]'
        python -m pytest -v tests/test_library_live.py
    - uses: ./.github/actions/core-sdk
      if: steps.shelf.outputs.found != 'false'
      with:
        commit: ${{ github.sha }}
        build-type: ${{ env.BUILD_TYPE }}
    - name: Build and test the repaired native Python wheel
      run: |
        set -euo pipefail
        sudo apt-get install -y --no-install-recommends patchelf
        work="$(mktemp -d)"
        python -m pip install 'build>=1.2,<2' wheel 'auditwheel==6.8.2'
        cmake -S python/kit -B "$work/kit" -G Ninja \
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPython_EXECUTABLE="$(command -v python)" \
          -DCMAKE_INSTALL_PREFIX="$work/stage" -DHOLDER_KIT_INSTALL_DIR=holder/_embedded
        cmake --build "$work/kit"
        cmake --install "$work/kit" --component holder_native
        HOLDER_PYTHON_EMBEDDED_STAGE="$work/stage" \
          python -m build --wheel --outdir "$work/raw" python/holder
        python python/kit/scripts/repair-linux-wheel.py --output "$work/dist" "$work/raw/"*.whl
        python -m venv "$work/test"
        wheels=("$work/dist/"*manylinux_2_39_x86_64.whl)
        "$work/test/bin/python" -m pip install pytest "${wheels[0]}[pandas,graph]"
        "$work/test/bin/python" -m pytest -v python/holder/tests/test_library_live.py \
          -k '(shared_card_operations and embedded) or embedded_recovery_snapshot_restore'
        "$work/test/bin/python" -m pytest -v python/holder/tests/test_workspaces.py
        multiarch="$(gcc -print-multiarch)"
        LD_LIBRARY_PATH="${STAGE}/usr/lib/${multiarch}:${STAGE}/usr/lib" \
        HOLDER_TEST_DAEMON="${STAGE}/usr/bin/holderd" \
        HOLDER_TEST_DAEMON_CWD="${STAGE}/usr/share/holder-daemon" \
          "$work/test/bin/python" -m pytest -v python/holder/tests/test_library_live.py \
            -k 'embedded_profile_ownership or recovery_snapshot_round_trip or copy_large_live_project or large_recovery_bundle'
  python-result:
    name: Python check result
    if: always()
    needs:
    - python-changes
    - python-check
    - python-live
    - python-sdk-ready
    runs-on: ubuntu-latest
    steps:
    - name: Check job results
      env:
        SELECTED: ${{ needs.python-changes.outputs.python }}
        RESULTS: ${{ toJSON(needs) }}
      run: |
        RESULTS=$(jq 'with_entries(.key = ({"python-changes": "changes", "python-check": "check", "python-live": "live", "python-sdk-ready": "core-sdk"}[.key] // .key))' <<< "$RESULTS")
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
        jq -e --arg selected "$SELECTED" '
          .changes.result == "success" and
          ([.check, .["core-sdk"], .live] | all(.result == (if $selected == "true" then "success" else "skipped" end)))' <<< "$RESULTS" > /dev/null
  sdk-linux:
    name: Linux gate / SDK
    needs:
    - core-changes
    - daemon-changes
    - kit-changes
    - python-changes
    if: needs.core-changes.outputs.core == 'true' || needs.daemon-changes.outputs.daemon == 'true' || needs.kit-changes.outputs.kit
      == 'true' || needs.python-changes.outputs.python == 'true'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-sdk.yml
    with:
      platforms: '["linux"]'
      aggregate: false
  sdk-macos:
    name: macos / SDK
    needs:
    - core-changes
    - daemon-changes
    - kit-changes
    - python-changes
    - sdk-linux
    if: needs.core-changes.outputs.core == 'true' || needs.daemon-changes.outputs.daemon == 'true' || needs.kit-changes.outputs.kit
      == 'true'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-sdk.yml
    with:
      platforms: '["macos"]'
      aggregate: false
  sdk-windows:
    name: windows / SDK
    needs:
    - core-changes
    - daemon-changes
    - kit-changes
    - python-changes
    - sdk-linux
    if: needs.core-changes.outputs.core == 'true' || needs.daemon-changes.outputs.daemon == 'true' || needs.kit-changes.outputs.kit
      == 'true'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-sdk.yml
    with:
      platforms: '["windows"]'
      aggregate: false
  sdk-index:
    if: needs.core-changes.outputs.core == 'true' || needs.daemon-changes.outputs.daemon == 'true' || needs.kit-changes.outputs.kit
      == 'true'
    needs:
    - core-changes
    - daemon-changes
    - kit-changes
    - python-changes
    - sdk-linux
    - sdk-macos
    - sdk-windows
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.index.outputs.commit }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        pattern: core-sdk-*-RelWithDebInfo
        path: core/out/core-sdk-assets
        merge-multiple: true
    - id: index
      name: Describe this run's SDKs
      run: python3 scripts/core-sdk.py index --assets out/core-sdk-assets --output out/core-selection.json --commit
        "$(git rev-parse HEAD)" --tree "$(git rev-parse HEAD:core)"
    - uses: actions/upload-artifact@v7
      with:
        name: core-selection
        path: core/out/core-selection.json
        if-no-files-found: error
        retention-days: 7
    defaults:
      run:
        working-directory: core
  core-sanitizers:
    needs:
    - core-changes
    - sdk-linux
    if: needs.core-changes.outputs.core == 'true'
    uses: ./.github/workflows/core-sanitizers.yml
  core-sdk-ready:
    needs:
    - core-changes
    - sdk-linux
    - sdk-macos
    - sdk-windows
    - sdk-index
    if: needs.core-changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    steps:
    - run: echo "Required SDK producers passed; platform consumers verify their artifacts."
  daemon-sdk-ready:
    needs:
    - daemon-changes
    - sdk-linux
    - sdk-macos
    - sdk-windows
    - sdk-index
    if: needs.daemon-changes.outputs.daemon == 'true'
    runs-on: ubuntu-24.04
    steps:
    - run: echo "Required SDK producers passed; platform consumers verify their artifacts."
  kit-sdk-ready:
    needs:
    - kit-changes
    - sdk-linux
    - sdk-macos
    - sdk-windows
    - sdk-index
    if: needs.kit-changes.outputs.kit == 'true'
    runs-on: ubuntu-24.04
    steps:
    - run: echo "Required SDK producers passed; platform consumers verify their artifacts."
  python-sdk-ready:
    needs:
    - python-changes
    - sdk-linux
    if: needs.python-changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
    - run: echo "Required SDK producers passed; platform consumers verify their artifacts."
