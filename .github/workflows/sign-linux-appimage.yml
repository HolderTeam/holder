name: Release / Sign Linux AppImage

on:
  workflow_dispatch:
    inputs:
      release_request:
        description: Optional coordinator request identifier
        type: string
        default: ''
      staging_artifact_id:
        description: Optional immutable staging artifact ID; provide with its ZIP SHA256
        type: string
        default: ''
      staging_artifact_sha256:
        description: SHA256 of the pinned staging artifact ZIP
        type: string
        default: ''
      expected_version:
        description: Exact Holder product version expected in the staged package, for example 2.0.0-dev
        required: true
        type: string
      staging_run_id:
        description: Successful holder-framework staging Linux AppImage workflow run ID to sign
        required: true
        type: string
      staging_repository:
        description: Repository containing the staged Linux AppImage artifact
        required: false
        default: HolderTeam/holder
        type: string
      staging_artifact_name:
        description: Name of the staged Linux AppImage artifact
        required: false
        default: Holder-linux-appimage-staged
        type: string

run-name: ${{ inputs.release_request || format('Sign Linux AppImage {0} from staging run {1}', inputs.expected_version, inputs.staging_run_id) }}

permissions:
  actions: read
  contents: read

concurrency:
  group: linux-appimage-signing
  cancel-in-progress: false

jobs:
  verify-staging:
    name: Verify staged package
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check artifact pin inputs
        env:
          ARTIFACT_ID: ${{ inputs.staging_artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.staging_artifact_sha256 }}
        run: |
          python3 - <<'PY'
          import os
          assert bool(os.environ['ARTIFACT_ID']) == bool(os.environ['ARTIFACT_SHA256']), 'Provide both artifact ID and ZIP SHA256'
          PY

      - name: Download exact staged AppImage artifact
        if: inputs.staging_artifact_id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.staging_artifact_name }}
          path: downloads/linux-staged
          github-token: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          repository: ${{ inputs.staging_repository }}
          run-id: ${{ inputs.staging_run_id }}

      - name: Download and verify the pinned staging artifact
        if: inputs.staging_artifact_id != ''
        env:
          GH_TOKEN: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          STAGING_REPOSITORY: ${{ inputs.staging_repository }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          STAGING_ARTIFACT_NAME: ${{ inputs.staging_artifact_name }}
          ARTIFACT_ID: ${{ inputs.staging_artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.staging_artifact_sha256 }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 release/scripts/linux-candidate.py --repository "$STAGING_REPOSITORY" \
            --run-id "$STAGING_RUN_ID" --artifact-name "$STAGING_ARTIFACT_NAME" \
            --artifact-id "$ARTIFACT_ID" --archive-sha256 "$ARTIFACT_SHA256" \
            --version "$EXPECTED_VERSION" --output downloads/linux-staged

      - name: Install verification dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Verify checksums, archive, and provenance
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          STAGING_ARTIFACT_ID: ${{ inputs.staging_artifact_id }}
          STAGING_ARTIFACT_SHA256: ${{ inputs.staging_artifact_sha256 }}
        run: |
          set -euo pipefail
          release/scripts/linux/verify-staged-appimage.sh \
            downloads/linux-staged \
            "${EXPECTED_VERSION}" \
            work/verified

          provenance="work/verified/provenance.json"
          {
            echo "## Verified staging input"
            echo
            echo "- Product version: \`${EXPECTED_VERSION}\`"
            echo "- Staging run: [${{ inputs.staging_repository }}#${{ inputs.staging_run_id }}](https://github.com/${{ inputs.staging_repository }}/actions/runs/${{ inputs.staging_run_id }})"
            if [ -n "$STAGING_ARTIFACT_ID" ]; then
              echo "- Artifact ID: \`${STAGING_ARTIFACT_ID}\`"
              echo "- Artifact ZIP SHA256: \`${STAGING_ARTIFACT_SHA256}\`"
            fi
            echo "- Desktop: \`$(jq -r '.desktop.repository + "#" + .desktop.run_id + " @ " + .desktop.commit' "${provenance}")\`"
            echo "- Backend: \`$(jq -r '.backend.repository + "#" + .backend.run_id + " @ " + .backend.commit' "${provenance}")\`"
            echo "- Daemon API: \`$(jq -r '.backend.api_version' "${provenance}")\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  sign:
    name: Sign and test release candidate
    needs: verify-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: linux-release-signing
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out protected release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact staged AppImage artifact again
        if: inputs.staging_artifact_id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.staging_artifact_name }}
          path: downloads/linux-staged
          github-token: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          repository: ${{ inputs.staging_repository }}
          run-id: ${{ inputs.staging_run_id }}

      - name: Download and verify the same pinned staging bytes
        if: inputs.staging_artifact_id != ''
        env:
          GH_TOKEN: ${{ secrets.HOLDER_CI_ARTIFACT_TOKEN || github.token }}
          STAGING_REPOSITORY: ${{ inputs.staging_repository }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          STAGING_ARTIFACT_NAME: ${{ inputs.staging_artifact_name }}
          ARTIFACT_ID: ${{ inputs.staging_artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.staging_artifact_sha256 }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 release/scripts/linux-candidate.py --repository "$STAGING_REPOSITORY" \
            --run-id "$STAGING_RUN_ID" --artifact-name "$STAGING_ARTIFACT_NAME" \
            --artifact-id "$ARTIFACT_ID" --archive-sha256 "$ARTIFACT_SHA256" \
            --version "$EXPECTED_VERSION" --output downloads/linux-staged

      - name: Install signing dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl gnupg jq

      - name: Re-verify signing input
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          release/scripts/linux/verify-staged-appimage.sh \
            downloads/linux-staged \
            "${EXPECTED_VERSION}" \
            work/signing-input

      - name: Download pinned AppImage tooling
        env:
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
        run: |
          set -euo pipefail
          install -d out/tools
          curl --fail --location --retry 3 \
            "${APPIMAGETOOL_URL}" \
            -o out/tools/appimagetool-x86_64.AppImage
          curl --fail --location --retry 3 \
            "${APPIMAGE_RUNTIME_URL}" \
            -o out/tools/runtime-x86_64
          echo "${APPIMAGETOOL_SHA256}  out/tools/appimagetool-x86_64.AppImage" | sha256sum -c -
          echo "${APPIMAGE_RUNTIME_SHA256}  out/tools/runtime-x86_64" | sha256sum -c -
          chmod 0755 out/tools/appimagetool-x86_64.AppImage

      - name: Sign AppImage and checksum manifest
        env:
          HOLDER_STAGING_ARTIFACT_ID: ${{ inputs.staging_artifact_id }}
          HOLDER_STAGING_ARTIFACT_SHA256: ${{ inputs.staging_artifact_sha256 }}
          HOLDER_GPG_SIGNING_KEY_B64: ${{ secrets.HOLDER_GPG_SIGNING_KEY_B64 }}
          HOLDER_GPG_SIGNING_PASSPHRASE: ${{ secrets.HOLDER_GPG_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          release/scripts/linux/sign-appimage-candidate.sh \
            work/signing-input \
            out/linux-release-candidate \
            out/tools/appimagetool-x86_64.AppImage \
            out/tools/runtime-x86_64 \
            release/keys/holder-linux-release.asc \
            "${{ inputs.staging_repository }}" \
            "${{ inputs.staging_run_id }}" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_RUN_ID}"

      # The private key and passphrase were scoped to the preceding step. The
      # signing script also destroys its temporary GnuPG home before returning.
      - name: Verify signature and smoke-test signed AppImage
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          release/scripts/linux/verify-signed-appimage.sh \
            out/linux-release-candidate \
            "${EXPECTED_VERSION}" \
            release/keys/holder-linux-release.asc

      - name: Create GitHub artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/linux-release-candidate/Holder-${{ inputs.expected_version }}-x86_64.AppImage

      - name: Summarize signed candidate
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          candidate_dir="out/linux-release-candidate"
          appimage="Holder-${EXPECTED_VERSION}-x86_64.AppImage"
          checksum="$(sha256sum "${candidate_dir}/${appimage}" | cut -d ' ' -f 1)"
          fingerprint="$(
            gpg --batch --with-colons --show-keys release/keys/holder-linux-release.asc |
              awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          {
            echo "## Signed Linux release candidate"
            echo
            echo "- Asset: \`${appimage}\`"
            echo "- SHA-256: \`${checksum}\`"
            echo "- OpenPGP fingerprint: \`${fingerprint}\`"
            echo "- GitHub artifact attestation: created"
            echo
            echo "This workflow does not publish a GitHub release. Promotion remains a separate operation."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload signed release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Holder-linux-appimage-signed-${{ inputs.expected_version }}
          path: out/linux-release-candidate/*
          if-no-files-found: error
          retention-days: 30
          overwrite: true
