name: Linux daemon dependencies
description: Install the Ubuntu packages that build and run holderd
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail

        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          catch2 \
          ninja-build \
          pkg-config \
          libboost-filesystem-dev \
          libssl-dev \
          nlohmann-json3-dev \
          libyaml-cpp-dev \
          libspdlog-dev \
          libsqlite3-dev \
          libsodium-dev \
          libgit2-dev \
          libmd4c-dev \
          libsecret-1-dev
