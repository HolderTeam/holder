name: Linux daemon build
description: >-
  Build holderd against the core SDK and stage its installed tree in
  daemon/out/artifacts/linux-backend. The caller checks out holder and, earlier
  in the same run, builds the SDK with the Core / SDK workflow.
inputs:
  core-commit:
    description: The commit Core / SDK reported
    required: true
  build-type:
    description: SDK and daemon configuration
    default: RelWithDebInfo
  build-testing:
    description: ON also builds the daemon's tests
    default: 'ON'
  save-ccache:
    description: >-
      'false' only restores the compiler cache, for a build that borrows Daemon / CI's (for
      example Python / Check's, without tests) instead of keeping its own
    default: 'true'
runs:
  using: composite
  steps:
    - name: Prepare caste source dependency
      shell: bash
      working-directory: daemon
      run: git submodule update --init --recursive -- submodules/caste

    - uses: ./.github/actions/core-sdk
      with:
        commit: ${{ inputs.core-commit }}
        build-type: ${{ inputs.build-type }}

    - uses: ./.github/actions/linux-daemon-deps

    - name: Install and configure ccache
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get install -y --no-install-recommends ccache
        {
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache"
          echo "CCACHE_NOHASHDIR=true"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_MAXSIZE=1500M"
        } >> "$GITHUB_ENV"

    # Pull requests restore the compiler cache that main saves, as with vcpkg's binary cache.
    - name: Restore compiler cache
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ inputs.build-type }}-${{ inputs.build-testing }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ inputs.build-type }}-${{ inputs.build-testing }}-
          ccache-${{ runner.os }}-${{ inputs.build-type }}-

    - name: Configure CMake
      shell: bash
      working-directory: daemon
      env:
        BUILD_TESTING: ${{ inputs.build-testing }}
      run: |
        cmake \
          -S . \
          -B build-linux \
          -G Ninja \
          -DCMAKE_BUILD_TYPE="$HOLDER_CORE_BUILD_TYPE" \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DBUILD_TESTING="$BUILD_TESTING"

    - name: Build backend executables
      shell: bash
      working-directory: daemon
      run: |
        # Core is prebuilt; this builds daemon executables and, when enabled, integration tests.
        ccache --zero-stats
        cmake \
          --build build-linux \
          --parallel

    - name: Show compiler cache statistics
      if: always()
      shell: bash
      run: ccache --show-stats --verbose

    - name: Save compiler cache
      if: github.event_name != 'pull_request' && inputs.save-ccache == 'true'
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ inputs.build-type }}-${{ inputs.build-testing }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Remove older compiler caches
      if: github.event_name != 'pull_request' && inputs.save-ccache == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: .github/scripts/prune-run-caches.sh "ccache-${{ runner.os }}-${{ inputs.build-type }}-${{ inputs.build-testing }}-"

    - name: Stage installed backend
      shell: bash
      working-directory: daemon
      run: |
        set -euo pipefail

        stage_dir="${PWD}/out/artifacts/linux-backend"
        install -d "${stage_dir}/release"

        DESTDIR="${stage_dir}" cmake --install build-linux

        # Subproject install rules also provide development files. The
        # AppImage component artifact needs the shared caste runtime, but
        # not headers, static archives, CMake package files, or man pages.
        rm -rf \
          "${stage_dir}/usr/include" \
          "${stage_dir}/usr/share/man"
        find "${stage_dir}/usr/lib" -type f -name '*.a' -delete
        find "${stage_dir}/usr/lib" -type d -name cmake -prune \
          -exec rm -rf {} +

        tr -d '[:space:]' < ../VERSION \
          > "${stage_dir}/release/holder-daemon-version.txt"
        tr -d '[:space:]' < ../api/API_VERSION \
          > "${stage_dir}/release/holder-daemon-api-version.txt"
        printf '%s\n' "$(git rev-parse HEAD)" \
          > "${stage_dir}/release/holder-daemon-commit.txt"

        (
          cd "${stage_dir}"
          find . \( -type f -o -type l \) \
            ! -path './release/holder-daemon-manifest.txt' \
            | sed 's#^\./##' \
            | sort \
            > release/holder-daemon-manifest.txt
        )

        find "${stage_dir}" -type f | sort
