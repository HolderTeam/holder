[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "backend"
backend-path = ["_build_backend"]

[project]
name = "holder-kit"
dynamic = ["version"]
description = "Holder Kit: CPython bindings for embedded libholder"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"

[project.optional-dependencies]
test = ["mypy>=1.15", "pandas", "pandas-stubs", "pytest>=8", "networkx", "types-networkx"]
pandas = ["pandas", "pandas-stubs"]
graph = ["networkx", "types-networkx"]

[project.urls]
Repository = "https://github.com/HolderTeam/holder/tree/main/python/kit"

[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.22"
cmake.build-type = "RelWithDebInfo"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/holderkit"]
sdist.include = ["VERSION", "_build_support.py", "_build_backend/backend.py"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '(?P<value>\S+)'

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src/holderkit", "examples", "tests", "scripts/develop.py"]
