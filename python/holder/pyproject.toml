[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "holder-python"
version = "0.2.5"
description = "Control your knowledge using Python"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["httpx>=0.23.1,<0.29", "attrs>=22.2", "typing-extensions>=4.5"]

[project.urls]
Repository = "https://github.com/HolderTeam/holder/tree/main/python/holder"
Issues = "https://github.com/HolderTeam/holder/issues"

[project.optional-dependencies]
dev = [
    "ruff==0.16.10",
    "pytest>=8,<10",
    "build>=1.2,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/holder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
