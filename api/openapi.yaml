                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: router_result}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/AiRunEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
