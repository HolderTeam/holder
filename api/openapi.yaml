  /projects/{project_id}/repair-hierarchy:
    post:
      summary: Find, and optionally fix, cards hidden under missing or trashed parents
      description: A live card whose parent is missing or trashed cannot be reached by browsing from the
        project's top level. This can happen after an older client trashed a parent, a card file was removed
        by hand, or a sync brought either in. Without apply, this only reports, reading the database alone
        (so it works on a locked encrypted project). With apply, each hidden branch moves to its nearest
        live, reachable ancestor (or the top level), into the place its trashed ancestor held, with its
        descendants still attached, in one commit. Applying twice changes nothing the second time. Cards
        in parent cycles are reported and left alone. The daemon also repairs at startup and core repairs
        after every pull.
      parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HierarchyRepairRequest'}
      responses:
        '200':
          description: The plan, and whether it was applied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HierarchyRepairResponse'}
        '400':
          description: Invalid body, or a privacy error applying to an encrypted project
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Project not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '501':
          description: The daemon has no card store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: The keyring needed to write an encrypted project is unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
