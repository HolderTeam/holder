  /locations/{location_id}/oauth/google-drive/callback:
    get:
      summary: Finish connecting a Google Drive location
      description: Google redirects the user's browser here after authorization, so the request carries
        no token; the state from the authorize call authenticates it instead. The daemon exchanges the
        code, creates the location's Drive folder if needed, and binds the location. A failure is answered
        with 400 and an HTML page that explains it.
      security: []
      parameters:
      - name: location_id
        in: path
        required: true
        schema: {type: string}
      - name: code
        in: query
        required: false
        schema: {type: string}
      - name: state
        in: query
        required: false
        schema: {type: string}
      - name: error
        in: query
        required: false
        schema: {type: string}
        description: Set by Google when the user declined or authorization failed.
      responses:
        '200':
          description: An HTML page telling the user the location is connected
          content:
            text/html:
              schema: {type: string}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
