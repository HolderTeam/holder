              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    post:
      summary: Create and execute an AI run with routing and streaming
      description: Creates one run and streams run_started (with run_id), provider-dependent progress/router/fallback/chunk
        events, then done or failed. Every frame has an opaque replay ID. Reconnect via GET /ai/runs/{run_id}/events
        rather than repeating this POST. Disconnecting does not cancel execution; terminal events follow
        persisted status.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiRunCreateRequest'}
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema: {type: string}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: No local runner or configured cloud provider available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      x-sse-events:
        run_started: {$ref: '#/components/schemas/AiRunEventData'}
        chunk: {$ref: '#/components/schemas/AiRunEventData'}
        done: {$ref: '#/components/schemas/AiRunEventData'}
        failed: {$ref: '#/components/schemas/AiRunEventData'}
