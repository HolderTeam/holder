      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiMessageGetResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    patch:
      summary: Update an AI message
      parameters:
      - name: message_id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
