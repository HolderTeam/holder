      summary: Create and execute an AI run with routing and streaming
      description: Creates one run and streams run_started (with run_id), provider-dependent progress/router/fallback/chunk
        events, then done or failed. Every frame has an opaque replay ID. Reconnect via GET /ai/runs/{run_id}/events
        rather than repeating this POST. Disconnecting does not cancel execution; terminal events follow
