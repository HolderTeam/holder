        in: query
        required: false
        schema: {type: integer}
        description: Set to 1 to include deleted messages.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiMessageListResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
