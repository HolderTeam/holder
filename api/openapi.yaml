              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      summary: Delete links from an AI message
      description: Provide to_card_id (and optional to_type/kind) to delete matching links. A fully specified
        selector without target_project_id is rejected if more than one target project matches. Provide
