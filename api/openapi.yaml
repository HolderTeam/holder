              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Project encryption setup failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Keyring unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      summary: Delete a project
      description: Removes the project from this device's database and records its removal so startup
        discovery and database reconstruction do not automatically import it again. Project files and
        encryption keys are retained for explicit recovery. Creating or importing the project explicitly
        registers it again.
      parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectDeleteResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Could not persist the project removal; the database deletion is rolled back.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /projects/{project_id}/cards:
    get:
      summary: Page through a project's live cards
      description: Filters combine. Each page reads current data; iteration is not a snapshot.
      parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string}
      - name: tag
        in: query
        required: false
        schema: {type: string, minLength: 1}
        description: Exact tag match, case-insensitive, without the leading
      - name: parent
        in: query
        required: false
        schema:
          oneOf:
          - type: string
            enum: [roots]
          - {type: string, format: uuid, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[47][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'}
        description: Omit for all hierarchy levels; roots selects root cards; a card ID selects its immediate
          children.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum: [card_id_asc, updated_desc, sort_key_asc]
          default: card_id_asc
        description: updated_desc breaks ties by descending card ID. sort_key_asc follows sibling order
          and breaks ties by ascending card ID; use it with parent=roots or a parent card ID.
      - name: limit
        in: query
        required: false
        schema: {type: integer, default: 200, minimum: 1, maximum: 5000}
      - name: cursor
        in: query
        required: false
        schema: {type: string, minLength: 1, maxLength: 8192}
        description: Continuation from next_cursor. Keep the project, filters and ordering unchanged.
      - name: include_content
        in: query
        required: false
        schema: {type: boolean, default: false}
        description: Include each card's body. The page is selected and every body read under one project
          lock, and the whole page fails if a body cannot be read (for example a locked encrypted project).
          limit is at most 1000 when true. The cursor is the same with or without content.
      - name: include_child_count
        in: query
        required: false
        schema: {type: boolean, default: false}
        description: Include each returned live card's immediate live child count. The cursor is the same
          with or without counts.
      responses:
        '200':
          description: A page of matching cards
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardPageResponse'}
        '400':
          description: Invalid parameter or cursor, including a cursor from a different query, or a privacy
            error reading content
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Project not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '405':
          description: Method not allowed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '501':
          description: Content pages unavailable because the daemon has no card store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: The keyring needed to read an encrypted project's content is unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /projects/{project_id}/cards/{card_id}/breadcrumbs:
