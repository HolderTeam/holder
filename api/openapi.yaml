    post:
      summary: Move/reparent/reorder a card using card move intent
      description: Placement is resolved and written under the project lock. When the card's new neighbours
        leave no room between their sort keys (tied keys, or a gap used up by repeated moves), nearby
        siblings are re-spaced in the same commit, keeping their order. The response describes only the
        moved card, so a client holding other cards' sort_key values should refresh the listing.
