        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      summary: Move card to trash
      description: 'The card and every changed card are written in one commit. With children=promote (the
        default), the card''s immediate live children take its place among its siblings (or the project''s
        top level) in their existing order, keeping their own descendants; children already in Trash stay
        there. With children=trash_subtree, every live descendant goes to Trash with the card and keeps
        its parent there, including live cards beneath descendants that were already trashed, which keep
        their own trash time. Restoring is always single-card: see POST /cards/{card_id}/restore.'
      parameters:
      - name: card_id
        in: path
        required: true
        schema: {type: string}
      - name: children
        in: query
        required: false
        schema:
          type: string
          enum: [promote, trash_subtree]
          default: promote
        description: What happens to the card's live children. Any other value is rejected before anything
          changes.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardPatchResponse'}
        '400':
          description: Invalid children value, or the card cannot be trashed (for example it is already
            in Trash)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
