# Generated by RIG from the declarations in daemon/src/api, and by holder_contract from contract/;
# edit those, then run make -C api/rig update and make -C contract update. Do not edit this file.
openapi: 3.2.0
info: {title: Holder API, version: 0.1.0}
servers:
- {url: /}
- {url: 'http://127.0.0.1:11499'}
security:
- bearerAuth: []
paths:
  /ai/capabilities:
    get:
      summary: Get local model runner capabilities
      parameters:
      - name: runner_id
        in: query
        required: false
        schema: {type: string}
        description: The runner whose installed models decide recommended_install; defaults to auto-local.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunnerCapabilitiesResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/local-models/config:
    get:
      summary: Get local model configuration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiLocalModelConfigResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    put:
      summary: Set or clear local model configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiLocalModelConfigUpdateRequest'}
      responses:
        '200':
          description: The stored configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiLocalModelConfigResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/messages:
    get:
      summary: List AI messages by thread
      parameters:
      - name: thread_id
        in: query
        required: true
        schema: {type: string, minLength: 1}
      - name: include_deleted
        in: query
        required: false
        schema:
          type: integer
          enum: [0, 1]
        description: Set to 1 to include deleted messages.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiMessageListResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    post:
      summary: Create an AI message
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiMessageCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiMessageCreateResponse'}
        '400':
          description: Bad request, including a thread that does not exist
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: A message with this ID already exists
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/messages/capture:
    post:
      summary: Capture prompt/response pair with provenance
      description: Appends the prompt as a user message and the response as an assistant message carrying
        provider, model, url and context.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiMessageCaptureRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiMessageCaptureResponse'}
        '400':
          description: Malformed request, or a thread in another project
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Project or thread not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: A generated ID already exists
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/messages/{message_id}:
    get:
      summary: Fetch an AI message
      description: A message in the trash is not found.
      parameters:
      - name: message_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiMessageGetResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    patch:
      summary: Update an AI message
      parameters:
      - name: message_id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiMessageUpdateRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiMessageUpdateResponse'}
        '400':
          description: Bad request, including a message in the trash
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      summary: Move an AI message to trash
      parameters:
      - name: message_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiMessageUpdateResponse'}
        '400':
          description: The message is already in the trash
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/messages/{message_id}/backlinks:
    get:
      summary: List backlinks to an AI message
      parameters:
      - name: message_id
        in: path
        required: true
        schema: {type: string}
      - name: include_deleted
        in: query
        required: false
        schema:
          type: integer
          enum: [0, 1]
        description: Include backlinks from deleted sources.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardLinkListResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/messages/{message_id}/links:
    get:
      summary: List outgoing links for an AI message
      parameters:
      - name: message_id
        in: path
        required: true
        schema: {type: string}
      - name: include_deleted
        in: query
        required: false
        schema:
          type: integer
          enum: [0, 1]
        description: Include links to deleted local targets. External card links remain listed even when
          their targets are unavailable or trashed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardLinkListResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    post:
      summary: Create or update a link from an AI message
      parameters:
      - name: message_id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CardLinkCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardLinkCreateResponse'}
        '400':
          description: Bad request, including an invalid link target
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      summary: Delete links from an AI message
      description: Provide to_card_id (and optional to_type/kind) to delete matching links. A fully specified
        selector without target_project_id is rejected if more than one target project matches. Provide
        target_project_id together with to_card_id, to_type and kind to select one qualified target. If
        to_card_id is omitted, deletes all outgoing links.
      parameters:
      - name: message_id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CardLinkDeleteRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiMessageCreateResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/messages/{message_id}/restore:
    post:
      summary: Restore an AI message from trash
      parameters:
      - name: message_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiMessageUpdateResponse'}
        '400':
          description: The message is not in the trash
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/nudges:
    get:
      summary: List a project's current nudges
      description: Nudges whose evidence no longer holds are removed before listing, and dismissed nudges
        are left out.
      parameters:
      - name: project_id
        in: query
        required: true
        schema: {type: string, minLength: 1}
      - name: card_id
        in: query
        required: false
        schema: {type: string}
        description: Only this card's nudges; empty means every card's.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiNudgeListResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/nudges/evaluate:
    post:
      summary: Evaluate a nudge candidate and record the nudge it warrants
      description: Answers whether the candidate is accepted and whether it warrants a nudge, with the
        reason. A candidate the daemon does not know is answered, not rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiNudgeCandidate'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiNudgeEvaluateResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/nudges/{nudge_id}/dismiss:
    post:
      summary: Dismiss a nudge
      parameters:
      - name: nudge_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiNudgeDismissResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Nudge not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/providers/catalog:
    get:
      summary: Get provider-agnostic cloud catalog with configured flags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviderCatalogResponse'}
        '400':
          description: The AI catalog could not be found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/providers/credentials:
    get:
      summary: List configured cloud provider credentials
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviderCredentialsListResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    put:
      summary: Create or update a cloud provider API key
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiProviderCredentialUpsertRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviderCredentialUpsertResponse'}
        '400':
          description: Malformed request, an invalid provider name, or an empty api_key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Secret store unavailable, or it failed storing the key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/providers/credentials/{provider}:
    delete:
      summary: Delete a configured cloud provider API key
      description: Removes the stored key and disables the provider. Deleting a provider with no key succeeds.
      parameters:
      - name: provider
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviderCredentialDeleteResponse'}
        '400':
          description: Invalid provider name
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Secret store unavailable, or it failed removing the key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/providers/settings:
    get:
      summary: List cloud provider enabled settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviderSettingsResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    put:
      summary: Set whether a cloud provider is enabled
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiProviderSettingUpdateRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviderSettingResponse'}
        '400':
          description: Malformed request or an invalid provider name
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/providers/settings/{provider}:
    delete:
      summary: Remove a cloud provider enabled override
      parameters:
      - name: provider
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviderSettingDeleteResponse'}
        '400':
          description: Invalid provider name
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/runner/pull:
    post:
      summary: Start pulling a local model
      description: Pulls on runner_id, or the auto-local runner when it is omitted or empty. Follow progress
        with GET /ai/runner/pull/{job_id} or its events stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model: {type: string}
                runner_id: {type: string}
              required: [model]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunnerPullStartResponse'}
        '400':
          description: Malformed request, or the runner rejected the pull
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Runner not configured
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Runner unavailable (runner_unavailable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/runner/pull/{job_id}:
    get:
      summary: Fetch pull job status
      parameters:
      - name: runner_id
        in: query
        required: false
        schema: {type: string}
      - name: job_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunnerPullStatusResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/runner/pull/{job_id}/events:
    get:
      summary: Stream pull job progress (SSE)
      description: Streams the job's progress snapshot whenever it changes; completed or failed closes
        the stream. A reconnect receives the current snapshot, and once the pull has finished it is answered
        with 204, the event-stream standard's signal to stop reconnecting. Disconnecting does not cancel
        the pull.
      parameters:
      - name: runner_id
        in: query
        required: false
        schema: {type: string}
      - name: Last-Event-ID
        in: header
        schema: {type: string}
        description: Opaque SSE event ID, sent by a reconnecting client.
      - name: job_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              itemSchema:
                oneOf:
                - type: object
                  properties:
                    event: {const: progress}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/RunnerPullJob'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: completed}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/RunnerPullJob'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: failed}
                    data:
                      type: string
                      contentMediaType: application/json
