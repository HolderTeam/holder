  /ai/runner/pull/{job_id}/events:
    get:
      summary: Stream pull job progress (SSE)
      description: Streams progress snapshots on status changes; completed or failed closes the stream.
        Pull event IDs are connection-local; reconnect without Last-Event-ID to fetch current progress
        after resync_required. Disconnecting does not cancel the pull.
      parameters:
      - name: runner_id
        in: query
        required: false
        schema: {type: string}
      - name: Last-Event-ID
        in: header
        schema: {type: string}
        description: Opaque SSE event ID; unavailable history emits resync_required and closes.
      - name: job_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema: {type: string}
        '400':
          description: Invalid query or cursor
          content:
            application/json:
