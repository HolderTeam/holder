  /projects/{project_id}/repair-hierarchy:
    post:
      summary: Find, and optionally fix, cards hidden under missing or trashed parents
      description: A live card whose parent is missing or trashed cannot be reached by browsing from the
        project's top level. This can happen after an older client trashed a parent, a card file was removed
        by hand, or a sync brought either in. Without apply, this only reports, reading the database alone
        (so it works on a locked encrypted project). With apply, each hidden branch moves to its nearest
        live, reachable ancestor (or the top level), into the place its trashed ancestor held, with its
        descendants still attached, in one commit. Applying twice changes nothing the second time. Cards
        in parent cycles are reported and left alone. The daemon also repairs at startup and core repairs
        after every pull.
      parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HierarchyRepairRequest'}
      responses:
        '200':
          description: The plan, and whether it was applied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HierarchyRepairResponse'}
        '400':
          description: Invalid body, or a privacy error applying to an encrypted project
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Project not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '405':
          description: Method not allowed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '501':
          description: The daemon has no card store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: The keyring needed to write an encrypted project is unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /projects/{project_id}/tags:
    get:
      summary: List project tags with live-card counts
      parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Project tags ordered by descending card count, then ascending tag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectTagListResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Project not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /projects/{project_id}/trash/{type}/{id}:
    delete:
      summary: Permanently remove a trashed item from one project
      description: The item must belong to the named project and still be in Trash. For cards, older Git
        revisions remain available; this operation does not erase repository history.
      parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string}
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum: [card, ai_message]
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Trashed item removed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrashDeleteResponse'}
        '400':
          description: Invalid item type or identifier
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Item not found in the named project
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Item is not in Trash
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '501':
          description: Card store unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /rebuild:
    post:
      summary: Rebuild database state from project files
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RebuildRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RebuildResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Project not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /recovery-token/import:
    post:
      summary: Import recovery token and auto-match/create project
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectRecoveryTokenImportRequest'}
      responses:
        '200':
          description: Imported and matched an existing local project_id
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryTokenImportAutoResponse'}
        '201':
          description: Imported and created a new local project_id from token metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryTokenImportAutoResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Keyring unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /reindex:
    post:
      summary: Rebuild search indexes from database state
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReindexResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /resources:
    get:
      summary: List project resources or attachments to a live card
      description: With card_id, returns an authoritative live-card attachment join in updated_at descending,
        resource_id ascending order. Without card_id, preserves the unpaginated project resource list.
        Detach preserves project resources; delete removes them globally.
      parameters:
      - name: card_id
        in: query
        required: false
        schema: {type: string}
        description: Complete resolved live card ID; must belong to project_id.
      - name: limit
        in: query
        required: false
        schema: {type: integer, default: 100, minimum: 1, maximum: 1000}
        description: Requires card_id.
      - name: offset
        in: query
        required: false
        schema: {type: integer, minimum: 0, default: 0}
        description: Requires card_id.
      - name: project_id
        in: query
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceListResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Live card not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Card is in a different project
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    post:
      summary: Create a resource
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /resources/{resource_id}:
    get:
      summary: Get a resource with its assets and placements
      parameters:
      - name: resource_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    patch:
      summary: Update a resource
      parameters:
      - name: resource_id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceUpdateRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      summary: Delete a resource and remove its Card links
      parameters:
      - name: resource_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceDeleteResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /resources/{resource_id}/assets/{asset_id}/content:
    get:
      summary: Stream verified asset content
      description: Authenticated binary download. Content-Type preserves the asset media type and Content-Disposition
        contains a sanitized quoted original filename. Successful content is arbitrary bytes, not a JSON
        envelope; failures use ErrorResponse. Without placement_id the daemon selects a stored placement.
      parameters:
      - name: resource_id
        in: path
        required: true
        schema: {type: string}
      - name: asset_id
        in: path
        required: true
        schema: {type: string}
      - name: placement_id
        in: query
        required: false
        schema: {type: string}
      responses:
        '200':
          description: Recovered plaintext asset
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
          headers:
            Content-Type:
              description: Stored asset media type.
              schema: {type: string}
            Content-Disposition:
              description: Attachment disposition with sanitized quoted original filename.
              schema: {type: string}
        '400':
          description: Invalid configuration, missing key, or unclassified retrieval/integrity failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource, asset, or placement not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Storage binding required or storage conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Asset integrity verification failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Storage authentication or permission failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Storage unavailable or transient failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '507':
          description: Storage capacity exceeded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /search/ai:
    get:
      summary: Search AI messages
      parameters:
      - name: project_id
        in: query
        required: true
        schema: {type: string}
      - name: q
        in: query
        required: true
        schema: {type: string}
      - name: limit
        in: query
        required: false
        schema: {type: integer}
      - name: offset
        in: query
        required: false
        schema: {type: integer}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchMessagesResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /search/cards:
    get:
      summary: Search cards
      parameters:
      - name: project_id
        in: query
        required: true
        schema: {type: string}
      - name: q
        in: query
        required: true
        schema: {type: string}
      - name: limit
        in: query
        required: false
        schema: {type: integer}
      - name: offset
        in: query
        required: false
        schema: {type: integer}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchCardsResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /trash:
    get:
      summary: List trashed items by project
      parameters:
      - name: project_id
        in: query
        required: true
        schema: {type: string, minLength: 1}
      - name: type
        in: query
        required: false
        schema: {type: string}
        description: card | ai_message | all
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrashListResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      summary: Empty trash by project
      parameters:
      - name: project_id
        in: query
        required: true
        schema: {type: string}
      - name: type
        in: query
        required: false
        schema: {type: string}
        description: card | ai_message | all
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrashDeleteResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /trash/{type}/{id}:
    delete:
      summary: Permanently delete a trashed item (legacy global-ID route)
      description: The item must still be in Trash. Use the project-scoped route for new clients.
      parameters:
      - name: type
        in: path
        required: true
        schema: {type: string}
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrashDeleteResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Item not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Item is not in Trash
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '501':
          description: Card store unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: token}
  schemas:
    AiLocalModelConfigData:
      type: object
      properties:
        fast_model:
          type: [string, 'null']
        strong_model:
          type: [string, 'null']
        deep_model:
          type: [string, 'null']
        updated_at:
          type: [integer, 'null']
          format: int64
      required: [fast_model, strong_model, deep_model, updated_at]
    AiLocalModelConfigResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data: {$ref: '#/components/schemas/AiLocalModelConfigData'}
      required: [ok, data]
    AiLocalModelConfigUpdateRequest:
      type: object
      properties:
        fast_model:
          type: [string, 'null']
        strong_model:
          type: [string, 'null']
        deep_model:
          type: [string, 'null']
        updated_at:
          type: [integer, 'null']
          format: int64
    AiMessage:
      type: object
      properties:
        message_id: {type: string}
        thread_id: {type: string}
        role: {type: string}
        source: {type: string}
        provider:
          type: [string, 'null']
        model:
          type: [string, 'null']
        content: {type: string}
        created_at: {type: integer, format: int64}
        deleted_at:
          type: [integer, 'null']
          format: int64
        prompt_hash:
          type: [string, 'null']
        meta_json:
          type: [string, 'null']
      required: [message_id, thread_id, role, source, content, created_at]
    AiMessageCaptureRequest:
      type: object
      properties:
        project_id: {type: string}
        thread_id:
          type: [string, 'null']
        prompt: {type: string}
        response: {type: string}
        source:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        model:
          type: [string, 'null']
        url:
          type: [string, 'null']
        context:
          type: [object, 'null']
          additionalProperties: true
        created_at:
          type: [integer, 'null']
          format: int64
      required: [project_id, prompt, response]
    AiMessageCaptureResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            thread_id: {type: string}
            user_message_id: {type: string}
            assistant_message_id: {type: string}
          required: [thread_id, user_message_id, assistant_message_id]
      required: [ok, data]
    AiMessageCreateRequest:
      type: object
      properties:
        message_id: {type: string, description: Optional; server generates if omitted.}
        thread_id: {type: string}
        role: {type: string}
        source: {type: string}
        provider:
          type: [string, 'null']
        model:
          type: [string, 'null']
        content: {type: string}
        created_at: {type: integer, format: int64, description: Optional; server uses current time if
            omitted or 0.}
        prompt_hash:
          type: [string, 'null']
        meta_json:
          type: [string, 'null']
      required: [thread_id, role, source, content]
    AiMessageCreateResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            message_id: {type: string}
          required: [message_id]
      required: [ok, data]
    AiMessageGetResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data: {$ref: '#/components/schemas/AiMessage'}
      required: [ok, data]
    AiMessageListResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: array
          items: {$ref: '#/components/schemas/AiMessage'}
      required: [ok, data]
    AiMessageUpdateRequest:
      type: object
      properties:
        role:
          type: [string, 'null']
        source:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        model:
          type: [string, 'null']
        content:
          type: [string, 'null']
        created_at: {type: integer, format: int64}
        prompt_hash:
          type: [string, 'null']
        meta_json:
          type: [string, 'null']
    AiMessageUpdateResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            message_id: {type: string}
          required: [message_id]
      required: [ok, data]
    AiProviderCatalogProvider:
      type: object
      properties:
        id: {type: string}
        display_name: {type: string}
        enabled: {type: boolean}
        configured: {type: boolean}
        api:
          type: [object, 'null']
          additionalProperties: true
        auth:
          type: [object, 'null']
          additionalProperties: true
        models:
          type: array
          items: {type: object, additionalProperties: true}
        setup_url:
          type: [string, 'null']
        docs_url:
          type: [string, 'null']
        api_key_label:
          type: [string, 'null']
        api_key_hint:
          type: [string, 'null']
      required: [id, display_name, enabled, configured, api, auth, models]
    AiProviderCatalogResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            default_provider:
              type: [string, 'null']
            providers:
              type: array
              items: {$ref: '#/components/schemas/AiProviderCatalogProvider'}
          required: [providers]
      required: [ok, data]
    AiProviderCredential:
      type: object
      properties:
        provider: {type: string}
        configured: {type: boolean}
        api_key_preview: {type: string}
        created_at: {type: integer, format: int64}
        updated_at: {type: integer, format: int64}
      required: [provider, configured, api_key_preview, created_at, updated_at]
    AiProviderCredentialDeleteResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            provider: {type: string}
          required: [provider]
      required: [ok, data]
    AiProviderCredentialUpsertRequest:
      type: object
      properties:
        provider: {type: string}
        api_key: {type: string}
        updated_at:
          type: [integer, 'null']
          format: int64
      required: [provider, api_key]
    AiProviderCredentialUpsertResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data: {$ref: '#/components/schemas/AiProviderCredential'}
      required: [ok, data]
    AiProviderCredentialsListResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            providers:
              type: array
              items: {$ref: '#/components/schemas/AiProviderCredential'}
          required: [providers]
      required: [ok, data]
    AiProviderSetting:
      type: object
      properties:
        provider: {type: string}
        enabled: {type: boolean}
        updated_at: {type: integer, format: int64}
      required: [provider, enabled, updated_at]
    AiProviderSettingDeleteResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            provider: {type: string}
          required: [provider]
      required: [ok, data]
    AiProviderSettingResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data: {$ref: '#/components/schemas/AiProviderSetting'}
      required: [ok, data]
    AiProviderSettingUpdateRequest:
      type: object
      properties:
        provider: {type: string}
        enabled: {type: boolean}
        updated_at: {type: integer, format: int64}
      required: [provider, enabled]
    AiProviderSettingsResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            providers:
              type: array
              items: {$ref: '#/components/schemas/AiProviderSetting'}
          required: [providers]
      required: [ok, data]
    AiRunCreateRequest:
      type: object
      properties:
        prompt: {type: string}
        mode: {type: string, description: auto or model}
        model: {type: string, description: Optional explicit model id; interpreted for local or cloud
            selected provider.}
        provider: {type: string, description: Optional cloud provider id when local runner is unavailable.}
