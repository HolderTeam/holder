  /bye:
    post:
      summary: Say that this client is leaving
      description: A hint, never a command. A daemon started with `--idle-exit` normally waits out its
        whole idle period after the last client has gone; after this request it waits only a few seconds
        (3), and only while nothing else happens. Running work, an open event stream, a new connection
        or any other request keeps it running, so another client is never cut off by one client leaving.
        A daemon without `--idle-exit`, such as the systemd service, ignores it. There is no request body,
        and nothing is returned beyond acknowledgement. Clients call it best-effort as they close; a client
        that crashes simply never does, and the daemon then falls back to its idle period.
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ByeResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /calendar:
    get:
      summary: List project milestones and card activity in a time range
      description: This legacy calendar view selects milestone start values and card activity by epoch
        timestamps; both from and to are inclusive. Calendar-day values use UTC midnight in this view.
        Undated milestones are omitted. Date parsing and timezone conversion are client concerns because
        this endpoint accepts epoch seconds.
      parameters:
      - name: project_id
        in: query
        required: true
        schema: {type: string, minLength: 1}
      - name: from
        in: query
        required: true
        schema: {type: integer, format: int64}
        description: Inclusive lower bound in Unix epoch seconds.
      - name: to
        in: query
        required: true
        schema: {type: integer, format: int64}
        description: Inclusive upper bound in Unix epoch seconds.
      responses:
        '200':
          description: Calendar activity in the requested inclusive epoch-second range.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectCalendarResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Project not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
