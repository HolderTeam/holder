        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CardLinkCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardLinkCreateResponse'}
        '400':
          description: Bad request
          content:
