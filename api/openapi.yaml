  /events:
    get:
      operationId: stream_changes
      summary: Subscribe to committed daemon state changes (SSE)
      description: 'Sends ready, then project.changed, card.changed, resource.changed,

        location.changed, thread.changed, message.changed and run.changed invalidations.

        Intermediate states can coalesce. Each frame has an opaque id and JSON data.

        Without a cursor starts at the current tail. Last-Event-ID replays bounded

        in-memory history. Restart, an expired cursor or last_revision without a

        replayable cursor returns resync_required with current Git revisions and

        history URLs, then closes. This endpoint does not synthesize events from Git.

        Refresh current state on resync; Git is the durable project history.

        Comments provide heartbeats. Disconnecting unsubscribes without cancelling jobs.

        '
      parameters:
      - name: project_id
        in: query
        required: false
        schema: {type: string, minLength: 1}
      - name: last_revision
        in: query
        required: false
        schema: {type: string, pattern: '^[0-9a-f]{40}$'}
        description: Last-known project Git revision for recovery; requires project_id. An unavailable
          replay explicitly requires refresh, even when HEAD is unchanged.
      - name: Last-Event-ID
        in: header
        schema: {type: string}
        description: Opaque cursor from a previous frame or /events/cursor.
      responses:
        '200':
          description: Live SSE stream; ready or resync_required is the first event
          content:
            text/event-stream:
              itemSchema:
                oneOf:
                - type: object
                  properties:
                    event: {const: ready}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/EventCheckpoint'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: project.changed}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/ChangeEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: card.changed}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/ChangeEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: resource.changed}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/ChangeEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: location.changed}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/ChangeEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: thread.changed}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/ChangeEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: message.changed}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/ChangeEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: run.changed}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/ChangeEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: resync_required}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/EventResyncData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
        '400':
          description: Invalid query or cursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Project not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Internal server error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Observer or project unavailable, or stream limit reached
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
