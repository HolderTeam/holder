    get:
      summary: List cards
      description: With tag, returns the project's live cards carrying that tag and ignores the other
        filters.
      parameters:
      - name: project_id
        in: query
        required: true
        schema: {type: string, minLength: 1}
      - name: tag
        in: query
        required: false
        schema: {type: string}
        description: Exact normalized tag to match, without the leading
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum: [tree, recent]
          default: tree
        description: Card list mode. tree returns one hierarchy level (roots or a parent's children);
          recent returns recently updated cards.
      - name: parent_card_id
        in: query
        required: false
        schema: {type: string}
        description: Optional when view=tree. Omit for roots; set to return that parent card's children.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum: [tree_default, updated_desc, title_asc]
        description: 'Card ordering strategy. Defaults are view-aware: tree uses tree_default

          (sort_key asc, updated_at desc, title asc), recent uses updated_desc.

          '
      - name: count
        in: query
        required: false
        schema: {type: boolean, default: false}
        description: Include count fields (child_count) in returned card items.
      - name: limit
        in: query
        required: false
