  /projects/{project_id}/history/cards/{card_id}/compare:
    get:
      summary: Compare saved card versions or the change introduced by one revision
      description: In since mode, compares the explicitly selected from and to snapshots. In change mode,
        compares the first parent of to with to; a root commit is compared with a previously nonexistent
        card. Merge commits use only their first parent, not a combined multi-parent diff.
      parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string}
      - name: card_id
        in: path
        required: true
        schema: {type: string}
      - name: from
        in: query
        required: false
        schema: {$ref: '#/components/schemas/RevisionReference'}
        description: Required and used in since mode; change mode derives its base from to.
      - name: to
        in: query
        required: true
        schema: {$ref: '#/components/schemas/RevisionReference'}
        description: The ending revision, or the revision whose introduced change is requested.
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum: [since, change]
          default: since
        description: Since compares two explicit snapshots; change compares to with its first parent.
      responses:
        '200':
          description: A line-oriented card comparison
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardHistoryComparisonResponse'}
        '400':
          description: Invalid or missing comparison parameters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Project or revision not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: A revision reference is ambiguous or the encrypted project key is unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '413':
          description: The bounded History response would exceed 2 MiB
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Project history is temporarily unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /projects/{project_id}/history/cards/{card_id}/restore:
    post:
      summary: Restore a card to a saved snapshot
      description: Restores the complete card snapshot at the selected commit and records the result as
        a new commit without rewriting history. Lifecycle rules still apply. Restoring a snapshot in which
        the card was trashed promotes its current live children, as trashing does. Restoring a live snapshot
        places the card under a reachable parent, as restoring from Trash does.
      parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string}
      - name: card_id
        in: path
        required: true
        schema: {type: string}
      - name: oid
        in: query
        required: true
        schema: {$ref: '#/components/schemas/RevisionReference'}
        description: Revision containing the snapshot to restore.
      responses:
        '200':
          description: Card snapshot restored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardHistoryRestoreResponse'}
        '400':
          description: Missing revision reference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Project, card, or revision not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: A revision reference is ambiguous or the encrypted project key is unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: The historical snapshot cannot be read or restored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
