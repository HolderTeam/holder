  /ai/runs/{run_id}/events:
    get:
      summary: Stream run events (SSE)
      description: Replays bounded retained run events with absolute event IDs; done or failed closes
        the stream. Missing in-memory history can recover persisted terminal status. An expired or foreign
        cursor emits resync_required; fetch the run before reconnecting. A reconnect after the stream's
        last event is answered with 204, the event-stream standard's signal to stop reconnecting.
      parameters:
      - name: Last-Event-ID
        in: header
        schema: {type: string}
        description: Opaque SSE event ID; unavailable history emits resync_required and closes.
      - name: run_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              itemSchema:
                oneOf:
                - type: object
                  properties:
                    event: {const: run_started}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/AiRunEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
