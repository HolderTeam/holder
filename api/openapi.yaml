                  properties:
                    event: {const: progress}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/AiRunEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: router}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/AiRunEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: router_result}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/AiRunEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: chunk}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/AiRunEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: fallback}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/AiRunEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: done}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/AiRunEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: failed}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/AiRunEventData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
                - type: object
                  properties:
                    event: {const: resync_required}
                    data:
                      type: string
                      contentMediaType: application/json
                      contentSchema: {$ref: '#/components/schemas/AiStreamResyncData'}
                    id: {type: string}
                    retry: {type: integer, minimum: 0}
                  required: [event, data]
        '204': {description: 'The run has finished and Last-Event-ID is past its last event: stop reconnecting'}
        '400':
          description: Invalid query or cursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
