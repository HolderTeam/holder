          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrashDeleteResultResponse'}
        '400':
          description: Invalid argument.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: The thing asked for does not exist, or is in the trash.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: The item still exists but is not in Trash, so permanent removal is refused. An
            encrypted project's key is not on this device; the project's recovery token restores it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: 'A project''s stored data is damaged or unsafe: an encrypted file does not decrypt,
            or holds plaintext. Unexpected failure.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: 'The keyring that holds an encrypted project''s key cannot be used: it is locked,
            or this device has none.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
