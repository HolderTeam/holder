<!doctype html>
<html lang="en" data-base-url="{{ site.baseurl | default: '' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}
  </title>

  <meta name="description" content="{{ site.description }}">
  <meta name="theme-color" content="#151515">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script defer src="{{ '/assets/js/downloads.js' | relative_url }}"></script>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/holder-icon.png' | relative_url }}" alt="" width="36" height="36">
      <span>Holder</span>
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/#download' | relative_url }}">Download</a>
      <a href="https://github.com/HolderTeam">Source</a>
    </nav>
  </header>

  <main class="page-shell">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>Holder is free and open source software.</p>
    <p>
      <a href="https://github.com/HolderTeam">GitHub</a>
      <a href="https://github.com/HolderTeam/holder-release/releases/latest">Releases</a>
    </p>
  </footer>
</body>
</html>
